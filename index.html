<!doctype html>
<meta charset="utf-8">
<title>Spellbrawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen battle table — rivals across the top, the market in the middle, your hand at the bottom, battle log on the right */
:root{
  --bg:#141019; --panel:#1f1826; --panel2:#2a2032; --line:#3b2f46;
  --ink:#efe6d6; --mute:#a99bb0; --accent:#ff7a3d; --gold:#f0c35a;
  --hp:#e5485f; --def:#59c2c7; --paper:#efe3c8; --paper-ink:#2a1f1a;
  --felt1:#33203f; --felt2:#160d1c; --wood:#4a2d1c;
  --t-starter:#8a8079; --t-spell:#d4502f; --t-creature:#4f9a4a; --t-treasure:#c99a2e;
  --t-wizard:#6a5bd1; --t-location:#2f8f93; --t-legend:#a3243b; --t-wild:#c23f9a;
  --t-bent:#6b5a45; --t-familiar:#d0679b; --t-chaos:#26202b;
  --f-display:"Pirata One", "Georgia", serif;
  --f-body:"Chakra Petch", "Tahoma", "Leelawadee UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(ellipse at 50% -20%, #3a1d2e 0%, transparent 60%);}
button{font-family:inherit}
.app{display:flex;flex-direction:column;gap:12px;padding:12px 16px;min-height:100%}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;color:var(--accent);letter-spacing:.5px;line-height:1}
header.top .sub{color:var(--mute);font-size:12px}
header.top .sp{flex:1}
.btn{background:var(--accent);color:#1a0f0a;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.sect-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
/* tabletop: rivals seated top / left / right, board in the middle, your mat at the bottom */
.table{display:grid;gap:14px;min-width:0;
  grid-template-columns:minmax(210px,250px) minmax(0,1fr) minmax(210px,250px);
  grid-template-areas:"top top top" "left board right" "you you you"}
.seat-top{grid-area:top;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.seat-top .rival{width:min(100%,380px)}
.seat-top:empty{display:none}
.seat-left{grid-area:left;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.seat-right{grid-area:right;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
@media (max-width:1150px){
  .table{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "left" "right" "board" "you"}
  .seat-left,.seat-right{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .seat-left .rival,.seat-right .rival{width:min(100%,380px)}
}
.rival{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rival.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 0 24px #ff7a3d33}
.seatdir{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rival .ong{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.linkbtn:hover{border-color:var(--gold);color:var(--gold)}
.boardc{grid-area:board;min-width:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2));
  border:10px solid var(--wood);box-shadow:0 0 0 2px var(--gold) inset,0 10px 40px #000a}
.arena{border:1px solid color-mix(in srgb, var(--gold) 28%, transparent);border-radius:14px;padding:12px 14px;min-height:220px;
  background:radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);transition:box-shadow .3s}
.arena.busy{box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 32px color-mix(in srgb, var(--accent) 22%, transparent)}
.arena-pw{color:var(--gold);font-size:16px}
/* casting arena keeps one fixed size: one row of cards that are all --arena-h tall (long ability text shrinks to fit,
   see fitNames), with room for the ✲ button; when the row is full the cards overlap instead of wrapping */
.arena{--arena-h:330px}
.arena .cards.played{flex-wrap:nowrap;align-items:flex-start;height:calc(var(--arena-h) + 40px);gap:6px;padding-right:126px}
.arena .cards.played>.slot{flex:0 1 132px;min-width:22px;position:relative}
.arena .cards.played>.slot:hover{z-index:5}
.arena .cards.played>.slot>.card,.arena .cards.played>.slot>.act-wrap{width:132px}
.arena .cards.played .card{height:var(--arena-h);min-height:0;overflow:hidden}
.arena .cards.played .card .c-text{overflow:hidden}
.arena .cards.played>.empty{align-self:center}
.arena>.sect-label{height:26px;display:flex;align-items:center;gap:10px;margin-bottom:6px} /* same height with or without the events button */
.arena>.sect-label .ev-btn{padding-top:2px;padding-bottom:2px}
.arena-title{min-height:30px}
/* "what happened" strip: each affected card with a coloured caption */
.cards.events{gap:12px}
.ev{display:flex;flex-direction:column;align-items:center;gap:4px}
.ev-cap{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);max-width:112px;text-align:center;line-height:1.3}
.ev-gain .ev-cap{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.ev-bad .ev-cap{background:#5b2a7a;color:#fff;border-color:#8c4bb8}
.ev-discard .ev-cap{background:#3a3340;color:var(--ink)}
.ev-destroy .ev-cap{background:var(--hp);color:#fff;border-color:var(--hp)}
.ev-reveal .ev-cap,.ev-defend .ev-cap{background:var(--def);color:#06282a;border-color:var(--def)}
.ev-act .ev-cap{background:var(--accent);color:#1a0f0a;border-color:var(--accent)}
/* centre-screen pop-up of the latest affected cards (does not block clicks) */
#pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;display:flex;gap:16px;flex-wrap:nowrap;justify-content:center;max-width:96vw}
@media (max-width:760px){
  #pop{gap:8px} #pop .card{width:118px} #pop .card .c-name{font-size:14px} #pop .card .c-text{font-size:10px}
  #pop .ev-cap{font-size:11px;max-width:118px} #pop .pop-item:nth-last-child(n+4){display:none} /* latest 3 only */
}
#pop .pop-item{display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .32s cubic-bezier(.2,1.3,.4,1)}
#pop.out .pop-item{animation:popout .3s forwards}
#pop .ev-cap{font-size:15px;max-width:220px;padding:4px 12px;box-shadow:0 4px 14px #000a}
#pop .card{width:200px;box-shadow:0 18px 50px #000d}
#pop .card .c-name{font-size:21px}
#pop .card .c-text{font-size:13px}
@keyframes popin{from{transform:scale(.7) translateY(30px)}to{transform:none}} /* no opacity: visible even if animations are paused */
@keyframes popout{to{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#pop .pop-item,#pop.out .pop-item{animation:none}}
.arena .card.fresh{animation:deal .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{0%{transform:translateY(-50px) rotate(-8deg) scale(1.3);opacity:0;filter:brightness(2.4)}
  55%{transform:translateY(4px) rotate(1deg) scale(1.03);opacity:1;filter:brightness(1.4);box-shadow:0 0 0 3px var(--gold),0 0 44px var(--band)}
  100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.arena .card.fresh{animation:none}}
.arena-title{font-family:var(--f-display);font-size:22px;color:var(--gold);margin-bottom:8px}
.arena-title span{font-family:var(--f-body);font-size:13px;color:var(--ink)}
.rival .rname{display:flex;align-items:baseline;gap:8px}
.rival .rname b{font-family:var(--f-display);font-size:22px;font-weight:400;color:var(--pc,var(--ink))}
.pname{font-weight:600}
.trait{font-size:11px;color:var(--gold)}
.hpbar{height:10px;background:#000a;border-radius:5px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.chip.trophy{background:var(--gold);color:#2a1d05;border-color:var(--gold);font-weight:700}
.chip.skull{background:#3a1520;border-color:#6b2333}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px);background:#5a1a26}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
/* market */
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.mgroup{display:flex;flex-direction:column;gap:4px}
.mgroup .cap{font-size:11px;color:var(--mute)}
/* Legend hall: its own band above the Line-Up, so the two markets read separately */
.legend-hall{display:flex;flex-direction:column;gap:10px;padding:10px 14px 16px;border-radius:14px;
  border:1px solid color-mix(in srgb, var(--t-legend) 60%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--t-legend) 26%, transparent), transparent 85%)}
.hall-title{font-family:var(--f-display);font-size:24px;color:var(--gold);line-height:1;text-align:center}
.hall-title span{font-family:var(--f-body);font-size:12px;color:var(--mute);margin-left:8px}
.legend-hall .cards{justify-content:center;gap:22px}
.market-row{border-top:1px dashed color-mix(in srgb, var(--gold) 30%, transparent);padding-top:14px}
.piles{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;justify-content:center}
.piles b{color:var(--ink)}
/* cards */
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{width:132px;min-height:184px;background:var(--paper);color:var(--paper-ink);border-radius:8px;display:flex;flex-direction:column;
  border:3px solid var(--band,#888);position:relative;cursor:default;user-select:none;transition:transform .12s}
.card .c-head{display:flex;align-items:center;gap:6px;background:var(--band);color:#fff;padding:4px 6px}
.card .c-cost{min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1d05;display:grid;place-items:center;font-weight:700;font-size:13px}
.card .c-cost:empty{display:none}
.card .c-name{font-family:var(--f-display);font-size:17px;line-height:1.05}
.card .c-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;color:#6d5c52;border-bottom:1px dashed #c9b894}
.card .c-text{font-size:11.5px;line-height:1.35;padding:5px 6px;flex:1}
.card .c-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;gap:4px}
/* board market (Legends, Line-Up, Wild Surge…): name, cost, picture and type only; right-click shows the full card.
   Cards in the casting arena keep their full text. */
.boardc .card:not(.arena .card) .c-text,.boardc .card:not(.arena .card) .c-foot{display:none}
.boardc .card:not(.arena .card){min-height:0}
.boardc .card:not(.arena .card) .c-type{border-bottom:0;padding:4px 6px 6px}
.tag{font-size:9.5px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;margin-right:2px}
.tag.act{background:var(--gold);color:#2a1d05}
.act-wrap{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.act-btn{padding:6px 8px;font-size:13px;box-shadow:0 0 14px #f0c35a66}
.tag.atk{background:var(--hp)} .tag.def{background:var(--def);color:#06282a} .tag.ong{background:#2f8f93}
.tag.uniq{background:var(--gold);color:#2a1d05}
.c-vp{font-weight:700;font-size:12px;color:#7a4e00;white-space:nowrap}
.card.small{width:112px;min-height:150px}
.card.small .c-name{font-size:15px}
.card.small .c-text{font-size:10.5px}
.card.mini{width:96px;min-height:0}
.card.mini .c-text,.card.mini .c-foot,.card.mini .c-type,.card.mini .c-art{display:none}
.card .c-art{aspect-ratio:1/1;width:100%;max-width:100%;background:linear-gradient(135deg,var(--band),#00000055);background-size:cover;background-position:center;border-bottom:2px solid var(--band)}
/* square art at every card size: the art box follows the card width */
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.art-item{display:flex;flex-direction:column;gap:6px;align-items:center}
.art-item .row{display:flex;gap:4px}
.board-preview{width:100%;max-width:520px;aspect-ratio:16/9;border-radius:12px;border:6px solid var(--wood);display:grid;place-items:center;color:var(--mute);font-size:12px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2))}
/* Chaos cards: the shared art/chaos.jpg fills the whole card, text sits on a dark scrim over it */
.card.t-chaos{position:relative;overflow:hidden;aspect-ratio:1/2;min-height:auto;background:#140c1c;color:#f3eaff;border-color:#7a4bb0}
.card.t-chaos .c-art{position:absolute;inset:0;aspect-ratio:auto;height:100%;border:0;z-index:0}
.card.t-chaos > :not(.c-art):not(.zoom-btn){position:relative;z-index:1}
.card.t-chaos .c-head{justify-content:center;padding:3px 26px 16px;background:linear-gradient(#000e 40%,#0000)}
.card.t-chaos .c-cost{display:none}
/* the face shows a glowing glitchy CHAOS logo; the numbered name stays for logs and tooltips */
.card.t-chaos .c-name{font-size:27px;line-height:1.05;letter-spacing:.14em;text-transform:uppercase;transform:skewX(-8deg);
  background:linear-gradient(180deg,#fff 0%,#ecd6ff 30%,#b46cff 58%,#4dffa0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #ff2bd680) drop-shadow(-2px 0 0 #2bffb480) drop-shadow(0 0 7px #b46cffcc)}
.card.small.t-chaos .c-name{font-size:22px}
.card.zoomed.t-chaos .c-name{font-size:52px}
.card.t-chaos .c-type{margin-top:auto;color:#d9c8ff;border:0;background:#0009}
.card.t-chaos .c-text{flex:0 0 auto;background:#000b;color:#fff;text-shadow:0 1px 2px #000}
.card.t-chaos .c-foot{background:#000b}
.card.t-chaos.mini{aspect-ratio:auto}
.card.buyable{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 0 18px #f0c35a55}
.card.buyable:hover,.card.playable:hover{transform:translateY(-4px)}
.card.playable{cursor:pointer}
.card.dim{opacity:.55}
.card.back{background:repeating-linear-gradient(45deg,#3a1d2e,#3a1d2e 8px,#2a1522 8px,#2a1522 16px);color:var(--ink);border-color:var(--t-legend);align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-size:20px;padding:10px}
.t-starter{--band:var(--t-starter)} .t-spell{--band:var(--t-spell)} .t-creature{--band:var(--t-creature)}
.t-treasure{--band:var(--t-treasure)} .t-wizard{--band:var(--t-wizard)} .t-location{--band:var(--t-location)}
.t-legend{--band:var(--t-legend)} .t-wild{--band:var(--t-wild)} .t-bent{--band:var(--t-bent)}
.t-familiar{--band:var(--t-familiar)} .t-chaos{--band:var(--t-chaos)} .t-token{--band:#4a2440}
/* you */
.you{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.you.active{border-color:var(--accent)}
.rival,.you{border-left:5px solid var(--pc,var(--line))} /* player colour (PLAYER_COLORS) */
.rival.active,.you.active{border-left-color:var(--pc,var(--accent))}
.youbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{display:flex;flex-direction:column;align-items:center;min-width:64px}
.big .v{font-family:var(--f-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.big.hp .v{color:var(--hp)} .big.pw .v{color:var(--gold)}
.youbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.you{grid-area:you}
.zones{display:grid;grid-template-columns:auto minmax(0,1fr) 280px;gap:12px}
@media (max-width:1100px){.zones{grid-template-columns:auto minmax(0,1fr)}.zones .logbox{grid-column:1/-1}}
@media (max-width:640px){.zones{grid-template-columns:minmax(0,1fr)}}
.pilebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.logbox{background:#00000033;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;max-height:330px;min-width:0}
.count-badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#1a0f0a;font-weight:700;border-radius:12px;padding:2px 8px;font-size:12px;box-shadow:0 2px 6px #0008}
.vgroup{display:flex;flex-direction:column;gap:6px;width:100%}
.vgroup h4{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--gold)}
.vgroup .cards{gap:14px}
.zone{min-width:0}
.empty{color:var(--mute);font-size:12px;font-style:italic;padding:8px 0}
/* log */
.loglist{overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.loglist div{padding:3px 6px;border-radius:4px;background:#ffffff06;line-height:1.35}
.loglist .dmg{color:#ff9aa8} .loglist .kill{color:#fff;background:#6b2333} .loglist .turn{color:var(--accent);font-weight:700;background:transparent;border-top:1px solid var(--line);padding-top:6px}
.loglist .good{color:#9fe0a0} .loglist .sys{color:var(--gold)}
/* overlay */
/* card zoom */
.overlay.zoom-ov{z-index:80;cursor:zoom-out} /* two classes: must beat the later .overlay{z-index:50} (choice dialogs) */
.zoom-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.zoom-hint{font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
/* any card that can be zoomed shows a magnifier cursor; right-click opens it large, a left-click on the big card closes it */
.card[data-zoom],.card.buyable[data-zoom],.card.playable[data-zoom],.opts .opt-card .card[data-zoom]{cursor:zoom-in}
/* card names: at most 2 lines; fitNames() shrinks the font of longer ones */
.card .c-name{display:block;overflow:hidden;max-height:calc(2em * 1.05 + 1px);overflow-wrap:anywhere}
.card.zoomed{width:min(340px,86vw);min-height:0;cursor:default;transform:none;box-shadow:0 24px 70px #000d}
.card.zoomed .c-head{padding:10px 14px}
.card.zoomed .c-name{font-size:30px}
.card.zoomed .c-cost{min-width:38px;height:38px;font-size:20px}
/* zoomed art is square too (width-driven) */
.card.zoomed .c-type{font-size:13px;padding:6px 14px}
.card.zoomed .c-text{font-size:16px;line-height:1.55;padding:12px 14px}
.card.zoomed .c-foot{padding:10px 14px}
.card.zoomed .tag{font-size:12px;padding:2px 7px}
.card.zoomed .c-vp{font-size:17px}
.overlay{position:fixed;inset:0;background:#0b0810dd;display:grid;place-items:center;z-index:50;padding:16px;overflow-y:auto}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow-y:auto}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--accent);text-wrap:balance}
.dialog .msub{color:var(--mute);font-size:13px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.opts .opt-card .card{cursor:pointer}
.opts .opt-card .card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--gold)}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
label.fld input,label.fld select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.rules{font-size:13px;line-height:1.6;color:var(--ink)}
.rules h3{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:20px;margin:10px 0 2px}
.rules ul{margin:4px 0;padding-left:20px}
/* rules infographic */
.dialog.wide{max-width:1040px}
.rg{width:100%;display:flex;flex-direction:column;gap:10px}
.rg h3{margin:14px 0 0;display:flex;align-items:center;gap:10px}
.rg h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 50%,transparent),transparent)}
.rg small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.rg-note{font-size:12px;color:var(--mute);background:var(--panel2);border-left:3px solid var(--gold);border-radius:4px;padding:6px 10px}
.rg-hero{text-align:center;padding:18px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
  background:radial-gradient(ellipse at top,#4a2a3a,var(--panel2) 70%);display:flex;flex-direction:column;gap:10px;align-items:center}
.rg-kicker{font-size:11px;letter-spacing:.2em;color:var(--gold)}
.rg-big{font-family:var(--f-display);font-size:30px;line-height:1.1;color:var(--ink);text-wrap:balance}
.rg-formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.rg-formula>b{font-size:22px;color:var(--mute)}
.rg-pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;line-height:1.3}
.rg-pill.gold{border-color:var(--gold);color:var(--gold)} .rg-pill.bad{border-color:var(--hp);color:#ff8a9a}
.rg-pill.mute{color:var(--mute)} .rg-pill.win{background:var(--gold);color:#2a1d05;border-color:var(--gold)}
.rg-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rg-tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.rg-tiles.end .rg-tile{align-items:center;text-align:center;font-size:26px}
.rg-num{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--gold)}
.rg-lbl{font-weight:600;font-size:13px}
.rg-small{font-size:11px;color:var(--mute)}
.rg-bar{display:flex;height:20px;border-radius:5px;overflow:hidden;gap:2px;margin:4px 0}
.rg-bar i{font-style:normal;font-size:10px;display:grid;place-items:center;color:#fff;white-space:nowrap;overflow:hidden}
.rg-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rg-board>div{border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px}
.rg-board b{display:block;font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--ink);line-height:1.1}
.rg-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;counter-reset:s}
.rg-flow li{position:relative;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:26px 10px 10px;font-size:12px;color:var(--mute)}
.rg-flow li b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.rg-flow li em{font-style:normal;color:var(--gold);font-weight:700}
.rg-flow li>span{position:absolute;top:-14px;left:10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1a0d06;display:grid;place-items:center;font-weight:700}
.rg-flow li:not(:last-child)::after{content:"➜";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--accent);font-size:15px}
.rg-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rg-box{border-radius:10px;padding:12px;background:var(--panel2);border:1px solid var(--line)}
.rg-box.atk{border-color:color-mix(in srgb,var(--hp) 60%,transparent)} .rg-box.def{border-color:color-mix(in srgb,var(--def) 60%,transparent)}
.rg-boxh{font-family:var(--f-display);font-size:22px;margin-bottom:6px}
.rg-box.atk .rg-boxh{color:#ff8a9a} .rg-box.def .rg-boxh{color:var(--def)}
.rg-targets{display:flex;flex-wrap:wrap;gap:6px}
.rg-targets span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.rg-loop{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;justify-content:center}
.rg-loop>i{font-style:normal;align-self:center;color:var(--mute);font-size:20px}
.rg-step{flex:1;min-width:140px;text-align:center;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.rg-step.bad{border-color:var(--hp);color:#ff8a9a} .rg-step.good{border-color:#4f9a4a;color:#9fe0a0}
.rg-types{display:flex;flex-wrap:wrap;gap:6px}
.rg-types span{background:var(--c);border:1px solid var(--c);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;text-shadow:0 1px 2px #0008}
.rg-keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:4px 0 0;font-size:12px}
.rg-keys dt{color:var(--gold);font-weight:700} .rg-keys dd{margin:0;color:var(--ink)}
.rg-how{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.rg-how>div{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mute)}
.rg-how b{display:block;color:var(--ink)}
@media (max-width:560px){.rg-flow li:not(:last-child)::after{display:none}.rg-big{font-size:24px}}
table.score{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.score th,table.score td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score tr.win td{color:var(--gold);font-weight:700}
.tablewrap{overflow-x:auto}
/* ambient pulses: --ph is reset by render() so the glow keeps its phase when the board is redrawn */
.card.buyable{animation:buyglow 1.6s ease-in-out infinite var(--ph,0ms)}
@keyframes buyglow{50%{box-shadow:0 0 0 2px var(--gold),0 0 30px #f0c35aaa}}
.rival.active,.you.active{animation:activeglow 1.6s ease-in-out infinite var(--ph,0ms)}
@keyframes activeglow{50%{box-shadow:0 0 0 1px var(--accent) inset,0 0 40px #ff7a3d66}}
/* FX layer: lives outside #board so render() never wipes an effect mid-flight */
.app{position:relative;z-index:1}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fx{position:absolute;pointer-events:none;will-change:transform,opacity}
.fx.spark{left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.fx.spark.coin{width:13px;height:13px;background:radial-gradient(circle at 35% 35%,#fff6c8,#f0c35a 45%,#a8761a);box-shadow:0 0 12px #f0c35a}
.fx.orb{left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c) 45%,transparent 72%);box-shadow:0 0 26px 10px var(--c)}
.fx.float{font-family:var(--f-display);font-size:46px;line-height:1;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 14px currentColor,0 3px 0 #000,0 0 3px #000}
.fx.float.dmg{color:#ff4d5e} .fx.float.crit{font-size:70px;color:#ff2d45}
.fx.float.heal{color:#7dffa0} .fx.float.curse{color:#c79bff;font-size:28px}
.fx.ring{width:130px;height:130px;border-radius:50%;border:4px solid var(--def);box-shadow:0 0 30px var(--def),inset 0 0 30px var(--def);transform:translate(-50%,-50%)}
.fx.seatflash{border-radius:10px;mix-blend-mode:screen}
.fx.screen{width:100%;height:100%}
.fx.vig-red{background:radial-gradient(ellipse at center,transparent 30%,#c8001ebb)}
.fx.vig-blood{background:radial-gradient(ellipse at center,#0000 20%,#3a0010ee)}
.fx.vig-violet{background:radial-gradient(ellipse at center,transparent 25%,#5a10a0cc)}
.fx.flash{background:#fff}
.fx.banner{width:100%;transform:translateY(-50%);text-align:center;padding:20px 16px;
  background:linear-gradient(90deg,transparent,#000d 18%,#000d 82%,transparent);border-block:2px solid var(--bc)}
.banner .b-title{font-family:var(--f-display);font-size:clamp(40px,8vw,92px);line-height:1;color:var(--bc);
  text-shadow:0 0 28px var(--bc),0 4px 0 #000;animation:btitle .7s cubic-bezier(.2,1.4,.4,1) both}
.banner .b-sub{font-size:clamp(14px,2.4vw,20px);color:var(--ink);margin-top:8px;letter-spacing:.05em}
@keyframes btitle{from{transform:scale(2.4);opacity:0;letter-spacing:.35em;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.banner.kill{--bc:#ff3b4f} .banner.legend{--bc:#ff5470} .banner.chaos{--bc:#c27dff}
.banner.gold,.banner.win{--bc:var(--gold)} .banner.turn{--bc:var(--accent)} .banner.lose{--bc:#a99bb0}
.banner.small{padding:10px 16px} .banner.small .b-title{font-size:clamp(26px,4vw,42px)}
/* Chaos reveal: the card held big in the centre of a lightning storm */
.fx.storm{background:radial-gradient(ellipse at 50% 25%,#2a1745e0,#07040ef5 70%)}
.fx.storm-cv{left:0;top:0}
.fx.chaos-show{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;cursor:pointer;padding:16px}
.chaos-show .cs-title{font-family:var(--f-display);font-size:clamp(40px,7vw,80px);line-height:1;color:#c27dff;text-shadow:0 0 30px #c27dff,0 4px 0 #000;animation:btitle .7s cubic-bezier(.2,1.4,.4,1) both}
.chaos-show .cs-card{zoom:var(--k,2);animation:csin .8s cubic-bezier(.2,1.3,.4,1) both,csglow 1.2s ease-in-out .8s infinite}
.chaos-show .cs-card .card{box-shadow:0 0 0 2px #c27dff,0 0 40px #9b4dff}
@keyframes csin{from{transform:translateY(-60vh) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes csglow{50%{filter:drop-shadow(0 0 16px #b06cff) brightness(1.08)}}
.chaos-show .cs-hint{font-size:12px;color:var(--mute);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.chaos-show .cs-card,.chaos-show .cs-title{animation:none}}
@media (prefers-reduced-motion:reduce){.card.buyable,.rival.active,.you.active,.banner .b-title{animation:none}}
/* online play: lobby, waiting pill, seat tags */
.online-box{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;width:100%}
.online-btns{display:flex;gap:8px;flex-wrap:wrap}
.lobby{display:flex;flex-direction:column;gap:10px;width:100%}
.roomcode{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roomcode .k{color:var(--mute);font-size:12px}
.roomcode b{font-family:var(--f-display);font-size:40px;letter-spacing:.18em;color:var(--gold);line-height:1}
.roomlink{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:12px}
.lobby-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.lobby-list .waiting{color:var(--mute);font-style:italic}
.lobby-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seattag{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--mute);font-weight:400;vertical-align:middle}
.waitpill{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:#f0c35a22;border:1px solid #f0c35a66;color:var(--gold);font-size:12px;animation:waitp 1.6s ease-in-out infinite}
@keyframes waitp{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.waitpill{animation:none}}
.err{color:var(--hp)}

<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let G = null, uidc = 1, AI_DELAY = 650;
// ME = the seat this browser shows and controls: 0 offline and for the host of an online room, the guest's own seat otherwise
let ME = 0;
const meP = () => G.players[ME];

const TYPE_TH = { token:'Dead Wizard Token', starter:'การ์ดเริ่มต้น', spell:'คาถา · Spell', creature:'สัตว์อสูร · Creature', treasure:'สมบัติ · Treasure',
  wizard:'พ่อมด · Wizard', location:'สถานที่ · Location', legend:'ตำนาน · Legend', wild:'เวทป่าเถื่อน · Wild', bent:'ไม้กายสิทธิ์ปวกเปียก',
  familiar:'สัตว์รับใช้ · Familiar', chaos:'โกลาหล · Chaos' };

/* ---------------- card definitions ---------------- */
const DEFS = {};
const DUP_IDS = []; // a second def() with the same id silently replaces the first card: simulate() reports these
function def(id, o) {
  if (DEFS[id]) DUP_IDS.push(id); DEFS[id] = { id, cost: 0, vp: 0, ...o }; }
function make(id) { return { ...DEFS[id], uid: uidc++ }; }
const P = (p, n) => { if (G.attackOnly && G.attackOnly.owner === p) return; G.turn.power += n; };

// starters
def('rune', { name:'Rune', type:'starter', power:1, text:'+1 พลัง' });
def('wand', { name:'Wand', type:'starter', power:1, atk:1, text:'+1 พลัง<br><b>โจมตี:</b> ศัตรูที่เลือกรับ 1 ดาเมจ ถ้าฆ่าได้ จั่ว 2 ใบ',
  play: async p => { await attack(p, { to:'choose', dmg:1, onKill: async () => draw(p, 2) }); } });
def('weirdwand', { name:'Weird Wand', type:'starter', power:1, atk:1,
  text:'+1 พลัง<br><b>โจมตี:</b> ผู้เล่นที่เลือกรับ 1 ดาเมจ ถ้าเขาตายจาก Weird Wand นำการ์ดจากกองทิ้งของคุณใส่มือเขาได้สูงสุด 2 ใบ',
  play: async p => {
    await attack(p, { to:'choose', dmg:1, onKill: async t => {
      for (let k = 0; k < 2 && p.discard.length; k++) {
        // AI hands over its worst cards (Limp Wand / Fizzle first); a player may stop early
        const worst = p.discard.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
        const c = p.isAI ? (aiVal(worst) <= 0 ? worst : null)
          : await humanChoose(p, `Weird Wand: ใส่การ์ดจากกองทิ้งเข้ามือ ${t.name} (${k + 1}/2)`, [...p.discard.map(x => ({ card: x, value: x })), { label: 'พอแล้ว', value: null, ghost: true }]);
        if (!c) break;
        p.discard.splice(p.discard.indexOf(c), 1); await toHand(t, c); log(`${p.name} ยัด ${c.name} ใส่มือ ${t.name}`);
      }
    } });
  } });
def('fizzle', { name:'Fizzle', type:'starter', text:'ฟู่… ไม่มีผลอะไรเลย' });
def('bent', { name:'Limp Wand', type:'bent', vp:-1, text:'ไม่มีผล<br>-1 VP ตอนจบเกม' });
def('wild', { name:'Wild Surge', type:'wild', cost:3, text:'เลือก 1: +2 พลัง <i>หรือ</i> เปิดการ์ดบนสุดในกองของศัตรู 1 คนแล้วใช้เป็นของคุณ',
  play: async p => {
    const os = opps(p);
    let ch = p.isAI ? 'pw' : await humanChoose(p, 'Wild Surge', [{label:'+2 พลัง', value:'pw'}, {label:'ขโมยการ์ดบนสุดของศัตรู', value:'steal'}]);
    if (ch === 'pw') { P(p, 2); return; }
    const t = await pickTarget(p, os, { dmg:0, label:'เลือกศัตรูที่จะขโมยการ์ดบนสุด' });
    const c = drawTop(t);
    if (!c) { log(`${t.name} ไม่มีการ์ดให้ขโมย`); return; }
    log(`${p.name} ขโมย ${c.name} จากกองของ ${t.name} มาใช้`, 'sys');
    await playCard(p, c, { fromOther: t });
  } });

// spells
def('fireball', { name:'Hiccup Fireball', type:'spell', cost:3, vp:1, atk:1, text:'<b>โจมตี:</b> คนทางซ้ายรับ 3 ดาเมจ',
  play: async p => { await attack(p, { to:'left', dmg:3 }); } });
def('lightning', { name:'Snot Lightning', type:'spell', cost:5, vp:1, atk:1, text:'<b>โจมตี:</b> ศัตรูทุกคนรับ 2 ดาเมจ',
  play: async p => { await attack(p, { to:'each', dmg:2 }); } });
def('meteor', { name:'Meteor Belch', type:'spell', cost:6, vp:2, atk:1, text:'<b>โจมตี:</b> ศัตรูที่เลือกรับ 5 ดาเมจ ถ้าฆ่าได้ +2 พลัง',
  play: async p => { await attack(p, { to:'choose', dmg:5, onKill: async () => P(p, 2) }); } });
def('rot', { name:'Hex of Rot', type:'spell', cost:3, vp:1, atk:1, text:'<b>โจมตี:</b> ศัตรูที่แข็งแกร่งที่สุด (HP มากสุด) รับ 1 ดาเมจ และได้ Limp Wand',
  play: async p => { await attack(p, { to:'strongest', dmg:1, bent:1 }); } });
def('leech', { name:'Mind Leech', type:'spell', cost:4, vp:1, atk:1, power:1, text:'+1 พลัง<br><b>โจมตี:</b> ศัตรูทุกคนทิ้งการ์ดในมือ 1 ใบ',
  play: async p => { await attack(p, { to:'each', discard:1 }); } });
def('torrent', { name:'Arcane Torrent', type:'spell', cost:2, power:2, text:'+2 พลัง' });
def('chain', { name:'Chain Zap', type:'spell', cost:4, vp:1, atk:1, text:'<b>โจมตี:</b> คนทางซ้ายและทางขวารับคนละ 2 ดาเมจ',
  play: async p => { await attack(p, { to:'lr', dmg:2 }); } });
def('siphon', { name:'Soul Siphon', type:'spell', cost:5, vp:1, atk:1, text:'<b>โจมตี:</b> ศัตรูที่อ่อนแอที่สุด (HP น้อยสุด) รับ 3 ดาเมจ<br>คุณฟื้น 3 HP',
  play: async p => { await attack(p, { to:'weakest', dmg:3 }); heal(p, 3); } });

// each Puke Meteor played this turn fires once per card the current player buys or gains
async function cometStrike(p, c) {
  if (p !== cur() || !G.turn.comet || !c.cost) return;
  for (let i = 0; i < G.turn.comet; i++) {
    G.curLabel = 'Puke Meteor';
    log(`Puke Meteor อ้วกพุ่งตาม ${c.name} (${c.cost} ดาเมจ)`, 'sys');
    await attack(p, { to:'choose', dmg: c.cost });
  }
}

def('sk8ratz', { name:'Kickflip Vermin', type:'creature', cost:4, vp:1, power:2, def:1, defDiscard:1,
  text:'+2 พลัง<br><b>ป้องกัน:</b> ทิ้งใบนี้เพื่อไม่โดนโจมตี แล้วส่งการ์ด 1 ใบจากมือหรือกองทิ้งของคุณไปที่กองทิ้งของผู้โจมตีได้',
  onDefend: async (t, src, self) => {
    if (!src) return; // Chaos and Legend attacks have no attacker to send to
    const pool = [...t.hand, ...t.discard].filter(c => c !== self);
    if (!pool.length) return;
    // AI only dumps junk on the attacker; giving away a good card would help them
    const c = t.isAI ? pool.find(x => x.id === 'bent') || pool.find(x => x.id === 'fizzle') || null
      : await humanChoose(t, `Kickflip Vermin: ส่งการ์ดไปที่กองทิ้งของ ${src.name}`, [...pool.map(x => ({ card: x, value: x })), { label: 'ไม่ส่ง', value: null, ghost: true }],
        'การ์ดจะออกจากเด็คคุณไปอยู่ในเด็คของเขา · ส่ง Limp Wand ไปให้ = เขาเสีย 1 VP');
    if (!c) return;
    const arr = t.hand.includes(c) ? t.hand : t.discard;
    arr.splice(arr.indexOf(c), 1); src.discard.push(c); gainedCard(src, c);
    log(`${t.name} ไถสเก็ตหลบ แล้วโยน ${c.name} ใส่กองทิ้งของ ${src.name}`, 'dmg');
    AUD.play('curse'); render();
  } });

// Squid Idol: held by whoever most recently came to own a Squidzilla the Elder (bought, gained free or sent one)
// and still owns one; nobody holds it otherwise
function standHolder() {
  const owners = (G && G.cthulhuOwners) || [];
  for (let i = owners.length - 1; i >= 0; i--) if (allCards(owners[i]).some(c => c.id === 'cthulhu')) return owners[i];
  return null;
}
// call whenever a card moves into a player's possession from outside it
function gainedCard(p, c) {
  if (c.id !== 'cthulhu') return;
  (G.cthulhuOwners ||= []).push(p);
  log(`${p.name} ได้ครอบครอง Squidzilla the Elder · ได้ถ้วย Squid Idol`, 'sys');
}

def('sugarpuss', { name:'Candy Witch Saccharina', type:'wizard', cost:6, vp:2, draws:1,
  text:'จั่ว 2 ใบ แล้วทิ้ง 1 ใบจากมือ ฟื้น HP เท่ากับราคาใบที่ทิ้ง<br>ถ้าตอนนี้คุณมี 25 HP สับ Dead Wizard Token 1 อันของคุณกลับเข้ากอง',
  play: async p => {
    await draw(p, 2);
    if (p.hand.length) {
      let c;
      if (p.isAI) {
        const byVal = p.hand.slice().sort((a, b) => aiVal(a) - aiVal(b));
        // reaching 25 HP clears a Dead Wizard token (its VP back), so worth throwing a better card for it
        c = (p.tokens.length && byVal.find(x => p.hp + (x.cost || 0) >= 25)) || byVal[0];
      } else {
        c = await humanChoose(p, 'Candy Witch Saccharina: ทิ้ง 1 ใบจากมือ', p.hand.map(x => ({ card: x, value: x })),
          `ฟื้น HP เท่ากับราคาใบที่ทิ้ง · ตอนนี้คุณมี ${p.hp} HP${p.tokens.length ? ' · ถ้าถึง 25 HP จะลบ Dead Wizard Token ได้ 1 อัน' : ''}`);
      }
      p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c);
      log(`${p.name} ทิ้ง ${c.name} (ราคา ${c.cost || 0})`);
      if (c.cost) heal(p, c.cost);
    }
    if (p.hp < 25 || !p.tokens.length) return;
    // the only way to lose a Dead Wizard token; effects that already happened stay
    const tok = p.tokens.length === 1 || p.isAI
      ? (p.tokens.find(k => badToken(k)) || p.tokens[0])
      : await humanChoose(p, 'Candy Witch Saccharina: เลือก Dead Wizard Token ที่จะสับกลับเข้ากอง',
          p.tokens.map(k => ({ label: `☠ ${k.name}: ${k.text}`, value: k })));
    p.tokens.splice(p.tokens.indexOf(tok), 1);
    G.tokens.push(tok); shuffle(G.tokens);
    log(`${p.name} มี 25 HP · สับ Token “${tok.name}” กลับเข้ากอง (+${-tokenVP(tok)} VP)`, 'good');
    render();
  } });

  text:'+3 พลัง<br>ทำลายการ์ด 3 ใบบนสุดของกองหลัก ถ้ามีการ์ดโกลาหลในนั้น เลือกเล่น 1 ใบได้ เพื่อรับ +3 พลัง (คุณเป็นต้นเหตุของโกลาหลนั้น)',

      if (swap) { const m = t.hand.length; t.discard.push(...t.hand); t.hand = []; log(`${t.name} ทิ้งการ์ดในมือ ${m} ใบ แล้วจั่ว 2`); await draw(t, 2); }

/* ---- Chaos 7–Z helpers ---- */
// turn player first; a player who opted out of a Chaos card (The Astral Rune) is left out
const turnOrder = () => G.players.map((_, k) => G.players[(G.cur + k) % G.players.length]).filter(t => t !== G.optOut);
const handCost = p => p.hand.reduce((s, c) => s + (c.cost || 0), 0);
// take the top card of the main deck for p (Chaos cards met on the way are destroyed unresolved)
async function gainTopOfMain(p) {
  while (G.main.length) {
    const c = G.main.pop();
    if (c.type === 'chaos') { G.destroyed.push(c); log(`${c.name} บนกองหลักถูกทำลาย`); continue; }
    await placeGained(p, c); gainedCard(p, c); log(`${p.name} ได้ ${c.name} จากกองหลัก`, 'good');
    return c;
  }
  return null;
}
// resolve only the attack part of a card: owner's power/draw/heal are skipped; self = force every attack onto that player
async function attackOnly(card, owner, self) {
  if (!card.atk || !card.play) return;
  G.attackOnly = { owner, self, card };
  G.curLabel = card.name;
  try { await card.play(owner, card); }
  catch (e) { console.error(e); log(`(${card.name} ใช้ไม่ได้ในโหมดนี้)`); }
  finally { G.attackOnly = null; }
}

def('chaosC', { name:'Chaos 8', type:'chaos', atk:1,
  text:'<b>โจมตี:</b> พ่อมดทุกคนเปิดการ์ดใบบนสุดของเด็ค คนที่เปิดได้ใบแพงที่สุดส่งใบนั้นไปกองทิ้งของคนที่เปิดได้ใบถูกที่สุด',
  chaos: async by => {
    const shown = [];
    await attack(null, { to:'all', chaos:true, by, dmgText:'เปิดการ์ดใบบนสุดของเด็ค', dmg: t => { const c = revealTop(t); if (c) shown.push({ t, c }); return 0; } });
    if (shown.length < 2) return;
    const cost = s => s.c.cost || 0, hi = Math.max(...shown.map(cost)), lo = Math.min(...shown.map(cost));
    if (hi === lo) { log('ทุกคนเปิดได้ราคาเท่ากัน · ไม่มีใครส่งการ์ด'); return; }
    const receivers = shown.filter(s => cost(s) === lo).map(s => s.t);
    for (const g of shown.filter(s => cost(s) === hi)) {
      const to = receivers.length === 1 ? receivers[0] : g.t.isAI ? receivers[rnd(receivers.length)]
        : await humanChoose(t, `Chaos 8: ส่ง ${g.c.name} ให้ใคร?`, receivers.map(r => ({ label: r.name, value: r })));
      g.t.deck.splice(g.t.deck.lastIndexOf(g.c), 1); to.discard.push(g.c);
      log(`${g.t.name} ส่ง ${g.c.name} ไปกองทิ้งของ ${to.name}`, 'sys');

  } });

def('chaosK', { name:'Chaos 16', type:'chaos', text:'พ่อมดแต่ละคนเลือกทำลายการ์ดที่แพงที่สุดในมือ เพื่อฟื้น 13 HP ได้',

    for (const t of turnOrder()) {
      if (!t.hand.length) continue;
      const m = Math.max(...t.hand.map(c => c.cost || 0)), c = t.hand.find(x => (x.cost || 0) === m);
      const yes = t.isAI ? t.hp <= 12
        : await humanChoose(t, `Chaos 16: ทำลาย ${c.name} (ราคา ${m}) เพื่อฟื้น 13 HP?`, [{ label: 'ทำลายแล้วฟื้น 13 HP', value: true }, { label: 'ไม่ทำ', value: false, ghost: true }], `ตอนนี้คุณมี ${t.hp} HP`);
      if (!yes) continue;
      t.hand.splice(t.hand.indexOf(c), 1); G.destroyed.push(c); log(`${t.name} ทำลาย ${c.name}`); AUD.play('destroy');
      heal(t, 13);
    }
  } });

def('chaosL', { name:'Chaos 17', type:'chaos', text:'สุ่มเล่นการ์ดโกลาหล 2 ใบจากกองการ์ดที่ถูกทำลาย',
  chaos: async by => {
    const pool = G.destroyed.filter(c => c.type === 'chaos' && c.id !== 'chaosL');
    if (!pool.length) { log('ยังไม่มีการ์ดโกลาหลในกองที่ถูกทำลาย'); return; }
    for (const c of shuffle(pool.slice()).slice(0, 2)) {
      G.curLabel = c.name; log(`Chaos 17 ปลุก ${c.name} จากกองที่ถูกทำลาย!`, 'sys');
      G.chaosShown = c; render(); AUD.play('chaos'); await FX.chaos(c);
      await c.chaos(by); G.chaosShown = null;
    }
  } });

def('chaosM', { name:'Chaos 18', type:'chaos',
  text:'พ่อมดแต่ละคนเลือกทำลายการ์ด 1 ใบจากมือหรือกองทิ้งได้ ถ้าใบนั้นมี 1 VP ขึ้นไป ได้การ์ดจากบนสุดของกองหลักเท่ากับ VP นั้น (★? นับเป็น 3)',
  chaos: async () => {
    for (const t of turnOrder()) {
      const pool = [...t.hand, ...t.discard];
      if (!pool.length) continue;
      const c = t.isAI ? pool.find(isJunk(t)) || null
        : await humanChoose(t, 'Chaos 18: ทำลายการ์ด 1 ใบจากมือหรือกองทิ้ง?', [...pool.map(x => ({ card: x, value: x })), { label: 'ไม่ทำลาย', value: null, ghost: true }],
            'ถ้าใบที่ทำลายมี VP 1 ขึ้นไป ได้การ์ดจากบนสุดของกองหลักเท่ากับ VP นั้น (การ์ด ★? นับเป็น 3)');
      if (!c) continue;
      const arr = t.hand.includes(c) ? t.hand : t.discard;
      arr.splice(arr.indexOf(c), 1); G.destroyed.push(c); log(`${t.name} ทำลาย ${c.name}`); AUD.play('destroy');
      const n = c.vpCalc ? 3 : Math.max(0, c.vp || 0);
      for (let i = 0; i < n; i++) await gainTopOfMain(t);
    }
  } });

def('chaosN', { name:'Chaos 19', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนนำ Rune ทั้งหมดในกองทิ้งไปวางบนสุดของเด็ค',

def('chaosO', { name:'Chaos 20', type:'chaos', atk:1,
  text:'พ่อมดทุกคนเปิดการ์ดในมือ แล้วใช้<b>การโจมตี</b>ของทุกใบในมือใส่ตัวเอง (ป้องกันการโจมตีของตัวเองได้ · ผลอื่นของการ์ดไม่เกิด)',

def('chaosP', { name:'Chaos 21', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนที่มี 10 HP ขึ้นไปรับ 5 ดาเมจ',

def('chaosQ', { name:'Chaos 22', type:'chaos', atk:1,
  text:'ทุกการ์ดใน Line-Up ใช้<b>การโจมตี</b>ของตัวเอง โดยผู้เล่นที่เป็นเทิร์นเลือกเป้าหมาย (ผลอื่นของการ์ดไม่เกิด)',
  chaos: async () => {

    for (const c of G.lineup.filter(c => c && c.atk && c.play)) { log(`Chaos 22: ${c.name} ใน Line-Up โจมตี (${p.name} เลือกเป้าหมาย)`, 'sys'); await attackOnly(c, p, null); }
  } });

def('chaosR', { name:'Chaos 23', type:'chaos',
  text:'พ่อมดทุกคนที่มี Dead Wizard Token วาง Token 1 อันรวมกองกลาง สับ แล้วแจกคืนคนละ 1 อันแบบสุ่ม และทำผลบน Token ที่ได้',
  chaos: async () => {
    const holders = turnOrder().filter(t => t.tokens.length);
    if (holders.length < 2) { log('มีคนถือ Dead Wizard Token ไม่ถึง 2 คน · ไม่มีอะไรเกิดขึ้น'); return; }
    const pool = [];
    for (const t of holders) {
      const k = t.tokens.length === 1 ? t.tokens[0] : t.isAI ? (t.tokens.find(x => badToken(x)) || t.tokens[0])
        : await humanChoose(t, 'Chaos 23: เลือก Token ที่จะวางรวมกองกลาง', t.tokens.map(x => ({ label: `☠ ${x.name}: ${x.text}`, value: x })));
      t.tokens.splice(t.tokens.indexOf(k), 1); pool.push(k);
    }
    shuffle(pool);
    for (const t of holders) {
      const k = pool.pop(); t.tokens.push(k); announceToken(t, k);
      log(`${t.name} ได้ Token “${k.name}”: ${k.text}`, 'sys');
      if (k.now) await k.now(t, null);
    }
    render();
  } });

def('chaosT', { name:'Chaos 25', type:'chaos', atk:1, text:'<b>โจมตี:</b> ศัตรูทางซ้ายของผู้เล่นที่เป็นเทิร์นจั่ว 2 ใบ (ป้องกัน = ไม่รับผลดีนี้)',
  chaos: async () => {

def('chaosU', { name:'Chaos 26', type:'chaos', atk:1,
  text:'<b>โจมตี:</b> พ่อมดทุกคนได้การ์ดใบบนสุดของกองหลัก แล้วรับดาเมจเท่ากับราคาของใบนั้น (ถ้าเป็นการ์ดโกลาหล ทำลายทิ้ง ไม่ได้การ์ด)',
  chaos: async by => {
    await attack(null, { to:'all', chaos:true, by, dmgText:'ได้การ์ดบนสุดของกองหลัก แล้วรับดาเมจเท่าราคา', dmg: async t => {
      if (!G.main.length) return 0;
      const c = G.main.pop();

def('chaosV', { name:'Chaos 27', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนที่มี 10 HP หรือน้อยกว่ารับ 3 ดาเมจ',

def('chaosW', { name:'Chaos 28', type:'chaos', text:'ตำนานที่หงายอยู่ 1 ใบ (ผู้เล่นที่เป็นเทิร์นเลือก) ใช้ Group Attack',
  chaos: async () => {

def('chaosX', { name:'Chaos 29', type:'chaos', text:'พ่อมดทุกคนรวมราคาการ์ดในมือ คนที่รวมได้ต่ำสุดจั่ว 2 ใบ',

  } });

def('chaosY', { name:'Chaos 30', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนได้ Limp Wand 1 ใบ วางไว้บนสุดของเด็ค',

def('chaos2A', { name:'Chaos 31', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนรับดาเมจเท่ากับราคาของการ์ดที่แพงที่สุดในมือตัวเอง',
  chaos: async by => {
    await attack(null, { to:'all', chaos:true, by, dmgText:'ดาเมจเท่าราคาการ์ดที่แพงที่สุดในมือคุณ',
      dmg: t => t.hand.length ? Math.max(...t.hand.map(c => c.cost || 0)) : 0 });
  } });

def('chaos2B', { name:'Chaos 32', type:'chaos',
  text:'พ่อมดแต่ละคนสุ่มเปิดการ์ดในมือ 1 ใบ แล้วเลือก: ทำลายใบนั้น <i>หรือ</i> จ่าย 2 HP สุ่มเปิดใบใหม่ (ทำซ้ำได้) · จะหยุดโดยไม่ทำลายก็ได้',
  chaos: async () => {
    for (const t of turnOrder()) {
      const seen = [];
      while (true) {
        const left = t.hand.filter(c => !seen.includes(c));
        if (!left.length) break;
        const c = left[rnd(left.length)]; seen.push(c);
        log(`${t.name} สุ่มเปิดได้ ${c.name}`);
        const canPay = t.hp >= 2 && left.length > 1;
        let ch;
        if (t.isAI) ch = isJunk(t)(c) ? 'destroy' : (canPay && t.hp > 10 && t.hand.some(x => !seen.includes(x) && isJunk(t)(x)) ? 'pay' : 'stop');
        else ch = await humanChoose(t, `Chaos 32: เปิดได้ ${c.name}`, [
            { label: 'ทำลายใบนี้', value: 'destroy' },
            ...(canPay ? [{ label: `จ่าย 2 HP สุ่มเปิดใบใหม่ (ตอนนี้ ${t.hp} HP)`, value: 'pay' }] : []),
            { label: 'หยุด ไม่ทำลาย', value: 'stop', ghost: true }], cardHTML(c, { small: true }));
        if (ch === 'destroy') { t.hand.splice(t.hand.indexOf(c), 1); G.destroyed.push(c); log(`${t.name} ทำลาย ${c.name}`); AUD.play('destroy'); render(); break; }
        if (ch !== 'pay') break;
        t.hp -= 2; t.hitFlash = true; log(`${t.name} จ่าย 2 HP (${Math.max(t.hp, 0)} HP)`, 'dmg'); render();
        if (t.hp < 1) { await kill(t, null); break; }
      }
    }
  } });

def('chaos2J', { name:'Chaos 33', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนรับ 5 ดาเมจ',
  chaos: async by => attack(null, { to:'all', dmg:5, chaos:true, by }) });

def('chaos2L', { name:'Chaos 34', type:'chaos', text:'พ่อมดทุกคนทิ้งเด็คทั้งหมดลงกองทิ้ง แล้วต้องทำลายการ์ด 1 ใบในกองทิ้ง',
  chaos: async () => {
    for (const t of turnOrder()) {
      const n = t.deck.length;
      t.discard.push(...t.deck); t.deck = [];
      log(`${t.name} ทิ้งเด็ค ${n} ใบลงกองทิ้ง`);
      if (!t.discard.length) continue;
      const c = t.isAI ? t.discard.slice().sort((a, b) => aiVal(a) - aiVal(b))[0]   // mandatory: AI drops its weakest card
        : await humanChoose(t, 'Chaos 34: ต้องทำลายการ์ด 1 ใบในกองทิ้ง', t.discard.map(x => ({ card: x, value: x })), 'บังคับทำลาย · การ์ดจะออกจากเกมถาวร');
      t.discard.splice(t.discard.indexOf(c), 1); G.destroyed.push(c);
      log(`${t.name} ทำลาย ${c.name}`); AUD.play('destroy');
    }
    render();
  } });

def('chaos2O', { name:'Chaos 35', type:'chaos', text:'พ่อมดทุกคนต้องเลือก: ทิ้งการ์ดในมือทั้งหมดแล้วจั่ว 5 ใบ <i>หรือ</i> เสีย 5 HP',
  chaos: async () => {
    for (const t of turnOrder()) {
      // AI keeps a strong hand only when it can afford the HP
      const swap = t.isAI ? !(t.hp > 12 && handCost(t) >= 10)
        : await humanChoose(t, 'Chaos 35: ต้องเลือก 1 อย่าง', [{ label: `ทิ้งทั้งมือ (${t.hand.length} ใบ) แล้วจั่ว 5`, value: true }, { label: `เสีย 5 HP (ตอนนี้ ${t.hp} HP)`, value: false }],
            `มือตอนนี้: ${t.hand.map(c => c.name).join(', ') || '—'}`);
      if (swap) { const m = t.hand.length; t.discard.push(...t.hand); t.hand = []; log(`${t.name} ทิ้งการ์ดในมือ ${m} ใบ แล้วจั่ว 5`); await draw(t, 5); continue; }
      t.hp -= 5; t.hitFlash = true; log(`${t.name} เสีย 5 HP (${Math.max(t.hp, 0)} HP)`, 'dmg'); render();
      if (t.hp < 1) await kill(t, null);
    }
  } });

def('chaos2S', { name:'Chaos 36', type:'chaos', text:'พ่อมดทุกคนทิ้งการ์ด 2 ใบบนสุดของเด็ค แล้วเลือก: ทำลายทั้งสองใบ <i>หรือ</i> ไม่ทำลายเลย',
  chaos: async () => {
    for (const t of turnOrder()) {
      const two = [drawTop(t), drawTop(t)].filter(Boolean);
      if (!two.length) continue;
      t.discard.push(...two);
      log(`${t.name} ทิ้ง ${two.map(c => c.name).join(', ')} จากบนสุดของเด็ค`);
      const kill2 = t.isAI ? two.every(isJunk(t))
        : await humanChoose(t, 'Chaos 36: ทำลายทั้งสองใบไหม?', [{ label: 'ทำลายทั้งหมด', value: true }, { label: 'ไม่ทำลาย (อยู่ในกองทิ้ง)', value: false, ghost: true }],
            `<div class="cards">${two.map(c => cardHTML(c, { small: true })).join('')}</div>`);
      if (!kill2) continue;
      for (const c of two) { t.discard.splice(t.discard.indexOf(c), 1); G.destroyed.push(c); }
      log(`${t.name} ทำลาย ${two.map(c => c.name).join(', ')}`); AUD.play('destroy');
    }
    render();
  } });

def('chaos2T', { name:'Chaos 37', type:'chaos',
  text:'เริ่มจากผู้เล่นที่เป็นเทิร์น ทุกคนเลือก “หมอบ” หรือ “แทง” · คนที่แทงเปิดมือ คนที่ราคารวมสูงสุดจั่ว 2 ใบ (เสมอได้หลายคน) คนที่แทงคนอื่นทิ้งการ์ดในมือทั้งหมด',
  chaos: async () => {
    const bettors = [];
    for (const t of turnOrder()) {
      const bet = t.isAI ? handCost(t) >= 7 + 2 * bettors.length   // AI gets choosier as more players bet
        : await humanChoose(t, 'Chaos 37: หมอบหรือแทง?', [{ label: 'แทง (bet)', value: true }, { label: 'หมอบ (fold)', value: false, ghost: true }],
            `มือคุณรวมราคาได้ ${handCost(t)} · ${bettors.length ? 'แทงไปแล้ว: ' + bettors.map(b => b.name).join(', ') : 'ยังไม่มีใครแทง'}`);
      log(`${t.name} ${bet ? 'แทง' : 'หมอบ'}`);
      if (bet) bettors.push(t);
    }
    if (!bettors.length) { log('ทุกคนหมอบ · ไม่มีอะไรเกิดขึ้น'); return; }
    for (const t of bettors) log(`${t.name} เปิดมือ: ${t.hand.map(c => c.name).join(', ') || '—'} (รวม ${handCost(t)})`);
    const m = Math.max(...bettors.map(handCost));
    for (const t of bettors) {
      if (handCost(t) === m) { log(`${t.name} ชนะ! จั่ว 2`, 'good'); await draw(t, 2); }
      else { const n = t.hand.length; t.discard.push(...t.hand); t.hand = []; log(`${t.name} แพ้ · ทิ้งการ์ดในมือ ${n} ใบ`, 'dmg'); }
    }
    render();
  } });

def('chaosZ', { name:'Chaos 38', type:'chaos', atk:1, text:'<b>โจมตี:</b> พ่อมดทุกคนทิ้งการ์ดต่อเนื่อง 1 ใบของตัวเองลงกองทิ้ง',
  chaos: async by => {
    await attack(null, { to:'all', chaos:true, by, dmgText:'ทิ้งการ์ดต่อเนื่อง 1 ใบ', dmg: async t => {
      if (!t.ongoing.length) return 0;
      const c = t.ongoing.length === 1 ? t.ongoing[0] : t.isAI ? t.ongoing.slice().sort((a, b) => a.cost - b.cost)[0]
        : await humanChoose(t, 'Chaos 38: ทิ้งการ์ดต่อเนื่อง 1 ใบ', t.ongoing.map(x => ({ card: x, value: x })));
      t.ongoing.splice(t.ongoing.indexOf(c), 1); t.discard.push(c); log(`${t.name} ทิ้ง ${c.name} ออกจากสนาม`, 'dmg');

// bring every card of a type from the discard pile to hand; +2 power if there was none
async function recallType(p, type, label) {
  const got = p.discard.filter(c => isType(c, type));
  if (!got.length) { P(p, 2); log(`ไม่มี${label}ในกองทิ้งของ ${p.name} · ได้ +2 พลังแทน`); return; }
  p.discard = p.discard.filter(c => !got.includes(c)); p.hand.push(...got);
  log(`${p.name} นำ${label} ${got.length} ใบจากกองทิ้งขึ้นมือ`, 'good'); render();
}
