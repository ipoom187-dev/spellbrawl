      noise({ t, a: .03, d: .3, v: .18, filter: 'bandpass', f0: 600, f1: 4000, q: 2, w: .3 });
    },
    impact: (t, n = 2) => impact(t, n),
    shield: t => {
      [1, 2.76, 5.4].forEach((m, i) => tone('sine', 620 * m, { t, d: .9 - i * .2, v: .09 / (i + 1), w: .6 }));
      noise({ t, d: .08, v: .15, filter: 'highpass', f0: 5000, w: .3 });
    },
    reflect: t => { S.shield(t); tone('sawtooth', 1200, { t: t + .05, to: 140, d: .35, v: .08, filter: 'lowpass', f0: 4000, f1: 600, w: .4 }); },
    heal: t => [72, 76, 79, 84, 88].forEach((m, i) => tone('sine', N(m), { t: t + i * .055, d: .6, v: .06, w: .7 })),
    curse: t => { const o = tone('square', 420, { t, to: 110, d: .7, v: .05, filter: 'lowpass', f0: 1800, f1: 400, w: .5 }); lfo(o.frequency, 9, 35, t, .8); },
    discard: t => noise({ t, d: .12, v: .25, filter: 'lowpass', f0: 700, f1: 200, w: .1 }),
    destroy: t => {
      noise({ t, a: .04, d: .6, v: .3, filter: 'bandpass', f0: 3000, f1: 300, q: .8, w: .4 });
      tone('sawtooth', 300, { t, to: 60, d: .5, v: .06, filter: 'lowpass', f0: 1200, w: .3 });
    },
    buy: t => {
      tone('square', N(91), { t, d: .09, v: .05, w: .3 }); tone('square', N(96), { t: t + .07, d: .25, v: .05, w: .4 });
      tone('sine', N(103), { t: t + .07, d: .4, v: .04, w: .5 });
    },
    turnMe: t => { brass([57], t, .25, .07); brass([62, 69], t + .2, 1, .07); drum(t + .2, .5); },
    turnAI: t => drum(t, .3),
    kill: t => {
      impact(t, 8);
      [1, 2.42, 3.13, 4.7, 5.93].forEach((m, i) => tone('sine', 82 * m, { t: t + .02, a: .01, d: 3.2 - i * .4, v: .16 / (i + 1), w: .8 }));
      choir([50, 53, 57, 62], t + .15, 2.4, .05);
    },
    chaos: t => {
      noise({ t, a: .01, d: .15, v: .6, filter: 'highpass', f0: 2000, w: .5 });
      noise({ t: t + .05, a: .1, d: 2.6, v: .6, filter: 'lowpass', f0: 1800, f1: 70, w: .8 });
      [38, 44].forEach(m => tone('sawtooth', N(m), { t, a: .3, d: 1.8, v: .06, filter: 'lowpass', f0: 500, w: .5 }));
    },
    // near strikes crack hard and fast; far ones are mostly a late rolling rumble
    thunder: (t, near) => {
      const lag = near ? 0 : .15 + Math.random() * .35;
      noise({ t, a: .002, d: near ? .18 : .08, v: near ? .7 : .25, filter: 'highpass', f0: 1500, w: .5 });
      noise({ t: t + lag, a: .04, d: 1.6 + Math.random(), v: near ? .6 : .4, filter: 'lowpass', f0: near ? 1600 : 700, f1: 50, w: .8 });
      tone('sine', 60, { t: t + lag, to: 28, d: 1.4, v: near ? .5 : .25, w: .4 });
    },
    rain: (t, dur = 4) => {
      noise({ t, a: .4, d: dur, v: .14, filter: 'bandpass', f0: 2600, f1: 1800, q: .6, w: .3 });
      noise({ t, a: .6, d: dur, v: .1, filter: 'lowpass', f0: 380, f1: 200, w: .5 });
    },
    legendUp: t => {
      [0, .18, .3, .42].forEach((dt, i) => drum(t + dt, .5 + i * .12));
      choir([38, 45, 50, 53], t + .2, 3, .07); brass([50, 57], t + .5, 2.2, .08);
      noise({ t: t + .4, a: .8, d: 2, v: .2, filter: 'lowpass', f0: 300, f1: 2000, w: .9 });
    },
    legendWin: t => {
      drum(t, .8); [[62, 0], [69, .16], [74, .32]].forEach(([m, dt]) => brass([m], t + dt, .3, .09));
      brass([62, 66, 69, 74], t + .5, 1.8, .07); cymbal(t + .5, .25);
    },
    victory: t => {
      [[60, 0], [64, .14], [67, .28], [72, .42]].forEach(([m, dt]) => brass([m], t + dt, .25, .08));
      brass([60, 64, 67, 72, 76], t + .62, 2.6, .07); drum(t + .62, .9); cymbal(t + .62, .3);
    },
    defeat: t => { [[62, 0], [60, .35], [57, .7]].forEach(([m, dt]) => brass([m], t + dt, .45, .07)); choir([50, 53, 57], t + 1, 3, .06); drum(t + 1, .6); },
  };

  // music: low-string ostinato + choir pad, war drums join once a battle is on
  const PROG = [[50, 53, 57], [46, 50, 53], [45, 48, 53], [48, 52, 55]];
  const STEP = 60 / 88 / 2;
  function musicStep(t, s) {
    const ch = PROG[Math.floor(s / 8) % PROG.length], b = s % 8, battle = !!(G && !G.over);
    if (b === 0) choir(ch.map(m => m + 12), t, STEP * 8, .05, 'mus');
    tone('sawtooth', N(ch[0] - 12 + [0, 0, 12, 0, 7, 0, 12, 7][b]), { t, a: .01, d: STEP * .9, v: battle ? .07 : .04, filter: 'lowpass', f0: 1400, f1: 250, b: 'mus', w: .2 });
    if (battle) {
      const v = [.7, 0, 0, .35, .55, 0, .3, .4][b];
      if (v) drum(t, v, 'mus');
      if (s % 32 === 0) cymbal(t, .12, 'mus');
    }
  }
  function startMusic() {
    if (timer || !ctx) return;
    nextT = ctx.currentTime + .1;
    timer = setInterval(() => {
      if (ctx.state !== 'running') return;
      if (nextT < ctx.currentTime) nextT = ctx.currentTime + .05; // tab was throttled: don't burst-play the backlog
      while (nextT < ctx.currentTime + .3) { musicStep(nextT, step++); nextT += STEP; }
    }, 80);
  }
  function stopMusic() { clearInterval(timer); timer = null; }

  return {
    st,
    unlock() { if (!init()) return; if (ctx.state === 'suspended') ctx.resume(); if (st.music) startMusic(); },
    play(name, arg) {
      if (!ctx || !st.sfx || ctx.state !== 'running') return;
      try { S[name](ctx.currentTime + .02, arg); } catch (e) { console.warn('sfx', name, e); }
    },
    toggle(k) {
      const b = k === 'sfx' ? 'sfx' : 'mus';
      st[k] = !st[k];
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
      if (ctx) {
        bus[b].gain.setTargetAtTime(st[k] ? LEVEL[b] : 0, ctx.currentTime, .08);
        wet[b].gain.setTargetAtTime(st[k] ? LEVEL[b] * .5 : 0, ctx.currentTime, .08);
        if (b === 'mus') { if (st[k]) startMusic(); else stopMusic(); }
      }
      return st[k];
    },
  };
})();

/* ---------------- visual FX ---------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)');

// drifting embers behind the table; surge() makes them flare on big moments
const Embers = (() => {
  const cv = $('#embers'), cx = cv.getContext('2d');
  let boost = 0, last = 0;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const mk = y => ({ x: Math.random() * cv.width, y: y != null ? y : cv.height + 10, r: .6 + Math.random() * 2, v: .2 + Math.random() * .6,
    sw: Math.random() * 6.28, h: 12 + Math.random() * 30, a: .3 + Math.random() * .5 });
  const ps = Array.from({ length: 46 }, () => mk(Math.random() * cv.height));
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    if (RM.matches) { if (last) { cx.clearRect(0, 0, cv.width, cv.height); last = 0; } return; }
    const dt = Math.min(3, (now - last) / 16.7 || 1); last = now;
    boost *= .97;
    cx.clearRect(0, 0, cv.width, cv.height); cx.globalCompositeOperation = 'lighter';
    for (const p of ps) {
      p.y -= p.v * (1 + boost * 4) * dt; p.sw += .02 * dt; p.x += Math.sin(p.sw) * .3 * dt;
      if (p.y < -10) Object.assign(p, mk());
      const fl = .6 + .4 * Math.sin(now / 180 + p.sw * 7), R = p.r * (1 + boost) * 4;
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, `hsla(${p.h},100%,65%,${p.a * fl})`); g.addColorStop(1, `hsla(${p.h},100%,50%,0)`);
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, R, 0, 6.283); cx.fill();
    }
  }
  requestAnimationFrame(frame);
  return { surge() { boost = 1.5; } };
})();

// one-shot effects drawn on #fx; awaited ones pace the game, slower/faster with the AI speed setting
const FX = (() => {
  const pace = () => { const p = G && cur(); return p && p.isAI ? Math.max(.25, Math.min(1.6, AI_DELAY / 650)) : 1; };
  const T = ms => Math.round(ms * pace());
  const px = v => typeof v === 'number' ? v + 'px' : v;
  function spawn(cls, x, y, text) {
    const el = document.createElement('div');
    el.className = 'fx ' + cls; el.style.left = px(x); el.style.top = px(y);
    if (text != null) el.textContent = text;
    $('#fx').appendChild(el);
    return el;
  }
  function fire(el, kf, o) {
    const done = () => el.remove();
    el.animate(kf, { fill: 'both', ...o }).onfinish = done;
    setTimeout(done, o.duration + (o.delay || 0) + 400); // backstop if the animation never finishes (hidden tab)
  }
  const clampPt = (x, y) => ({ x: Math.min(innerWidth - 40, Math.max(40, x)), y: Math.min(innerHeight - 40, Math.max(40, y)) });
  const seat = p => p && G ? document.querySelector(`[data-pi="${G.players.indexOf(p)}"]`) : null;
  function at(p) {
    const s = seat(p), el = s || $('.boardc');
    if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
    const r = el.getBoundingClientRect();
    return clampPt(r.left + r.width / 2, s ? r.top + r.height / 2 : r.top + 60);
  }
  function sparks(x, y, color, n = 14, spread = 90, size = 8, rise = 0) {
    if (RM.matches) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      const el = spawn('spark', 0, 0), s = size * (.5 + Math.random());
      el.style.cssText += `;width:${s}px;height:${s}px;background:${color};box-shadow:0 0 ${s + 6}px ${color}`;
      const a = Math.random() * Math.PI * 2, d = spread * (.35 + Math.random() * .8);
      fire(el, [{ transform: `translate(${x}px,${y}px) translate(-50%,-50%)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d - rise}px) translate(-50%,-50%) scale(.15)`, opacity: 0 }],
        { duration: 450 + Math.random() * 450, easing: 'cubic-bezier(.15,.7,.3,1)' });
    }
  }
  function shake(n) {
    if (RM.matches || n <= 0) return;
    const k = [];
    for (let i = 0; i < 7; i++) { const f = n * (1 - i / 7); k.push({ transform: `translate(${(Math.random() - .5) * 2 * f}px,${(Math.random() - .5) * 2 * f}px)` }); }
    k.push({ transform: 'none' });
    $('#app').animate(k, { duration: 420, easing: 'ease-out' });
  }
  function seatFlash(p, color) {
    const el = seat(p); if (!el) return;
    const r = el.getBoundingClientRect(), f = spawn('seatflash', r.left, r.top);
    f.style.width = r.width + 'px'; f.style.height = r.height + 'px'; f.style.background = color;
    fire(f, [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 0 }], { duration: 650 });
  }
  function float(p, text, cls) {
    const { x, y } = at(p), el = spawn('float ' + cls, x + (Math.random() - .5) * 40, y - 10, text);
    fire(el, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: 'translate(-50%,-80%) scale(1.35)', opacity: 1, offset: .15 },
      { transform: 'translate(-50%,-110%) scale(1)', opacity: 1, offset: .6 },
      { transform: 'translate(-50%,-190%) scale(.9)', opacity: 0 }], { duration: 1200, easing: 'ease-out' });
  }
  const screen = (cls, kf, ms) => fire(spawn('screen ' + cls, 0, 0), kf, { duration: ms });
  const pulse = [{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 0 }];
  function banner(title, sub, kind, ms) {
    const el = spawn('banner ' + kind, 0, '42%');
    const t = document.createElement('div'); t.className = 'b-title'; t.textContent = title; el.appendChild(t);
    if (sub) { const s = document.createElement('div'); s.className = 'b-sub'; s.textContent = sub; el.appendChild(s); }
    fire(el, [{ opacity: 0, transform: 'translateY(-50%) scaleY(.2)' }, { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .12 },
      { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .8 }, { opacity: 0, transform: 'translateY(-50%) scaleY(1.1)' }],
      { duration: ms, easing: 'ease-out' });
    return sleep(ms * .8);
  }

  // full-screen storm canvas: slanted rain + branching lightning strikes (each with thunder + flash); returns stop()
  function storm() {
    const cv = document.createElement('canvas');
    cv.className = 'fx storm-cv'; cv.width = innerWidth; cv.height = innerHeight;
    $('#fx').appendChild(cv);
    const g = cv.getContext('2d'), W = cv.width, H = cv.height;
    const rain = Array.from({ length: 180 }, () => ({ x: Math.random() * W * 1.2, y: Math.random() * H, l: 14 + Math.random() * 18, v: 16 + Math.random() * 12 }));
    const bolts = [];
    // midpoint displacement gives the jagged lightning shape
    function path(x0, y0, x1, y1, spread) {
      let pts = [[x0, y0], [x1, y1]];
      for (let gen = 0; gen < 6; gen++, spread /= 2) {
        const n = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          n.push([(ax + bx) / 2 + (Math.random() - .5) * spread, (ay + by) / 2 + (Math.random() - .5) * spread * .3], pts[i]);
        }
        pts = n;
      }
      return pts;
    }
    function strike(now) {
      // half the strikes land around the showcased card in the middle
      const near = Math.random() < .5;
      const x0 = Math.random() * W, x1 = near ? W / 2 + (Math.random() - .5) * Math.min(W * .5, 420) : Math.random() * W;
      const y1 = near ? H * (.3 + Math.random() * .4) : H * (.65 + Math.random() * .35);
      const main = path(x0, -10, x1, y1, Math.min(260, W * .25));
      const lines = [main];
      for (let b = 0; b < 1 + Math.floor(Math.random() * 3); b++) {
        const [sx, sy] = main[8 + Math.floor(Math.random() * (main.length - 16))];
        lines.push(path(sx, sy, sx + (Math.random() - .5) * 320, sy + 80 + Math.random() * 180, 90));
      }
      bolts.push({ lines, born: now, life: 380 });
      AUD.play('thunder', near);
      screen('flash', [{ opacity: 0 }, { opacity: near ? .45 : .28, offset: .1 }, { opacity: 0 }], 260);
      if (near) shake(7);
    }
    let next = performance.now() + 150, stopping = 0, raf;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!stopping && now >= next) { strike(now); next = now + 220 + Math.random() * 520; }
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(190,180,255,.28)'; g.lineWidth = 1.2; g.beginPath();
      for (const d of rain) {
        d.y += d.v; d.x -= d.v * .25;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * W * 1.2; }
        g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .25, d.y - d.l);
      }
      g.stroke();
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i], age = now - b.born;
        if (age > b.life) { bolts.splice(i, 1); continue; }
        const a = (1 - age / b.life) * (age < 70 || Math.random() > .35 ? 1 : .35); // flicker
        b.lines.forEach((pts, k) => {
          for (const [w, col] of [[k ? 5 : 10, `rgba(170,110,255,${a * .35})`], [k ? 1.2 : 2.6, `rgba(255,255,255,${a})`]]) {
            g.lineWidth = w; g.strokeStyle = col; g.shadowColor = '#c9a0ff'; g.shadowBlur = 24;
            g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          }
        });
        g.shadowBlur = 0;
      }
    }
    raf = requestAnimationFrame(frame);
    return () => {
      stopping = 1;
      cv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => { cancelAnimationFrame(raf); cv.remove(); };
      setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 900);
    };
  }

  return {
    // a glowing bolt arcing from the caster's seat (or the board, for Chaos/Legends) to the target
    async bolt(from, to, color) {
      const a = at(from), b = at(to);
      if (RM.matches || Math.hypot(b.x - a.x, b.y - a.y) < 8) return;
      const dur = T(420), cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - Math.min(180, Math.hypot(b.x - a.x, b.y - a.y) * .35);
      const pt = u => ({ x: (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x, y: (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y });
      const orb = spawn('orb', 0, 0); orb.style.setProperty('--c', color);
      fire(orb, Array.from({ length: 9 }, (_, i) => { const p = pt(i / 8); return { transform: `translate(${p.x}px,${p.y}px) translate(-50%,-50%) scale(${.5 + i / 10})` }; }),
        { duration: dur, easing: 'ease-in' });
      for (let k = 1; k < 7; k++) setTimeout(() => { const p = pt(Math.pow(k / 7, 1.6)); sparks(p.x, p.y, color, 2, 16, 6); }, dur * k / 7);
      await sleep(dur);
      sparks(b.x, b.y, color, 10, 60, 9);
    },
    ring(p) {
      const { x, y } = at(p);
      [0, 120].forEach(delay => fire(spawn('ring', x, y), [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
        { transform: 'translate(-50%,-50%) scale(1.9)', opacity: 0 }], { duration: 700, delay, easing: 'ease-out' }));
    },
    hit(t, n) {
      const { x, y } = at(t);
      seatFlash(t, 'rgba(229,72,95,.5)');
      float(t, '-' + n, n >= 4 ? 'dmg crit' : 'dmg');
      sparks(x, y, '#ff6a3d', 8 + n * 3, 50 + n * 14, 9);
      shake(t === meP() ? 6 + n * 2 : n >= 3 ? 2 + n * 1.5 : 0);
    },
    heal(p, n) { const { x, y } = at(p); float(p, '+' + n, 'heal'); sparks(x, y, '#7dffa0', 10, 50, 6, 60); },
    curse(t) { const { x, y } = at(t); float(t, 'Limp Wand', 'curse'); sparks(x, y, '#b07cff', 8, 40, 6); },
    coins(r, p) {
      if (!r || RM.matches) return;
      const a = clampPt(r.left + r.width / 2, r.top + r.height / 2), b = at(p);
      sparks(a.x, a.y, '#f0c35a', 12, 70, 7);
      for (let i = 0; i < 7; i++) {
        const ox = (Math.random() - .5) * 60, oy = (Math.random() - .5) * 60;
        fire(spawn('spark coin', 0, 0), [{ transform: `translate(${a.x + ox}px,${a.y + oy}px) translate(-50%,-50%)`, opacity: 1 },
          { transform: `translate(${(a.x + b.x) / 2}px,${Math.min(a.y, b.y) - 80}px) translate(-50%,-50%) scale(1.3)`, opacity: 1 },
          { transform: `translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.4)`, opacity: 0 }],
          { duration: 700, delay: i * 45, easing: 'ease-in-out' });
      }
    },
    kill(t, tok) {
      const { x, y } = at(t);
      screen('vig-red', pulse, T(1400)); shake(18); Embers.surge();
      sparks(x, y, '#ff3b4f', 30, 200, 11); sparks(x, y, '#efe6d6', 14, 140, 6);
      return banner(`☠ ${t.name} ตาย!`, `Dead Wizard Token: ${tok.name}`, 'kill', T(1500));
    },
    turn(p) {
      AUD.play(p === meP() ? 'turnMe' : 'turnAI');
      if (p.isAI || p !== meP()) { banner(`เทิร์นของ ${p.name}`, '', 'turn small', T(800)); return null; }
      banner('เทิร์นของคุณ!', 'ร่ายเวท ซื้อการ์ด ถล่มศัตรู', 'turn', 1100);
      return sleep(450);
    },
    legend(L) {
      screen('vig-blood', pulse, T(2000)); shake(10); Embers.surge();
      return banner('ตำนานปรากฏ!', `${L.name} · ${L.group}`, 'legend', T(2000));
    },
    legendWin(p, L) {
      const { x, y } = at(p);
      sparks(innerWidth / 2, innerHeight * .42, '#f0c35a', 40, 260, 10); sparks(x, y, '#f0c35a', 20, 120, 8); shake(6); Embers.surge();
      return banner('ล้มตำนาน!', `${p.name} พิชิต ${L.name}`, 'gold', T(1600));
    },
    // Chaos: the card is held big in the middle of a lightning storm until the player clicks it away
    async chaos(c) {
      const sky = spawn('screen storm', 0, 0);
      sky.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
      const stopStorm = RM.matches ? () => {} : storm();
      AUD.play('rain', 5);
      shake(12);
      const box = spawn('chaos-show', 0, 0);
      box.innerHTML = `<div class="cs-title">โกลาหล!</div><div class="cs-card">${cardHTML(c, { noZoom: true })}</div><div class="cs-hint">คลิกซ้ายที่ใดก็ได้เพื่อปิด</div>`;
      box.querySelector('.cs-card').style.setProperty('--k', Math.max(1.2, Math.min(2.4, innerHeight * .55 / 190, innerWidth * .8 / 132)).toFixed(2));
      await new Promise(r => box.addEventListener('pointerdown', e => { if (e.button === 0) r(); }));
      stopStorm();
      for (const el of [sky, box]) {
        el.style.pointerEvents = 'none';
        el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => el.remove();
        setTimeout(() => el.remove(), 900);
      }
      await sleep(250);
    },
    victory(win, name) {
      banner(win ? 'ชัยชนะ!' : `${name} ชนะ`, win ? 'คุณคือจอมเวทสูงสุดแห่งสนามประลอง' : 'สนามประลองยังรอการล้างแค้น', win ? 'win' : 'lose', 3200);
      if (!win || RM.matches) return;
      Embers.surge();
      for (let i = 0; i < 70; i++) {
        const el = spawn('spark', 0, 0), s = 4 + Math.random() * 8, x = Math.random() * innerWidth;
        el.style.cssText += `;width:${s}px;height:${s}px;background:hsl(${30 + Math.random() * 30} 95% 60%);box-shadow:0 0 10px hsl(40 95% 60%)`;
        fire(el, [{ transform: `translate(${x}px,-20px)` }, { transform: `translate(${x + (Math.random() - .5) * 200}px,${innerHeight + 40}px)` }],
          { duration: 1800 + Math.random() * 1800, delay: Math.random() * 1200, easing: 'cubic-bezier(.3,0,.7,1)' });
      }
    },
  };
})();

async function pickTarget(p, list, spec) {
  if (list.length === 1) return list[0];
  if (p.isAI) {
    if (list.length > 1) list = list.filter(t => t !== p); // the AI never targets itself
    const d = typeof spec.dmg === 'number' ? spec.dmg : 0;
    const killable = list.filter(t => t.hp <= d);
    const pool = killable.length ? killable : list;
    return pool.slice().sort((a, b) => a.hp - b.hp || (b.isAI ? -1 : 1))[0];
  }
  return humanChoose(p, spec.label || `เลือกเป้าหมาย (${G.curLabel})`, list.map(t => ({ label: `${t === p ? 'ตัวคุณเอง' : t.name} · ${t.hp} HP`, value: t })));
}

async function attack(src, spec) {
  const pool = (src && !spec.includeSelf ? opps(src) : G.players.slice()).filter(t => t !== G.optOut); // includeSelf: the attacker may pick themself
  let targets = [];
  if (G.attackOnly && G.attackOnly.self) { targets = [G.attackOnly.self]; src = null; } // Chaos 20: your own attacks hit you
  else switch (spec.to) {
    case 'choose': targets = [await pickTarget(src, spec.among ? pool.filter(spec.among) : pool, spec)]; break; // among: limit who can be picked
    case 'left': targets = [leftOf(src)]; break;
    case 'right': targets = [rightOf(src)]; break;
    case 'random': targets = [pool[rnd(pool.length)]]; break;
    case 'where': targets = pool.filter(spec.where); break; // every opponent matching spec.where(t)
    case 'lr': { const l = leftOf(src), r = rightOf(src); targets = l === r ? [l] : [l, r]; break; }
    case 'each': case 'all': targets = pool; break;
    case 'strongest': case 'weakest': {
      const f = spec.to === 'strongest' ? Math.max : Math.min;
      const m = f(...pool.map(x => x.hp)); const c = pool.filter(x => x.hp === m);
      targets = [src && c.length > 1 ? await pickTarget(src, c, spec) : c[0]]; break;
    }
  }
  targets = targets.filter(t => t && t !== G.optOut && (!G.onlyTarget || t === G.onlyTarget)); // opted-out players; onlyTarget: a Group Attack aimed at one player (token)
  let bonus = 0;
  if (src && src === cur()) {
    G.turn.attacked = true;
    if (hasTrait(src, 'ember') && !G.turn.emberUsed && spec.dmg) { bonus = 1; G.turn.emberUsed = true; }
    // The Grimy Wand Car Wash: attacks from a card named “Wand” deal +2
    if (spec.dmg && G.curCard && isWand(G.curCard) && src.ongoing.some(c => c.id === 'dirtywand')) bonus += 2;
    if (spec.dmg && G.curCard && isWand(G.curCard)) bonus += 4 * src.tokens.filter(k => k.id === 'wand4').length; // token: Wand +4
    if (spec.dmg && G.curCard && isWand(G.curCard) && hasTrait(src, 'weirdWand')) bonus += 1; // ability: Wand +1
  }
  const color = !spec.dmg ? (spec.bent ? '#b07cff' : '#59c2c7') : spec.chaos ? '#c27dff' : src ? '#ff7a3d' : '#ff3355';
  AUD.play('cast');
  await Promise.all(targets.map(t => FX.bolt(src, t, color)));
  let kills = 0, dealtTotal = 0;
  // Rumble the Chainsaw: the next attack its player makes this turn can't be dodged
  let unblock = spec.unblockable;
  // ability "ไม้กายสิทธิ์ประหลาด": its owner's Wand attacks can't be dodged
  if (!unblock && src && G.curCard && isWand(G.curCard) && hasTrait(src, 'weirdWand')) unblock = true;
  if (!unblock && src && src === cur() && G.turn.nextUnblockable) { unblock = true; G.turn.nextUnblockable = false; log('Buzzy: การโจมตีนี้หลบไม่ได้!', 'sys'); }
  for (const t of targets) {
    const d = unblock ? null : await tryDefend(t, src, spec);
    if (d && spec.onDodge) await spec.onDodge(t); // onDodge(t): target avoided or reflected the attack
    if (d === 'avoid') continue;
    // spec.dmg may be a function: damage worked out per target, after defence (e.g. revealed card's cost)
    const dmgFor = async who => typeof spec.dmg === 'function' ? await spec.dmg(who) : (spec.dmg || 0);
    if (d === 'redirect' && spec.noRedirect) continue; // Saint Gloatsworth: it can be dodged but never reflected
    if (d === 'redirect') {
      // the whole effect bounces back to the attacker (Null, Hungry God: twice)
      for (let k = 1; k < (G.redirectTimes || 1); k++) {
        const n2 = await dmgFor(src);
        if (n2) { log(`${t.name} สะท้อน ${n2} ดาเมจกลับไปหา ${src.name}!`, 'dmg'); await damage(src, n2, t); }
        for (let i = 0; i < (spec.bent || 0); i++) gainBent(src);
        if (spec.discard) await discardFromHand(src, spec.discard);
      }
      for (let i = 0; i < (spec.bent || 0); i++) gainBent(src);
      if (spec.discard) await discardFromHand(src, spec.discard);
      const n = await dmgFor(src);
      if (n) { log(`${t.name} สะท้อน ${n} ดาเมจกลับไปหา ${src.name}!`, 'dmg'); await FX.bolt(t, src, '#59c2c7'); await damage(src, n, t); }
      continue;
    }
    const n = await dmgFor(t);
    t.lastDmg = 0;
    // Kaboom Colosseum / Xtreme Nacho Arena: each doubles its owner's attack damage
    const mult = src ? 2 ** src.ongoing.filter(c => c.id === 'arena' || c.id === 'nacho').length : 1;
    // token "แพ้ Wand": +3 from the starter Wand's attack
    const wandHit = n && G.curCard && G.curCard.id === 'wand' ? 3 * t.tokens.filter(k => k.id === 'wandweak').length : 0;
    if (n && await damage(t, (n + bonus + wandHit) * mult, src || spec.by, { tokenPick: spec.tokenPick })) { kills++; if (spec.onKill) await spec.onKill(t); }
    if (spec.onHit && t.lastDmg) await spec.onHit(t, t.lastDmg); // onHit(t, dealt): after damage lands
    dealtTotal += t.lastDmg || 0;
    for (let i = 0; i < (spec.bent || 0); i++) gainBent(t);
    if (spec.discard) await discardFromHand(t, spec.discard);
    render(); await sleep(AI_DELAY / 3);
  }
  // The Whirlpool of Total Nonsense: the first attack each turn that deals damage gives that much power
  if (src && src === cur() && dealtTotal && !G.turn.vortexUsed && src.ongoing.some(c => c.id === 'vortexfuckery')) {
    G.turn.vortexUsed = true; P(src, dealtTotal); log(`The Vortex: ${src.name} +${dealtTotal} พลัง`, 'sys');
  }
  return kills;
}

function describe(spec) {
  const a = [];
  if (spec.dmgText) a.push(spec.dmgText);
  else if (spec.dmg) a.push(`${spec.dmg} ดาเมจ`);
  if (spec.bent) a.push('ได้ Limp Wand');
  if (spec.discard) a.push(`ทิ้งการ์ด ${spec.discard} ใบ`);
  return a.join(' + ');
}

async function tryDefend(t, src, spec) {
  if (spec.chaos && t.tokens.some(k => k.id === 'nododge')) return null; // token: can't dodge Chaos attacks
  if (t.isAI && spec.benign) return null; // an 'attack' that helps the target (Chaos 24/T): the AI lets it through
  if (G.turn.noDefense && G.turn.noDefense.includes(t)) return null; // The Bite of Sin: no defences this turn
  // each defence card works once per turn (G.turn is replaced at the start of every turn)
  const used = G.turn.defUsed ||= [];
  // defInPlay: an Ongoing card that defends from the table (leaves play to the discard pile)
  const defs = [...t.hand.filter(c => c.def), ...t.ongoing.filter(c => c.defInPlay)].filter(c => !used.includes(c))
    .filter(c => !t.isAI || !c.aiDefOk || c.aiDefOk(t, src, spec)); // aiDefOk: a costly defence the AI should skip (e.g. Gimby)
  if (!defs.length) return null;
  let choice;
  if (t.isAI) {
    // prefer reflecting; keep cards on the table (e.g. a VP set) as the last resort
    choice = defs.slice().sort((a, b) => ((b.redirect && src ? 1 : 0) - (a.redirect && src ? 1 : 0)) || ((a.defInPlay ? 1 : 0) - (b.defInPlay ? 1 : 0)))[0];
  } else {
    const who = src ? src.name : (G.curLabel || 'โกลาหล');
    choice = await humanChoose(t, `${who} โจมตีคุณ!`, [
      ...defs.map(c => ({ card: c, value: c })), { label: 'ไม่ป้องกัน รับการโจมตี', value: null, ghost: true }],
      `${G.curLabel}: ${describe(spec)} · เลือกการ์ดป้องกันจากมือหรือในสนาม (ใช้ได้ 1 ใบต่อการโจมตี · แต่ละใบใช้ได้ครั้งเดียวต่อเทิร์น)`);
  }
  if (!choice) return null;
  used.push(choice);
  log(`${t.name} ป้องกันด้วย ${choice.name}`, 'good');
  showEvent(choice, `${t.name} ป้องกัน`, 'defend');
  AUD.play(choice.redirect && src ? 'reflect' : 'shield'); FX.ring(t);
  if (choice.defDiscard) { t.hand.splice(t.hand.indexOf(choice), 1); t.discard.push(choice); }
  if (choice.defInPlay && t.ongoing.includes(choice)) { t.ongoing.splice(t.ongoing.indexOf(choice), 1); t.discard.push(choice); log(`${choice.name} ออกจากสนามของ ${t.name}`); }
  // defTopdeck: the card goes face up on top of the deck, so it comes back with the next draw
  if (choice.defTopdeck) { t.hand.splice(t.hand.indexOf(choice), 1); t.deck.push(choice); log(`${choice.name} หงายอยู่บนสุดของเด็ค ${t.name}`); }
  // defBottom: the card goes to the bottom of the deck (Brats!, Null)
  if (choice.defBottom) { t.hand.splice(t.hand.indexOf(choice), 1); t.deck.unshift(choice); log(`${choice.name} ไปอยู่ใต้เด็ค ${t.name}`); }
  G.redirectTimes = choice.redirectTimes || 1; // Null, Hungry God reflects twice
  if (choice.onDefend) await choice.onDefend(t, src, choice, spec);
  return choice.redirect && src ? 'redirect' : 'avoid';
}

async function damage(t, n, killer, opts) {
  if (hasTrait(t, 'iron') && !t.ironUsed && n > 0) { n -= 1; t.ironUsed = true; }
  t.lastDmg = Math.max(0, n); // damage actually dealt, read by spec.onHit
  if (n <= 0) return false;
  t.hp -= n; t.hitFlash = true;
  log(`${t.name} รับ ${n} ดาเมจ (${Math.max(t.hp, 0)} HP)`, 'dmg');
  render();
  AUD.play('impact', n); FX.hit(t, n);
  // Chubbula Snack Shack: on your own turn, heal as much as you deal to an enemy
  if (killer && killer !== t && killer === cur() && killer.ongoing.some(c => c.id === 'snackcart')) heal(killer, n);
  if (t.hp < 1) { await kill(t, killer, opts); return true; }
  return false;
}

// how much the killer likes the victim getting each token (AI picks the highest)
const TOKEN_SPITE = { weak: 3, hexk: 3, cursed: 2, tax: 2, plain: 1, insight: 0, haunt: -1, second: -2, bitter: -2, veng: -3 };
// reveal n Dead Wizard tokens, the killer gives one to the victim, the rest are shuffled back
async function pickToken(t, killer, n) {
  const shown = G.tokens.splice(-n).reverse();
  log(`${killer.name} เปิด Dead Wizard Token ${shown.length} อัน: ${shown.map(k => k.name).join(', ')}`, 'sys');
  const tok = killer.isAI
    ? shown.slice().sort((a, b) => (TOKEN_SPITE[b.id] || 0) - (TOKEN_SPITE[a.id] || 0))[0]
    : await humanChoose(killer, `เลือก Dead Wizard Token ให้ ${t.name}`, shown.map(k => ({ label: `${k.name}: ${k.text}`, value: k })),
      'อันที่ไม่ได้เลือกจะถูกสับกลับเข้ากอง');
  shown.splice(shown.indexOf(tok), 1);
  G.tokens.push(...shown); shuffle(G.tokens);
  log(`${killer.name} เลือก “${tok.name}” ให้ ${t.name}`, 'sys');
  return tok;
}
// Frenemy Finisher: on the killer's next kill this turn they may take the Dead Wizard token themself and gain a Legend
async function offerFriendality(t, killer) {
  if (!(killer && killer !== t && killer === cur() && G.turn.friendality > 0)) return false;
  G.turn.friendality--;
  const up = G.legendRow.filter(Boolean);
  const L = up.slice().sort((a, b) => b.vp - a.vp)[0]; // shown as the prize; the player picks which one when gaining
  if (!L) { log('Frenemy Finisher: ไม่มีตำนานเหลือให้รับ'); return false; }
  const yes = killer.isAI ? L.vp >= 4
    : await humanChoose(killer, `Frenemy Finisher! ไว้ชีวิต ${t.name}?`, [{ label: `ใช่ · คุณรับ Dead Wizard Token แทน และได้ ${L.name}`, value: true }, { label: 'ไม่ · ให้เขารับ Token ตามปกติ', value: false, ghost: true }],
      `${cardHTML(L, { small: true })}<br>Dead Wizard Token หัก VP ตอนจบเกม (ส่วนใหญ่ -3)`);
  if (yes) log(`${killer.name} ใช้ Frenemy Finisher! รับ Dead Wizard Token แทน ${t.name}`, 'sys');
  return yes;
}
// gain one face-up Legend of p's choice for free; its slot refills at end of turn, like buying it
async function gainTopLegend(p) {
  const up = G.legendRow.filter(Boolean); if (!up.length) return;
  const L = up.length === 1 ? up[0] : p.isAI ? up.slice().sort((a, b) => b.vp - a.vp)[0]
    : await humanChoose(p, 'เลือกตำนาน 1 ใบ (ฟรี)', up.map(x => ({ card: x, value: x })));
  G.legendRow[G.legendRow.indexOf(L)] = null;
  await placeGained(p, L); gainedCard(p, L);
  log(`${p.name} ได้ตำนาน ${L.name}!`, 'sys'); AUD.play('legendWin'); render(); await FX.legendWin(p, L);
  await cometStrike(p, L);
}
async function kill(t, killer, { tokenPick = 0 } = {}) {
  const swap = await offerFriendality(t, killer);
  const tok = (!swap && tokenPick > 1 && killer && killer !== t && G.tokens.length > 1 ? await pickToken(t, killer, tokenPick) : G.tokens.pop())
    || { id:'plain', name:'หลุมศพธรรมดา', text:'ไม่มีผลเพิ่ม' };
  (swap ? killer : t).tokens.push(tok);
  announceToken(swap ? killer : t, tok); // pop the token up mid-screen
  t.hp = swap ? 20 : tok.respawn || 20;
  log(swap ? `☠ ${t.name} ตาย! (โดย ${killer.name}) · ${killer.name} รับ Dead Wizard Token “${tok.name}” แทน · ${t.name} ฟื้นคืนชีพที่ ${t.hp} HP`
    : `☠ ${t.name} ตาย!${killer && killer !== t ? ` (โดย ${killer.name})` : ''} ได้รับ Dead Wizard Token “${tok.name}”: ${tok.text} · ฟื้นคืนชีพที่ ${t.hp} HP`, 'kill');
  AUD.play('kill'); render(); await FX.kill(t, swap ? { name: `${tok.name} (${killer.name} รับแทน)` } : tok);
  if (killer && killer !== t) {
    if (G.trophy !== killer) { G.trophy = killer; log(`${killer.name} ได้ถ้วยรางวัลแชมป์ (จั่ว 6 ทิ้ง 1 ตอนจบเทิร์น)`, 'sys'); }
    if (hasTrait(killer, 'bone')) { heal(killer, 3); await draw(killer, 1); }
    // Kaboom Colosseum leaves play whenever its owner kills someone
    const arena = killer.ongoing.find(c => c.id === 'arena');
    if (arena) { killer.ongoing.splice(killer.ongoing.indexOf(arena), 1); killer.discard.push(arena); log(`Kaboom Colosseum ของ ${killer.name} ลงกองทิ้ง`, 'sys'); }
  }
  // Doggo the Gloomy in the receiver's discard pile cancels a new token's immediate effect
  const receiver = swap ? killer : t;
  if (tok.now && receiver.discard.some(c => c.id === 'dogo')) log(`Doggo the Gloomy ยกเลิกผลของ Token “${tok.name}”`, 'good');
  else if (tok.now) await (swap ? tok.now(killer, null) : tok.now(t, killer));
  if (swap) await gainTopLegend(killer);
  if (G.tokens.length === 0 && !G.ending) { G.ending = 'Dead Wizard Token หมดกอง'; log('Dead Wizard Token หมดแล้ว! เกมจะจบเมื่อจบเทิร์นนี้', 'sys'); }
  render();
}

async function discardFromHand(t, n) {
  for (let i = 0; i < n && t.hand.length; i++) {
    let c;
    if (t.isAI) c = t.hand.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
    else c = await humanChoose(t, 'ทิ้งการ์ดจากมือ 1 ใบ', t.hand.map(x => ({ card: x, value: x })));
    t.hand.splice(t.hand.indexOf(c), 1); t.discard.push(c);
    log(`${t.name} ทิ้ง ${c.name}`); AUD.play('discard');
  }
}

// junk the AI is happy to destroy: Limp Wand, Fizzle, and Rune once the deck is big enough
const isJunk = p => x => x.id === 'bent' || x.id === 'fizzle' || (x.id === 'rune' && allCards(p).length > 16);
// destroy up to n cards from p's hand, one at a time; the human may stop early
async function destroyFromHand(p, n) {
  for (let k = 0; k < n && p.hand.length; k++) {
    const c = p.isAI ? p.hand.find(isJunk(p)) || null
      : await humanChoose(p, `ทำลายการ์ดในมือ (${k + 1}/${n})`, [...p.hand.map(x => ({ card: x, value: x })), { label: 'พอแล้ว', value: null, ghost: true }],
        'การ์ดที่ถูกทำลายจะออกจากเกมถาวร');
    if (!c) break;
    p.hand.splice(p.hand.indexOf(c), 1); G.destroyed.push(c);
    log(`${p.name} ทำลาย ${c.name}`); AUD.play('destroy'); render();
  }
}
// Ongoing cards with sacrifice(): destroy the card itself to use its effect, any time on your turn
async function sacrificeCard(p, uid) {
  const c = p.ongoing.find(x => x.uid === uid && x.sacrifice);
  if (!c) return false;
  p.ongoing.splice(p.ongoing.indexOf(c), 1); G.destroyed.push(c);
  G.curLabel = c.name; log(`${p.name} ทำลาย ${c.name} เพื่อใช้ผล`, 'sys'); AUD.play('destroy'); render();
  await c.sacrifice(p, c);
  render();
  return true;
}
async function destroyOwn(p, { discardOnly = false } = {}) {
  const pool = discardOnly ? [...p.discard] : [...p.hand, ...p.discard];
  if (!pool.length) return null;
  let c;
  if (p.isAI) c = pool.find(x => x.id === 'bent') || pool.find(x => x.id === 'fizzle') || (allCards(p).length > 16 ? pool.find(x => x.id === 'rune') : null) || null;
  else c = await humanChoose(p, `ทำลายการ์ด 1 ใบ (${discardOnly ? 'จากกองทิ้ง' : 'จากมือหรือกองทิ้ง'})`, [...pool.map(x => ({ card: x, value: x })), { label: 'ไม่ทำลาย', value: null, ghost: true }],
    'การ์ดที่ถูกทำลายจะออกจากเกมถาวร · ทำลาย Fizzle / Limp Wand ช่วยให้เด็คดีขึ้น');
  if (!c) return null;
  const arr = p.hand.includes(c) ? p.hand : p.discard;
  arr.splice(arr.indexOf(c), 1); G.destroyed.push(c);
  log(`${p.name} ทำลาย ${c.name}`); AUD.play('destroy');
  render();
  return c;
}

async function destroyOngoing(t) {
  if (!t.ongoing.length) return;
  let c;
  if (t.isAI) c = t.ongoing.slice().sort((a, b) => a.cost - b.cost)[0];
  else c = await humanChoose(t, 'แผ่นดินไหว! ทำลายการ์ดต่อเนื่อง 1 ใบ', t.ongoing.map(x => ({ card: x, value: x })));
  t.ongoing.splice(t.ongoing.indexOf(c), 1); G.destroyed.push(c);
  log(`${t.name} เสีย ${c.name}`, 'dmg'); AUD.play('destroy');
}

async function gainFromLineup(p, max) {
  const opts = G.lineup.map((c, i) => ({ c, i })).filter(o => o.c && o.c.cost <= max && canOwn(p, o.c));
  if (!opts.length) { log('ไม่มีการ์ดใน Line-Up ที่รับได้'); return; }
  let pick;
  if (p.isAI) pick = opts.sort((a, b) => b.c.cost + b.c.vp - a.c.cost - a.c.vp)[0];
  else pick = await humanChoose(p, `รับการ์ดราคาไม่เกิน ${max} ฟรี`, opts.map(o => ({ card: o.c, value: o })));
  G.lineup[pick.i] = null; G.gainSrc = 'lineup'; await placeGained(p, pick.c); G.gainSrc = null; gainedCard(p, pick.c);
  await cometStrike(p, pick.c);
  log(`${p.name} รับ ${pick.c.name} ฟรี`, 'good');
}

/* ✲ เปิดใช้: text before ✲ resolves on play; the ✲ part (card.activate) can be used once, whenever the
   player chooses later that turn, if card.canActivate(p) allows it. Unused abilities lapse at end of turn. */
const canUse = (p, c) => !c.canActivate || c.canActivate(p);
async function activateCard(p, uid) {
  const c = (G.turn.ready || []).find(x => x.uid === uid);
  if (!c || !canUse(p, c)) return false;
  G.turn.ready.splice(G.turn.ready.indexOf(c), 1);
  G.curLabel = c.name;
  log(`${p.name} ✲ เปิดใช้ ${c.name}`, 'sys'); AUD.play('power');
  showEvent(c, `${p.name} เปิดใช้ ✲`, 'act');
  render();
  await c.activate(p, c);
  render();
  return true;
}
async function playCard(p, card, { fromOther = null } = {}) {
  if (!fromOther) p.hand.splice(p.hand.indexOf(card), 1);
  G.turn.types[card.type] = (G.turn.types[card.type] || 0) + 1;
  if (card.alsoType) G.turn.types[card.alsoType] = (G.turn.types[card.alsoType] || 0) + 1; // e.g. a Legend that is also a Wizard
  if (card.allTypes) for (const ty of ['spell', 'creature', 'treasure', 'wizard', 'location']) if (ty !== card.type) G.turn.types[ty] = (G.turn.types[ty] || 0) + 1;
  G.curLabel = card.name;
  G.curCard = card; // the card whose effect is resolving (cleared after it resolves)
  G.turn.shown.push(card);
  log(`${p.name} ใช้ ${card.name}`);
  AUD.play('card');
  if (card.power) { P(p, card.power); AUD.play('power'); }
  if (card.ongoing && !fromOther) p.ongoing.push(card); else if (!fromOther) G.turn.played.push(card);
  render();
  if (card.play) await card.play(p, card);
  if (card.activate) (G.turn.ready ||= []).push(card); // ✲ ability: usable once, any time later this turn
  // Ongoing cards that react to their owner playing a card (e.g. Squid Fortress)
  G.curCard = null;
  for (const o of p.ongoing.slice()) if (o.onCardPlayed && o !== card) await o.onCardPlayed(p, card);
  // wizard ability tiles that react to their owner's own plays
  if (p === cur()) for (const tr of traitsOf(p)) if (tr.onCardPlayed) await tr.onCardPlayed(p, card);
  if (fromOther) fromOther.discard.push(card);
  render();
}

async function buy(p, src, i) {
  let card;
  if (src === 'lineup') card = G.lineup[i];
  else if (src === 'wild') card = G.wild > 0 ? make('wild') : null;
  else if (src === 'legend') card = G.legendRow[i];
  else if (src === 'familiar') card = p.familiar;
  if (!card) return false;
  if (!canOwn(p, card)) { if (!p.isAI) log(`มี ${card.name} ได้คนละ 1 ใบเท่านั้น`); return false; }
  const k = costFor(p, card);
  if (k > G.turn.power) return false;
  const slot = document.querySelector(src === 'lineup' || src === 'legend' ? `[data-src="${src}"][data-i="${i}"]` : `[data-src="${src}"]`);
  const from = slot && slot.getBoundingClientRect();
  G.turn.power -= k;
  if (src === 'lineup') G.lineup[i] = null;
  if (src === 'wild') G.wild--;
  if (src === 'legend') {
    G.legendRow[i] = null; // refilled from the face-down stack at end of turn
    // a Legend was defeated: every second ability granted by Papa Skeleton ends
    for (const x of G.players) if (x.trait2) { log(`${x.name} เสียความสามารถ ${x.trait2.name} (มีคนปราบตำนาน)`); x.trait2 = null; }
  }
  if (src === 'familiar') p.familiar = null;
  G.gainSrc = src; // where it came from (ability "ของถูกขึ้นเด็ค")
  await placeGained(p, card);
  G.gainSrc = null;
  log(`${p.name} ซื้อ ${card.name} (${k})`, src === 'legend' ? 'sys' : '');
  if (src === 'legend') { log(`${p.name} ล้มตำนาน ${card.name} ได้!`, 'sys'); AUD.play('legendWin'); render(); await FX.legendWin(p, card); }
  else { AUD.play('buy'); FX.coins(from, p); }
  if (card.type === 'spell' && hasTrait(p, 'mind') && !G.turn.mindUsed) { G.turn.mindUsed = true; await draw(p, 1); }
  gainedCard(p, card);
  await cometStrike(p, card);
  render();
  return true;
}

/* ---------------- turn flow ---------------- */
async function refillLineup() {
  for (let i = 0; i < 5; i++) {
    while (!G.lineup[i]) {
      if (!G.main.length) { G.ending = 'การ์ดในกองหลักไม่พอเติม Line-Up'; return; }
      const c = G.main.pop();
      if (c.type === 'chaos') {
        G.curLabel = c.name;
        log(`โกลาหล! ${c.name}: ${c.text.replace(/<[^>]+>/g, '')}`, 'sys');
        G.chaosShown = c; render(); AUD.play('chaos'); await FX.chaos(c);
        await c.chaos();
        G.destroyed.push(c); G.chaosShown = null;
      } else G.lineup[i] = c;
    }
  }
}

async function startTurn(p) {
  G.turn = { power: 0, played: [], shown: [], types: {}, attacked: false };
  p.ironUsed = false;
  log(`เทิร์นของ ${p.name}`, 'turn');
  render();
  await refillLineup(); if (G.ending) return;
  await FX.turn(p);
  for (const c of p.ongoing.slice()) if (c.onStart) { G.curLabel = c.name; await c.onStart(p); }
  for (const k of p.tokens) if (k.start) await k.start(p);
  if (standHolder() === p && !p.tokens.some(k => k.id === 'trophyless')) {
    G.curLabel = 'Squid Idol';
    log(`Squid Idol ของ ${p.name} ตื่นขึ้น!`, 'sys');
    for (let i = 0; i < 2; i++) {
      const os = opps(p), t = os[rnd(os.length)];
      AUD.play('cast'); await FX.bolt(p, t, '#3fd0a0');
      await damage(t, 1, p);
    }
  }
  if (hasTrait(p, 'coin') && p.hand.some(c => c.type === 'treasure')) { P(p, 1); log(`${p.name} (Coin Witch) +1 พลัง`); }
  render();
}

async function endTurn(p) {
  G.quietMoves = true; // cleanup and the new hand are not news
  p.lastPlayed = G.turn.shown.slice();
  // Brats!: goes to the bottom of its player's deck instead of the discard pile
  const bottom = G.turn.played.filter(c => c.endBottom); p.deck.unshift(...bottom);
  p.discard.push(...p.hand, ...G.turn.played.filter(c => !c.endBottom)); p.hand = []; G.turn.played = [];
  if (hasTrait(p, 'monk') && !G.turn.attacked) heal(p, 2);
  G.turn.power = 0;
  const handSize = 5 + p.ongoing.filter(c => c.id === 'palm').length // Hand of the Maker: +1 card
    + (p.hp >= 25 && p.ongoing.some(c => c.id === 'snackcart') ? 2 : 0) // Chubbula Snack Shack at full HP: +2
    - (p.drawPenalty || 0) // Sour Milk and the Brat Pack: one fewer card, once
    + (hasTrait(p, 'wizardDraw') ? G.turn.gainedWiz || 0 : 0) + (hasTrait(p, 'spellDraw') ? G.turn.gainedSpell || 0 : 0); // abilities
  p.drawPenalty = 0;
  if (G.trophy === p && !p.tokens.some(k => k.id === 'trophyless')) { // token "ถ้วยไร้ผล": no trophy bonus
    await draw(p, handSize + 1);
    let c;
    if (p.isAI) c = p.hand.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
    else c = await humanChoose(p, 'ถ้วยรางวัลแชมป์: ทิ้งการ์ด 1 ใบ', p.hand.map(x => ({ card: x, value: x })), `คุณจั่ว ${handSize + 1} ใบ ทิ้ง 1 เพื่อให้เหลือ ${handSize}`);
    if (c) { p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); }
  } else await draw(p, handSize);
  trackMoves(); G.quietMoves = false; // remember the cleaned-up table, then report moves again
  // refill empty Legend slots from the face-down stack; each new Legend's Group Attack hits everyone
  for (let i = 0; i < G.legendRow.length && !G.ending; i++) {
    if (G.legendRow[i]) continue;
    if (!G.legends.length) { G.ending = 'ล้มตำนานครบทุกตนแล้ว'; break; }
    const L = G.legends.shift();
    G.legendRow[i] = L;
    G.curLabel = L.name + ' (Group Attack)';
    log(`ตำนาน ${L.name} ปรากฏ! Group Attack: ${L.group}`, 'sys');
    render(); AUD.play('legendUp'); await FX.legend(L);
    if (L.gattack) await L.gattack();
  }
  render();
}

// once-per-turn activated wizard abilities ("ใช้ความสามารถ" button)
const traitReady = (p, tr) => tr.activate && !(G.turn.traitUsed || {})[tr.id] && (!tr.canActivate || tr.canActivate(p));
async function useTrait(p, id) {
  const tr = traitsOf(p).find(t => t.id === id);
  if (!tr || !traitReady(p, tr)) return false;
  (G.turn.traitUsed ||= {})[id] = true;
  log(`${p.name} ใช้ความสามารถ ${tr.name}`, 'sys'); AUD.play('power');
  await tr.activate(p); render();
  return true;
}

async function aiTurn(p) {
  await wait();
  for (const c of p.ongoing.slice()) if (c.sacrifice && c.aiSacrifice && c.aiSacrifice(p)) { await sacrificeCard(p, c.uid); await wait(); }
  const pri = c => c.playFirst ? -1 : c.playLate ? 3 : c.draws ? 0 : c.atk ? 2 : 1;
  do {
    while (p.hand.length) {
      const c = p.hand.slice().sort((a, b) => pri(a) - pri(b))[0];
      await playCard(p, c); await wait();
    }
    for (const c of (G.turn.ready || []).slice()) if (canUse(p, c)) { await activateCard(p, c.uid); await wait(); }
    for (const tr of traitsOf(p)) if (traitReady(p, tr) && (!tr.aiUse || tr.aiUse(p))) { await useTrait(p, tr.id); await wait(); } // ability tiles
  } while (p.hand.length);
  while (true) {
    const opts = [];
    G.lineup.forEach((c, i) => { if (c && canOwn(p, c) && costFor(p, c) <= G.turn.power) opts.push({ src:'lineup', i, s: vpIfBought(c, p) * 3 + c.cost * 2 + (c.atk ? 2 : 0) + (c.def ? 1 : 0) }); });
    G.legendRow.forEach((L, i) => { if (L && canOwn(p, L) && costFor(p, L) <= G.turn.power) opts.push({ src:'legend', i, s: 1000 + vpIfBought(L, p) }); });
    if (p.familiar && costFor(p, p.familiar) <= G.turn.power) opts.push({ src:'familiar', s: p.familiar.cost * 2 + p.familiar.vp * 3 + 3 });
    if (G.wild > 0 && costFor(p, DEFS.wild) <= G.turn.power) opts.push({ src:'wild', s: 5 });
    if (!opts.length) break;
    opts.sort((a, b) => b.s - a.s);
    if (!(await buy(p, opts[0].src, opts[0].i))) break;
    await wait();
    if (opts[0].src === 'legend') break; // a Legend is the big buy of the turn
  }
  // Dr. Continuum: cards bought straight into hand get played, then the AI shops again (at most 2 extra rounds)
  if (G.turn.gainToHand && p.hand.length && (G.turn.aiRounds = (G.turn.aiRounds || 0) + 1) < 3) return aiTurn(p);
}

function humanTurn() {
  return new Promise(res => { G.endTurnResolve = res; render(); });
}

async function runGame() {
  const myGame = G;
  while (G === myGame) {
    const p = cur();
    await startTurn(p);
    if (G !== myGame) return;
    if (!G.ending) { if (p.isAI) await aiTurn(p); else await humanTurn(p); }
    if (G !== myGame) return;
    await endTurn(p);
    if (G.ending) return finish();
    G.cur = (G.cur + 1) % G.players.length;
  }
}

function finish() {
  G.over = true;
  const rows = finalRows();
  log(`เกมจบ: ${G.ending}`, 'sys');
  render();
  NET.flush(); NET.send({ t: 'finish' }); // the final snapshot shows every card, so guests can score it
  showFinal(rows);
}
// the score table: the host works it out in finish(); a guest from its last snapshot (all cards are visible once G.over)
function finalRows() {
  return G.players.map(p => {
    const cards = allCards(p);
    const vp = cards.reduce((s, c) => s + Math.max(0, vpOf(c, p)), 0);
    const bents = ownsViagrus(p) ? 0 : -limpVP(p) * cards.filter(c => c.id === 'bent').length; // Viagrus: counted +1 in vp instead
    const legends = cards.filter(c => c.type === 'legend').length;
    const total = vp - bents + tokensVP(p);
    return { p, vp, bents, legends, tokens: p.tokens.length, tokenVP: tokensVP(p), total };
  }).sort((a, b) => (b.p === G.instantWinner) - (a.p === G.instantWinner) || b.total - a.total || b.legends - a.legends || a.tokens - b.tokens); // Ultimate Winner's Wand wins outright
}
function showFinal(rows = finalRows()) {
  const win = rows[0].p === meP();
  AUD.play(win ? 'victory' : 'defeat'); FX.victory(win, rows[0].p.name);
  const m = $('#modal'); m.hidden = false;
  $('#m-title').textContent = `${rows[0].p.name} ชนะ!`;
  $('#m-sub').innerHTML = `เกมจบเพราะ${G.ending}`;
  $('#m-opts').innerHTML = `<div class="tablewrap" style="width:100%"><table class="score"><tr><th>พ่อมด</th><th>VP การ์ด</th><th>Limp Wand</th><th>Dead Wizard Token</th><th>ตำนาน</th><th>รวม</th></tr>
    ${rows.map((r, i) => `<tr class="${i === 0 ? 'win' : ''}"><td>${r.p.name}</td><td>${r.vp}</td><td>-${r.bents}</td><td>${r.tokenVP}</td><td>${r.legends}</td><td>${r.total}</td></tr>`).join('')}</table></div>
    ${NET.role === 'guest' ? '<div class="msub">รอเจ้าภาพเริ่มเกมใหม่ หรือ</div><button class="btn ghost" id="leave">ออกจากห้อง</button>'
      : `<button class="btn" id="again">${NET.role === 'host' ? 'กลับไปที่ห้อง เล่นอีกรอบ' : 'เล่นอีกครั้ง'}</button>`}`;
  $('#m-opts').onclick = e => {
    if (e.target.id === 'again') { m.hidden = true; if (NET.role === 'host') NET.showLobby(); else showSetup(); }
    if (e.target.id === 'leave') NET.leave();
  };
}

/* ---------------- setup ---------------- */
// One colour per seat (you first): seat border + name, your panel, names in the battle log and arena title.
const PLAYER_COLORS = ['#f4f1ea', '#ff6b6b', '#7ee081', '#c792ea', '#ffcb47'];
const pcName = p => `<span class="pname" style="color:${p.color || 'inherit'}">${p.name}</span>`;

// name = seat 0; more = other human players' names (online room), seated after you; then nAI computer players
function newGame(name, nAI, more = []) {
  const humans = [name, ...more];
  ZOOMS.clear();
  uidc = 1;
  const traits = shuffle(TRAITS.slice()), fams = shuffle(FAMILIARS.slice());
  const aiNames = shuffle(['Morla the Moist', 'Quibb Tallhat', 'Snaggle Fenwick', 'Dame Gristle']);
  const players = [];
  for (let i = 0; i < humans.length + nAI; i++) {
    const deck = [];
    for (let k = 0; k < 6; k++) deck.push(make('rune'));
    deck.push(make('wand'));
    for (let k = 0; k < 3; k++) deck.push(make('fizzle'));
    const human = i < humans.length;
    players.push({ name: human ? humans[i] : aiNames[i - humans.length], color: PLAYER_COLORS[i % PLAYER_COLORS.length], isAI: !human, hp: 20, deck: shuffle(deck), hand: [], discard: [], ongoing: [],
      tokens: [], trait: traits[i], famChoices: [make(fams[i * 2]), make(fams[i * 2 + 1])], familiar: null });
    players[i].famChoices.forEach(c => { c.owner = players[i]; }); // familiars remember their owner (Kraken Egg)
    if (players[i].trait.id === 'weirdWand') { const d = players[i].deck, r = d.findIndex(c => c.id === 'rune'); d[r] = make('weirdwand'); } // ability tile
  }
  const main = [];
  for (const [id, n] of Object.entries(MAIN)) for (let k = 0; k < n; k++) main.push(make(id));
  shuffle(main);
  const nLeg = { 2:5, 3:6, 4:7, 5:8 }[players.length];
  // Dead Wizard tokens: each kind once, 4 per player drawn at random (5 players use all 20)
  const tokPool = shuffle(TOKENS.map(k => ({ ...k }))).slice(0, players.length * 4);
  G = { players, cur: 0, main, lineup: [null, null, null, null, null], wild: 16, bent: 16, destroyed: [], log: [],
    // Legendary Line-Up: 3 face-up Legends to buy (Willy always among them) over a face-down stack
    legendRow: null, legends: shuffle(LEGENDS.slice()).slice(0, nLeg + 2).map(make),
    tokens: shuffle(tokPool), trophy: null, turn: { power: 0, played: [], shown: [], types: {} }, ending: null, busy: false, curLabel: '' };
  G.legendRow = [make('willy'), G.legends.shift(), G.legends.shift()]; // flipped at setup: no Group Attacks
  // initial line-up has no Chaos
  const chaos = [];
  while (G.lineup.includes(null)) {
    const c = G.main.pop();
    if (c.type === 'chaos') chaos.push(c); else G.lineup[G.lineup.indexOf(null)] = c;
  }
  G.main.push(...chaos); shuffle(G.main);
  players.forEach(p => { for (let k = 0; k < 5; k++) p.hand.push(p.deck.pop()); });
  G.cur = rnd(players.length);
}

// guests = online players [{ name, peer }] (host only); they take the seats after yours
async function startGame(name, nAI, guests = []) {
  newGame(name, nAI, guests.map(g => g.name));
  ME = 0;
  if (guests.length) { G.online = true; guests.forEach((g, k) => { G.players[k + 1].peer = g.peer; }); }
  for (const p of G.players) {
    if (p.isAI) p.familiar = p.famChoices[rnd(2)];
  }
  render();
  // every human picks at the same time (online, each in their own browser)
  await Promise.all(G.players.filter(p => !p.isAI).map(async p => {
    p.familiar = await humanChoose(p, 'เลือกสัตว์รับใช้ของคุณ', p.famChoices.map(c => ({ card: c, value: c })),
      `ความสามารถพ่อมดของคุณ: <b>${p.trait.name}</b> — ${p.trait.text}<br>สัตว์รับใช้วางข้างตัวคุณ มีแค่คุณที่ซื้อได้`);
    if (p.isAI && !p.famChoices.includes(p.familiar)) p.familiar = p.famChoices[0]; // left during the pick
  }));
  log(`เริ่มเกม! ${G.players[G.cur].name} เล่นก่อน`, 'sys');
  runGame();
}

function showSetup(err = '') {
  const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide');

  $('#m-opts').innerHTML = `<div class="setup-grid" style="width:100%">
    <label class="fld" for="in-name">ชื่อพ่อมดของคุณ<input id="in-name" value="${escHTML(NET.savedName() || 'Grand Wizard')}" maxlength="20"></label>
    <label class="fld" for="in-n">จำนวนคู่ต่อสู้ (AI)<select id="in-n"><option value="1">1 คน (2 ผู้เล่น)</option><option value="2">2 คน (3 ผู้เล่น)</option><option value="3" selected>3 คน (4 ผู้เล่น)</option><option value="4">4 คน (5 ผู้เล่น)</option></select></label>
    </div>
    <button class="btn" id="go">เล่นกับ AI</button> <button class="btn ghost" id="show-rules">อ่านกติกา</button>
    <div class="online-box">
      <div class="sect-label">เล่นออนไลน์กับเพื่อน (คนละเครื่อง)</div>
      <div class="online-btns"><button class="btn" id="host">สร้างห้อง</button> <button class="btn ghost" id="join">เข้าห้องเพื่อน</button></div>
      <div class="msub">คนสร้างห้องเป็นเจ้าภาพ เกมรันบนเครื่องเจ้าภาพ เพื่อนเข้าด้วยลิงก์หรือรหัสห้อง เติม AI ให้ครบโต๊ะได้</div>

  $('#m-opts').onclick = e => {

    if (e.target.id === 'go') {
      const k = +$('#in-n').value;
      NET.saveName(n); m.hidden = true; $('#m-opts').onclick = null; startGame(n, k);
    } else if (e.target.id === 'host') NET.createRoom(n);
    else if (e.target.id === 'join') { NET.name = n; NET.showJoin(''); }
    else if (e.target.id === 'show-rules') showRules(true);
  };
}

function showRules(backToSetup) {
  const m = $('#modal'); m.hidden = false;
  $('#m-title').textContent = 'กติกา'; $('#m-sub').textContent = '';
  $('#modal .dialog').classList.add('wide');
  $('#m-opts').innerHTML = RULES_HTML + `<button class="btn" id="close-rules">${backToSetup ? 'กลับ' : 'ปิด'}</button>`;
  $('#m-opts').onclick = e => { if (e.target.id === 'close-rules') { $('#modal .dialog').classList.remove('wide'); if (backToSetup) showSetup(); else m.hidden = true; } };

/* ---------------- UI ---------------- */
let modalStack = null;
// who = the player who decides. Online, the host sends the question to that player's browser and waits for the answer;
// everyone else sees "รอ … ตัดสินใจ" while it is open.
async function humanChoose(who, title, options, sub = '') {
  if (!G || !G.online || !who) return localChoose(title, options, sub);
  (G.waiting ||= []).push(who.name); render();
  try { return who.peer ? await NET.askRemote(who, title, options, sub) : await localChoose(title, options, sub); }
  finally { if (G && G.waiting) { G.waiting.splice(G.waiting.indexOf(who.name), 1); render(); } }
}
function localChoose(title, options, sub = '') {
  return new Promise(res => {
    const m = $('#modal'); m.hidden = false; $('#modal .dialog').classList.remove('wide');
    $('#m-title').textContent = title; $('#m-sub').innerHTML = sub;
    const box = $('#m-opts');
    box.innerHTML = options.map((o, i) => o.card
      ? `<div class="opt-card" data-i="${i}">${cardHTML(o.card, { small: true })}</div>`
      : `<button class="btn ${o.ghost ? 'ghost' : ''}" data-i="${i}">${o.label}</button>`).join('');
    box.onclick = e => {
      const el = e.target.closest('[data-i]'); if (!el) return;
      m.hidden = true; box.onclick = null; res(options[+el.dataset.i].value);
    };
  });
}

// a card affected by an effect: logged into this turn's "what happened" strip and popped up in the middle of
// the screen for a moment. kind: gain · bad · discard · destroy · reveal · defend · act. Only use for public info.
const POP = { items: [], timer: null };
function showEvent(card, label, kind = 'gain') {
  if (!G || !card || !G.turn) return;
  if (NET.role !== 'guest') (G.turn.events ||= []).push({ card, label, kind });
  if (NET.role === 'host' && !NET.tracking) NET.fx('ev', [card, label, kind]); // trackMoves pop-ups are worked out by each guest itself
  if (AI_DELAY === 0) return; // test helpers / instant mode: record only
  POP.items.push({ card, label, kind }); if (POP.items.length > 4) POP.items.shift();
  const el = $('#pop');
  el.innerHTML = POP.items.map(it => `<div class="pop-item ev-${it.kind}"><span class="ev-cap">${it.label}</span>${cardHTML(it.card, { noZoom: true })}</div>`).join('');
  el.classList.remove('out'); el.hidden = false;
  clearTimeout(POP.timer);
  POP.timer = setTimeout(() => { el.classList.add('out'); POP.timer = setTimeout(() => { el.hidden = true; POP.items = []; }, 300); },
    Math.max(1100, AI_DELAY * 2.4));
}

// ---- card-move tracker ----
// Every redraw compares where each card is now with where it was last time, and shows public moves with
// showEvent: received, passed between players, discarded, destroyed, taken from the discard pile, put on a deck.
// Hidden moves (draws, hand↔deck), playing cards and end-of-turn cleanup (G.quietMoves) are not shown.
function cardLocations() {
  const m = new Map();
  // seats are stored by index: online guests rebuild every object from each snapshot, so identities don't survive
  const put = (list, p, z) => { const pi = p ? G.players.indexOf(p) : -1; for (const c of list || []) if (c && c.uid != null) m.set(c.uid, { c, p, pi, z }); };
  for (const p of G.players) {
    put(p.hand, p, 'hand'); put(p.deck, p, 'deck'); put(p.discard, p, 'discard'); put(p.ongoing, p, 'ongoing');
    if (p.familiar) put([p.familiar], p, 'fam');
  }
  if (G.turn) put(G.turn.played, cur(), 'played');
  put(G.lineup, null, 'lineup'); put(G.legendRow, null, 'legendRow'); put(G.legends, null, 'legends');
  put(G.main, null, 'main'); put(G.destroyed, null, 'destroyed');
  return m;
}
function trackMoves() {
  if (!G || !G.players) return;
  const now = cardLocations(), before = G.prevLoc;
  G.prevLoc = now;
  if (!before || G.quietMoves) return;
  NET.tracking = true; try { trackDiff(now, before); } finally { NET.tracking = false; }
}
function trackDiff(now, before) {
  const groups = new Map(); // same player + same kind of move → one event (e.g. a whole hand discarded)
  const add = (key, card, label, kind) => { const g = groups.get(key); if (g) g.n++; else groups.set(key, { card, label, kind, n: 1 }); };
  const shownU = new Set(((G.turn && G.turn.shown) || []).map(c => c.uid)), defU = new Set(((G.turn && G.turn.defUsed) || []).map(c => c.uid));
  for (const [uid, loc] of now) {
    const was = before.get(uid), p = loc.p;
    // a card that went into a zone hidden from this guest (a rival's hand or deck): show it as it was last seen
    const c = loc.c.hidden ? (was && !was.c.hidden ? was.c : null) : loc.c;
    if (!c) continue;
    if (c.type === 'chaos') continue;                                        // Chaos cards have their own showcase
    if (was && was.pi === loc.pi && was.z === loc.z) continue;               // didn't move
    const bad = c.id === 'bent' ? 'bad' : 'gain';
    if (loc.z === 'destroyed') {
      if (!was) continue;
      const wp = G.players[was.pi];
      add(`x-${wp ? wp.name : ''}`, c, wp ? `${wp.name} ทำลาย` : 'ถูกทำลาย', 'destroy');
      continue;
    }
    if (!p) continue;                                                        // refills of the Line-Up / Legend row
    if (!was || was.pi < 0) { if (loc.z !== 'fam') add(`g-${p.name}-${c.uid}`, c, `${p.name} ได้รับ`, bad); continue; } // new or bought
    if (was.pi !== loc.pi) { add(`t-${p.name}-${c.uid}`, c, `${p.name} ได้รับจาก ${G.players[was.pi].name}`, bad); continue; }       // passed between players
    const from = was.z, to = loc.z;
    if (to === 'played' || to === 'ongoing' && from === 'hand') continue;   // played: shown in the arena
    if (from === 'fam') { add(`g-${p.name}-${c.uid}`, c, `${p.name} ได้รับ`, 'gain'); continue; }                  // bought own familiar
    if (to === 'discard' && shownU.has(c.uid)) continue;                     // a played/stolen card going home
    if (to === 'discard' && from === 'hand' && defU.has(c.uid)) continue; // already shown as a defence
    if (to === 'discard' && from === 'hand') add(`d-${p.name}`, c, `${p.name} ทิ้ง`, 'discard');
    else if (to === 'discard' && from === 'deck') add(`dd-${p.name}`, c, `${p.name} ทิ้งจากเด็ค`, 'discard');
    else if (to === 'discard' && from === 'ongoing') add(`do-${p.name}-${c.uid}`, c, `${p.name} นำออกจากสนาม`, 'discard');
    else if (to === 'hand' && from === 'discard') add(`h-${p.name}-${c.uid}`, c, `${p.name} นำขึ้นมือ`, 'gain');
    else if (to === 'deck' && (from === 'discard' || from === 'ongoing')) add(`k-${p.name}`, c, `${p.name} วางบนเด็ค`, 'reveal');
    // hand↔deck and deck→hand stay hidden
  }
  for (const g of groups.values()) {
    if (g.label.endsWith('วางบนเด็ค') && g.n > 3) continue;                 // a reshuffle of the discard pile
    showEvent(g.card, g.n > 1 ? `${g.label} ${g.n} ใบ` : g.label, g.kind);
  }
}

// card zoom: cardHTML remembers each card it draws by key (data-zoom); a right-click shows it large, a click closes it
const ZOOMS = new Map();
function openZoom(k) {
  const c = ZOOMS.get(k); if (!c) return;
  const z = $('#zoom');
  z.innerHTML = `<div class="zoom-wrap">${cardHTML(c, { cls: 'zoomed', noZoom: true })}<div class="zoom-hint">คลิกที่ไหนก็ได้ หรือกด Esc เพื่อปิด</div></div>`;
  z.hidden = false;
  fitNames(z);
}
const closeZoom = () => { $('#zoom').hidden = true; };
document.addEventListener('contextmenu', e => {
  const card = e.target.closest('.card[data-zoom]'); if (!card || card.closest('#zoom')) return;
  e.preventDefault(); openZoom(card.dataset.zoom);
});

// Card names may use at most 2 lines: a longer one gets a smaller font (down to 55% of its normal size).
function fitNames(root = document) {
  root.querySelectorAll('.card .c-name').forEach(el => {
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize);
    const fits = () => el.scrollHeight <= el.clientHeight + 1;
    for (let s = base; !fits() && s > base * 0.55; s -= 0.5) el.style.fontSize = (s - 0.5) + 'px';
  });
  // casting-arena cards are all the same height: shrink the ability text of long cards until it fits
  root.querySelectorAll('.arena .cards.played .card .c-text').forEach(el => {
    el.style.fontSize = '';
    const base = parseFloat(getComputedStyle(el).fontSize);
    for (let s = base; el.scrollHeight > el.clientHeight + 1 && s > 7.5; s -= 0.5) el.style.fontSize = (s - 0.5) + 'px';
  });
}
// cards are drawn by render(), dialogs, viewers and pop-ups: fit names whenever new cards appear (once per frame)
let fitQueued = false;
new MutationObserver(muts => {
  if (fitQueued || !muts.some(m => m.addedNodes.length)) return;
  fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fitNames(); });
}).observe(document.body, { childList: true, subtree: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#zoom').hidden) closeZoom(); });
$('#zoom').addEventListener('click', closeZoom);
function cardHTML(c, o = {}) {
  const cls = ['card', 't-' + c.type];
  if (o.buy) cls.push('buyable'); if (o.play) cls.push('playable'); if (o.dim) cls.push('dim');
  if (o.small) cls.push('small'); if (o.mini) cls.push('mini'); if (o.cls) cls.push(o.cls);
  const tags = [];
  if (c.atk) tags.push('<span class="tag atk">โจมตี</span>');
  if (c.def || c.defInPlay) tags.push('<span class="tag def">ป้องกัน</span>');
  if (c.ongoing) tags.push('<span class="tag ong">ต่อเนื่อง</span>');
  if (c.activate) tags.push('<span class="tag act">✲</span>');
  if (c.unique) tags.push('<span class="tag uniq" title="ผู้เล่นแต่ละคนมีการ์ดนี้ได้ 1 ใบ">1 ใบ/คน</span>');
  const cost = o.cost != null ? o.cost : (c.cost || '');
  const vp = c.vpCalc ? '<span class="c-vp" title="VP เปลี่ยนตามเงื่อนไขตอนจบเกม">★? VP</span>'
    : c.vp ? `<span class="c-vp">${c.vp > 0 ? '★' + c.vp : c.vp} VP</span>` : '';
  const extra = c.type === 'legend' && c.group && c.group !== '—' ? `<br><i>เมื่อปรากฏ: ${c.group}</i>` : '';
  // every card gets a zoom button; the card object is kept so the zoom view can redraw it large
  const zk = String(c.uid != null ? c.uid : 'd-' + c.id);
  ZOOMS.set(zk, c);
  const zoomAttr = o.noZoom ? '' : `data-zoom="${zk}"`;
  return `<div class="${cls.join(' ')}" ${o.attrs || ''} ${zoomAttr} ${o.attrs ? 'tabindex="0"' : ''} title="${c.name} · คลิกขวาเพื่อดูการ์ดขยาย">
    <div class="c-head"><span class="c-cost">${cost}</span><span class="c-name">${c.type === 'chaos' ? 'Chaos' : c.name}</span></div>
    <div class="c-art art-${c.id}"></div>
    <div class="c-type">${TYPE_TH[c.type]}</div>
    <div class="c-text">${c.text || ''}${extra}</div>
    <div class="c-foot"><span>${tags.join('')}</span>${vp}</div></div>`;
}

const hpPct = p => Math.max(0, Math.min(100, p.hp / 25 * 100));
function chipsFor(p) {
  const a = [];
  if (G.trophy === p) a.push('<span class="chip trophy">ถ้วยแชมป์</span>');
  if (p.trait2) a.push(`<span class="chip" title="${p.trait2.text} · ใช้ได้จนกว่าจะมีคนปราบตำนานใบถัดไป">+ ${p.trait2.name}</span>`);
  if (standHolder() === p) a.push('<span class="chip trophy" title="ต้นเทิร์น: ศัตรูแบบสุ่มรับ 1 ดาเมจ 2 ครั้ง (ป้องกันไม่ได้)">Squid Idol</span>');
  if (p.tokens.length) a.push(`<span class="chip skull" title="${p.tokens.map(t => t.name + ': ' + t.text).join('\n')}">☠ ×${p.tokens.length}</span>`);
  const leg = allCards(p).filter(c => c.type === 'legend').length;
  if (leg) a.push(`<span class="chip">ตำนาน ×${leg}</span>`);
  return a.join('');
}

function seatHTML(p, dir) {
  const ong = p.ongoing.length ? `<div class="ong">${p.ongoing.map(c => cardHTML(c, { small: true })).join('')}</div>` : '';
  const i = G.players.indexOf(p);
  return `
    <div class="rival ${cur() === p ? 'active' : ''} ${p.hitFlash ? 'hit' : ''}" data-pi="${i}" style="--pc:${p.color}">
      <div class="seatdir">${dir}</div>
      <div class="rname"><b>${p.name}</b>${G.online ? `<span class="seattag">${p.away ? 'หลุด · AI เล่นแทน' : p.isAI ? 'AI' : 'ผู้เล่น'}</span>` : ''}${cur() === p ? '<span class="trait">กำลังร่ายเวท…</span>' : ''}</div>
      <div class="trait">${p.trait.name}: ${p.trait.text}</div>
      <div style="display:flex;align-items:center;gap:8px"><div class="hpbar" style="flex:1"><i style="width:${hpPct(p)}%"></i></div><span class="hpnum">${p.hp} HP</span></div>
      <div class="stats"><span>มือ <b>${p.hand.length}</b></span><span>เด็ค <b>${p.deck.length}</b></span><span>ทิ้ง <b>${p.discard.length}</b></span></div>
      <div class="chips">${chipsFor(p, false)}</div>
      ${ong}
      <div class="pilebtns">
        <button class="linkbtn" data-act="view" data-what="last" data-p="${i}">เทิร์นล่าสุด (${(p.lastPlayed || []).length})</button>
        <button class="linkbtn" data-act="view" data-what="discard" data-p="${i}">กองทิ้ง (${p.discard.length})</button>
        <button class="linkbtn" data-act="view" data-what="familiar" data-p="${i}">สัตว์รับใช้</button>
      </div>
    </div>`;
}

function render() {
  if (!G) return;
  trackMoves(); // show cards that moved since the last redraw
  document.documentElement.style.setProperty('--ph', -Math.round(performance.now() % 1600) + 'ms');
  const me = meP();
  const myTurn = cur() === me && !G.over && !G.ending && G.endTurnResolve;
  const pw = G.turn ? G.turn.power : 0;
  // seating: rivals only in the left and right columns. Clockwise from you: the first half sit up your left side
  // (nearest you at the bottom), the rest come down your right side.
  const others = [...G.players.slice(ME + 1), ...G.players.slice(0, ME)];
  const seats = { left: [], top: [], right: [] };
  const nLeft = Math.ceil(others.length / 2);

  seats.left.reverse();

  const legendHTML = `<div class="cards">${G.legendRow.map((L, i) => L
    ? cardHTML(L, { cost: costFor(me, L), buy: myTurn && canOwn(me, L) && costFor(me, L) <= pw, attrs: `data-act="buy" data-src="legend" data-i="${i}"` })
    : `<div class="card back">${G.legends.length ? 'ตำนานใหม่<br>เปิดตอนจบเทิร์น' : 'ไม่มีตำนานเหลือ'}</div>`).join('')}</div>`;
  const lineup = G.lineup.map((c, i) => c
    ? cardHTML(c, { cost: costFor(me, c), buy: myTurn && canOwn(me, c) && costFor(me, c) <= pw, attrs: `data-act="buy" data-src="lineup" data-i="${i}"` })
    : `<div class="card back" style="opacity:.35">ว่าง</div>`).join('');
  const wildC = DEFS.wild;
  const wildHTML = G.wild > 0 ? cardHTML(wildC, { cost: costFor(me, wildC), buy: myTurn && costFor(me, wildC) <= pw, attrs: 'data-act="buy" data-src="wild"' }) : '<div class="card back">หมด</div>';

  const shown = G.turn && G.turn.shown ? G.turn.shown : [];
  // each played card sits in a .slot: one fixed-height row that overlaps cards when they no longer fit
  const arenaCards = [
    ...(G.chaosShown ? [cardHTML(G.chaosShown)] : []),
    ...shown.map(c => {
      const fresh = c.uid > (G.animUid || 0), html = cardHTML(c, { cls: fresh ? 'fresh' : '' });
      if (!myTurn || !(G.turn.ready || []).includes(c)) return html;
      const ok = canUse(me, c);
      return `<div class="act-wrap">${html}<button class="btn act-btn" data-act="activate" data-uid="${c.uid}" ${ok ? '' : 'disabled'}
        title="${ok ? 'ใช้ความสามารถ ✲ ของการ์ดนี้ (1 ครั้ง)' : c.needText || 'ยังใช้ไม่ได้'}">✲ ใช้</button></div>`;
    })].map(h => `<div class="slot">${h}</div>`).join('');
  shown.forEach(c => { if (c.uid > (G.animUid || 0)) G.animUid = c.uid; });
  const who = G.chaosShown ? 'การ์ดโกลาหลเปิดขึ้น!' : `${pcName(cur())} ${cur() === me ? '(คุณ)' : ''}`;
  // online: whose decision the table is waiting for (a choice, or a human player's turn)
  const waitNames = (G.waiting || []).filter(n => n !== me.name);
  const waitHTML = !G.online || G.over ? '' : waitNames.length ? `<span class="waitpill">⏳ รอ ${waitNames.join(', ')} ตัดสินใจ…</span>`
    : cur() !== me && !cur().isAI && G.endTurnResolve ? `<span class="waitpill">⏳ ${cur().name} กำลังเล่น…</span>` : '';
  // everything that happened to cards this turn (received, discarded, destroyed, revealed, defended, ✲) is behind a

  const nEv = (G.turn && G.turn.events || []).length;
  const arena = `<div class="arena ${shown.length || nEv ? 'busy' : ''}">
      <div class="arena-title">สนามร่ายเวท · ${who} <span>· พลังเทิร์นนี้ <b class="arena-pw">${pw}</b></span> ${waitHTML}</div>
      <div class="sect-label">การ์ดที่เล่น
        ${nEv ? `<button class="linkbtn ev-btn" data-act="view" data-what="events">เกิดอะไรขึ้นบ้าง (${nEv})</button>` : ''}</div>

    </div>`;

  const fam = me.familiar ? cardHTML(me.familiar, { cost: costFor(me, me.familiar), buy: myTurn && costFor(me, me.familiar) <= pw, attrs: 'data-act="buy" data-src="familiar"' }) : '<div class="empty">ซื้อสัตว์รับใช้แล้ว</div>';
  const ongoing = me.ongoing.length ? me.ongoing.map(c => !(myTurn && c.sacrifice) ? cardHTML(c, { small: true })

  $('#board').innerHTML = `
    <div class="seat-top">${seats.top.join('')}</div>

    <div class="seat-right">${seats.right.join('')}</div>
    <section class="boardc">
      <div class="legend-hall">
        <div class="hall-title">ตำนาน <span>เลือกซื้อได้ 3 ใบ · กองคว่ำเหลือ ${G.legends.length} ใบ</span></div>
        ${legendHTML}
      </div>
      <div class="mrow market-row">
        <div class="mgroup" style="min-width:0;flex:1"><span class="cap">Line-Up</span><div class="cards">${lineup}</div></div>
        <div class="mgroup"><span class="cap">Wild Surge (${G.wild})</span>${wildHTML}</div>
        <div class="piles">
          <span>กองหลัก <b>${G.main.length}</b></span>
          <span>Limp Wand <b>${G.bent}</b></span>
          <span>Dead Wizard Token เหลือ <b>${G.tokens.length}</b></span>
          <button class="linkbtn" data-act="view" data-what="destroyed">ถูกทำลาย (${G.destroyed.length})</button>
        </div>
      </div>
      ${arena}
    </section>
    <section class="you ${cur() === me ? 'active' : ''} ${me.hitFlash ? 'hit' : ''}" style="--pc:${me.color}">
      <div class="youbar" data-pi="${ME}">
        <div class="big hp"><span class="v">${me.hp}</span><span class="k">HP</span></div>
        <div class="big pw"><span class="v">${cur() === me ? pw : '–'}</span><span class="k">พลัง</span></div>
        <div style="min-width:0;flex:1">
          <div style="font-family:var(--f-display);font-size:24px">${pcName(me)} <span class="seatdir">ที่นั่งของคุณ</span></div>
          <div class="trait">${me.trait.name}: ${me.trait.text}</div>
