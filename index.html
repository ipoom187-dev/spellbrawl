function render() {
  if (!G) return;
  document.documentElement.style.setProperty('--ph', -Math.round(performance.now() % 1600) + 'ms');
  const me = G.players[0];
  const myTurn = cur() === me && !G.over && !G.ending && G.endTurnResolve;
  const pw = G.turn ? G.turn.power : 0;
  // seating: clockwise from you → your left, across, your right
  const others = G.players.slice(1);
  const seats = { left: [], top: [], right: [] };
  const n = others.length;
  const plan = n === 1 ? ['top'] : n === 2 ? ['left', 'right'] : n === 3 ? ['left', 'top', 'right'] : ['left', 'top', 'top', 'right'];
  const dirName = { left: 'ฝั่งซ้ายของคุณ', top: 'ฝั่งตรงข้าม', right: 'ฝั่งขวาของคุณ' };
  others.forEach((p, k) => seats[plan[k]].push(seatHTML(p, dirName[plan[k]])));

  const L = G.legends[0];
  const legendHTML = L ? (G.legendUp
    ? cardHTML(L, { buy: myTurn && L.cost <= pw, attrs: 'data-act="buy" data-src="legend"' })
    : `<div class="card back">ตำนานถัดไป<br>(คว่ำ)</div>`) : `<div class="card back">ไม่มีตำนานเหลือ</div>`;
  const lineup = G.lineup.map((c, i) => c
    ? cardHTML(c, { cost: costFor(me, c), buy: myTurn && canOwn(me, c) && costFor(me, c) <= pw, attrs: `data-act="buy" data-src="lineup" data-i="${i}"` })
    : `<div class="card back" style="opacity:.35">ว่าง</div>`).join('');
  const wildC = DEFS.wild;
  const wildHTML = G.wild > 0 ? cardHTML(wildC, { cost: costFor(me, wildC), buy: myTurn && costFor(me, wildC) <= pw, attrs: 'data-act="buy" data-src="wild"' }) : '<div class="card back">หมด</div>';

  const shown = G.turn && G.turn.shown ? G.turn.shown : [];
  const arenaCards = [
    ...(G.chaosShown ? [cardHTML(G.chaosShown)] : []),
    ...shown.map(c => {
      const fresh = c.uid > (G.animUid || 0), html = cardHTML(c, { cls: fresh ? 'fresh' : '' });
      if (!myTurn || !(G.turn.ready || []).includes(c)) return html;
      const ok = canUse(me, c);
      return `<div class="act-wrap">${html}<button class="btn act-btn" data-act="activate" data-uid="${c.uid}" ${ok ? '' : 'disabled'}
        title="${ok ? 'ใช้ความสามารถ ✲ ของการ์ดนี้ (1 ครั้ง)' : c.needText || 'ยังใช้ไม่ได้'}">✲ ใช้</button></div>`;
    })].join('');
  shown.forEach(c => { if (c.uid > (G.animUid || 0)) G.animUid = c.uid; });
  const who = G.chaosShown ? 'การ์ดโกลาหลเปิดขึ้น!' : `${cur().name} ${cur() === me ? '(คุณ)' : ''}`;
  const arena = `<div class="arena">
      <div class="arena-title">สนามร่ายเวท · ${who} <span>· พลังเทิร์นนี้ ${pw}</span></div>
      <div class="cards">${arenaCards || '<div class="empty">ยังไม่มีการ์ดถูกเล่นในเทิร์นนี้</div>'}</div>
    </div>`;

  const hand = me.hand.length ? me.hand.map((c, i) => cardHTML(c, { play: myTurn, dim: (G.turn.defUsed || []).includes(c), attrs: `data-act="play" data-i="${i}"` })).join('') : '<div class="empty">มือว่าง</div>';
  const fam = me.familiar ? cardHTML(me.familiar, { cost: costFor(me, me.familiar), buy: myTurn && costFor(me, me.familiar) <= pw, attrs: 'data-act="buy" data-src="familiar"' }) : '<div class="empty">ซื้อสัตว์รับใช้แล้ว</div>';
  const ongoing = me.ongoing.length ? me.ongoing.map(c => !(myTurn && c.sacrifice) ? cardHTML(c, { small: true })
    : `<div class="act-wrap">${cardHTML(c, { small: true })}<button class="btn act-btn" data-act="sacrifice" data-uid="${c.uid}" title="${c.sacText || ''}">ทำลายเพื่อใช้</button></div>`).join('') : '';

  $('#board').innerHTML = `
    <div class="seat-top">${seats.top.join('')}</div>
    <div class="seat-left">${seats.left.join('')}</div>
    <div class="seat-right">${seats.right.join('')}</div>
    <section class="boardc">
      <div class="mrow">
        <div class="mgroup"><span class="cap">ตำนาน (เหลือ ${G.legends.length})</span>${legendHTML}</div>
        <div class="mgroup" style="min-width:0;flex:1"><span class="cap">Line-Up</span><div class="cards">${lineup}</div></div>
        <div class="mgroup"><span class="cap">Wild Surge (${G.wild})</span>${wildHTML}</div>
        <div class="piles">
          <span>กองหลัก <b>${G.main.length}</b></span>
          <span>Limp Wand <b>${G.bent}</b></span>
          <span>เหรียญตายเหลือ <b>${G.tokens.length}</b></span>
          <button class="linkbtn" data-act="view" data-what="destroyed">ถูกทำลาย (${G.destroyed.length})</button>
        </div>
      </div>
      ${arena}
    </section>
    <section class="you ${cur() === me ? 'active' : ''} ${me.hitFlash ? 'hit' : ''}">
      <div class="youbar" data-pi="0">
        <div class="big hp"><span class="v">${me.hp}</span><span class="k">HP</span></div>
        <div class="big pw"><span class="v">${cur() === me ? pw : '–'}</span><span class="k">พลัง</span></div>
        <div style="min-width:0;flex:1">
          <div style="font-family:var(--f-display);font-size:24px">${me.name} <span class="seatdir">ที่นั่งของคุณ</span></div>
          <div class="trait">${me.trait.name}: ${me.trait.text}</div>
          <div class="chips" style="margin-top:4px">${chipsFor(me, true)}</div>
          <div class="pilebtns">
            <button class="linkbtn" data-act="view" data-what="deck" data-p="0">ดูเด็ค (${me.deck.length})</button>
            <button class="linkbtn" data-act="view" data-what="discard" data-p="0">ดูกองทิ้ง (${me.discard.length})</button>
            <button class="linkbtn" data-act="view" data-what="all" data-p="0">การ์ดทั้งหมด (${allCards(me).length})</button>
            <button class="linkbtn" data-act="view" data-what="tokens" data-p="0">เหรียญพ่อมดตาย (${me.tokens.length})</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn ghost" data-act="playall" ${myTurn && me.hand.length ? '' : 'disabled'}>เล่นทั้งมือ</button>
          <button class="btn" data-act="end" ${myTurn ? '' : 'disabled'}>จบเทิร์น</button>
        </div>
      </div>
      <div class="zones">
        <div class="zone"><div class="sect-label">สัตว์รับใช้</div>${fam}</div>
        <div class="zone"><div class="sect-label">มือของคุณ ${myTurn ? '· คลิกเพื่อเล่น' : ''}</div><div class="cards">${hand}</div>
          ${ongoing ? `<div class="sect-label" style="margin-top:10px">การ์ดต่อเนื่องของคุณ</div><div class="cards">${ongoing}</div>` : ''}</div>
        <div class="logbox"><div class="sect-label">บันทึกการต่อสู้</div><div class="loglist" id="log"></div></div>
      </div>
    </section>`;
  G.players.forEach(p => p.hitFlash = false);
  renderLog();
  if (!$('#viewer').hidden && viewerState && viewerState.what !== 'art') openViewer(viewerState.what, viewerState.p);
}

/* ---------------- card viewer ---------------- */
let viewerState = null;
const TYPE_ORDER = ['legend','familiar','wizard','spell','creature','treasure','location','wild','starter','bent','chaos'];
function groupCards(list) {
  const m = new Map();
  for (const c of list) { const g = m.get(c.id); if (g) g.n++; else m.set(c.id, { c, n: 1 }); }
  return [...m.values()];
}
function cardsBlock(list, { group = false, sort = false } = {}) {
  if (!list.length) return '<div class="empty">ไม่มีการ์ด</div>';
  let items = group ? groupCards(list) : list.map(c => ({ c, n: 1 }));
  if (sort) items.sort((a, b) => TYPE_ORDER.indexOf(a.c.type) - TYPE_ORDER.indexOf(b.c.type) || b.c.cost - a.c.cost || a.c.name.localeCompare(b.c.name));
  return `<div class="cards">${items.map(({ c, n }) => `<div style="position:relative">${cardHTML(c)}${n > 1 ? `<span class="count-badge">×${n}</span>` : ''}</div>`).join('')}</div>`;
}
function openViewer(what, pi) {
  viewerState = { what, p: pi };
  const p = pi != null ? G.players[pi] : null;
  let title = '', sub = '', body = '';
  if (what === 'deck') {
    title = `เด็คของคุณ · ${p.deck.length} ใบ`;
    sub = 'แสดงว่าในเด็คเหลือการ์ดอะไรบ้าง เรียงตามประเภท ไม่ใช่ลำดับที่จะจั่วจริง';
    body = cardsBlock(p.deck, { group: true, sort: true });
  } else if (what === 'discard') {
    title = `กองทิ้งของ ${p === G.players[0] ? 'คุณ' : p.name} · ${p.discard.length} ใบ`;
    sub = 'ใบซ้ายสุดคือใบบนสุดของกอง (ทิ้งล่าสุด)';
    body = cardsBlock(p.discard.slice().reverse());
  } else if (what === 'all') {
    const cards = allCards(p);
    const vp = cards.reduce((s, c) => s + vpOf(c, p), 0) - p.tokens.length * 3;
    title = `การ์ดทั้งหมดของคุณ · ${cards.length} ใบ`;
    sub = `VP ตอนนี้ (รวม Limp Wand และเหรียญตาย): <b>${vp}</b>`;
    body = cardsBlock(cards, { group: true, sort: true });
  } else if (what === 'tokens') {
    title = 'เหรียญพ่อมดตายของคุณ';
    sub = 'แต่ละเหรียญ -3 VP ตอนจบเกม';
    body = p.tokens.length ? `<div class="chips">${p.tokens.map(t => `<span class="chip skull">☠ ${t.name}: ${t.text}</span>`).join('')}</div>` : '<div class="empty">ยังไม่เคยตาย</div>';
  } else if (what === 'last') {
    const isNow = cur() === p && G.turn && G.turn.shown;
    const list = isNow ? G.turn.shown : (p.lastPlayed || []);
    title = `${p.name} · ${isNow ? 'เทิร์นนี้' : 'เทิร์นล่าสุด'}`;
    sub = 'การ์ดที่เล่นตามลำดับ';
    body = cardsBlock(list);
  } else if (what === 'familiar') {
    title = `${p.name} · สัตว์รับใช้และการ์ดต่อเนื่อง`;
    body = `<div class="vgroup"><h4>สัตว์รับใช้</h4>${p.familiar ? cardsBlock([p.familiar]) : '<div class="empty">ซื้อเข้าเด็คไปแล้ว</div>'}</div>
      <div class="vgroup"><h4>การ์ดต่อเนื่อง</h4>${cardsBlock(p.ongoing)}</div>
      <div class="vgroup"><h4>เหรียญพ่อมดตาย</h4>${p.tokens.length ? `<div class="chips">${p.tokens.map(t => `<span class="chip skull">☠ ${t.name}: ${t.text}</span>`).join('')}</div>` : '<div class="empty">ยังไม่เคยตาย</div>'}</div>`;
  } else if (what === 'destroyed') {
    title = `การ์ดที่ถูกทำลาย · ${G.destroyed.length} ใบ`;
    body = cardsBlock(G.destroyed.slice().reverse(), { group: true });
  }
  $('#v-title').textContent = title; $('#v-sub').innerHTML = sub; $('#v-body').innerHTML = body;
  $('#viewer').hidden = false;
}

function renderLog() {
  const el = $('#log'); if (!el) return;
  el.innerHTML = G.log.map(l => `<div class="${l.cls}">${l.msg}</div>`).join('');
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'rules') { if ($('#modal').hidden) showRules(false); return; }
  if (act === 'speed') {
    const steps = [[650, 'AI: ปกติ'], [1400, 'AI: ช้า'], [150, 'AI: เร็ว']];
    const k = (steps.findIndex(s => s[0] === AI_DELAY) + 1) % steps.length;
    AI_DELAY = steps[k][0]; el.textContent = steps[k][1]; return;
  }
  if (act === 'sfx' || act === 'music') { el.textContent = audioLabel(act, AUD.toggle(act)); if (act === 'sfx') AUD.play('buy'); return; }
  if (act === 'artedit') { openArtEditor(); return; }
  if (act === 'art-pick') { artTarget = el.dataset.id; $('#art-file').value = ''; $('#art-file').click(); return; }
  if (act === 'art-clear') { delete ART[el.dataset.id]; saveArt(); openArtEditor(); return; }
  if (act === 'view') { if (G) openViewer(el.dataset.what, el.dataset.p != null ? +el.dataset.p : null); return; }
  if (act === 'vclose') { $('#viewer').hidden = true; viewerState = null; return; }
  if (act === 'newgame') { location.reload(); return; }
  if (!G || G.busy || G.over) return;
  const me = G.players[0];
  if (cur() !== me || !G.endTurnResolve) return;
  G.busy = true;
  try {
    if (act === 'play') { const c = me.hand[+el.dataset.i]; if (c) await playCard(me, c); }
    else if (act === 'activate') { await activateCard(me, +el.dataset.uid); }
    else if (act === 'sacrifice') { await sacrificeCard(me, +el.dataset.uid); }
    else if (act === 'playall') { while (me.hand.length && G.players[0] === me) await playCard(me, me.hand[0]); }
    else if (act === 'buy') { await buy(me, el.dataset.src, +el.dataset.i); }
    else if (act === 'end') { const r = G.endTurnResolve; G.endTurnResolve = null; G.busy = false; r(); return; }
  } finally { if (G) { G.busy = false; render(); } }
});
// browsers only allow audio after a user gesture
document.addEventListener('pointerdown', () => AUD.unlock());
const audioLabel = (k, on) => `${k === 'sfx' ? 'เสียง' : 'เพลง'}: ${on ? 'เปิด' : 'ปิด'}`;
$('#btn-sfx').textContent = audioLabel('sfx', AUD.st.sfx);
$('#btn-music').textContent = audioLabel('music', AUD.st.music);
document.addEventListener('keydown', e => {
  AUD.unlock();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); }
});

/* ---------------- card art ----------------
   1) In-game: "ภาพการ์ด" button → pick an image per card (resized, saved in this browser).
   2) Folder: put art/<card-id>.png or .jpg next to this HTML file (works when opened from disk). */
const ART_KEY = 'spellbrawl-art';
const ART_FOLDER = location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname);
let ART = {}, artTarget = null;
try { ART = JSON.parse(localStorage.getItem(ART_KEY) || '{}'); } catch (e) { ART = {}; }

let BOARD_FILE = null; // art/board.(jpg|png) found next to the game file
if (ART_FOLDER) for (const ext of ['jpg', 'png', 'webp']) {
  const im = new Image();
  im.onload = () => { if (!BOARD_FILE) { BOARD_FILE = `art/board.${ext}`; buildArtCSS(); } };
  im.src = `art/board.${ext}`;
}
function boardCSS() {
  const src = ART.__board ? ART.__board : BOARD_FILE;
  if (!src) return '';
  const dim = (ART.__dim != null ? ART.__dim : 45) / 100;
  return `.boardc,.board-preview{background-image:linear-gradient(rgba(10,6,14,${dim}),rgba(10,6,14,${dim})),url("${src}");background-size:cover;background-position:center}`;
}
function buildArtCSS() {
  const rules = [boardCSS(), ...Object.keys(DEFS).map(id => {
    const layers = [];
    if (ART[id]) layers.push(`url("${ART[id]}")`);
    if (ART_FOLDER) layers.push(`url("art/${id}.png")`, `url("art/${id}.jpg")`);
    if (!layers.length) return '';
    layers.push('linear-gradient(135deg,var(--band),#00000055)');
    return `.card .c-art.art-${id}{background-image:${layers.join(',')}}`;
  })];
  $('#art-css').textContent = rules.join('\n');
}
function saveArt() {
  let ok = true;
  try { localStorage.setItem(ART_KEY, JSON.stringify(ART)); } catch (e) { ok = false; }
  buildArtCSS();
  return ok;
}
function openArtEditor() {
  viewerState = { what: 'art' };
  $('#v-title').textContent = 'ภาพกระดานและการ์ด';
  $('#v-sub').innerHTML = `ภาพที่เลือกจะถูกย่อขนาดแล้วบันทึกไว้ในเบราว์เซอร์นี้
    ${ART_FOLDER ? '<br>หรือวางไฟล์ไว้ในโฟลเดอร์ <b>art/</b> ข้างไฟล์เกม: พื้นหลังกระดานใช้ชื่อ <b>art/board.jpg</b> การ์ดใช้รหัสการ์ด เช่น <b>art/fireball.png</b>' : ''}`;
  const dim = ART.__dim != null ? ART.__dim : 45;
  const hasBoard = ART.__board || BOARD_FILE;
  $('#v-body').innerHTML = `<div class="vgroup"><h4>พื้นหลังกระดาน</h4>
    <div class="board-preview">${hasBoard ? '' : 'ยังไม่มีภาพ · ใช้ผ้าสักหลาดเริ่มต้น'}</div>
    <div class="pilebtns" style="align-items:center">
      <button class="linkbtn" data-act="art-pick" data-id="__board">เลือกภาพพื้นหลัง</button>
      ${ART.__board ? '<button class="linkbtn" data-act="art-clear" data-id="__board">ลบภาพ</button>' : ''}
      <label for="board-dim" style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)">ความมืดทับภาพ (ให้อ่านการ์ดง่าย)
        <input type="range" id="board-dim" min="0" max="85" step="5" value="${dim}"> <b id="board-dim-v" style="color:var(--ink)">${dim}%</b></label>
    </div></div>
    <div class="vgroup"><h4>ภาพการ์ด · ใส่แล้ว ${Object.keys(ART).filter(k => !k.startsWith('__')).length} ใบ</h4></div>
    <div class="art-grid">${Object.values(DEFS).map(d => `
    <div class="art-item">${cardHTML(d, { small: true })}
      <code style="font-size:11px;color:var(--mute)">${d.id}</code>
      <div class="row"><button class="linkbtn" data-act="art-pick" data-id="${d.id}">เลือกภาพ</button>
      ${ART[d.id] ? `<button class="linkbtn" data-act="art-clear" data-id="${d.id}">ลบ</button>` : ''}</div>
    </div>`).join('')}</div>`;
  $('#viewer').hidden = false;
}
$('#art-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f || !artTarget) return;
  const id = artTarget;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      if (id === '__board') {
        // keep the whole picture, max 1600×1000
        const s = Math.min(1, 1600 / img.width, 1000 / img.height);
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      } else {
        const W = 400, H = 220;
        cv.width = W; cv.height = H;
        const s = Math.max(W / img.width, H / img.height);
        const w = img.width * s, h = img.height * s;
        cv.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      }
      ART[id] = cv.toDataURL('image/jpeg', id === '__board' ? 0.85 : 0.82);
      if (!saveArt()) $('#v-sub').innerHTML += '<br><b style="color:var(--hp)">พื้นที่เก็บในเบราว์เซอร์เต็ม ภาพนี้จะหายเมื่อปิดหน้า ลองลบภาพอื่นออกก่อน</b>';
      if (viewerState && viewerState.what === 'art') openArtEditor();
      render();
    };
    img.onerror = () => { $('#v-sub').innerHTML += '<br><b style="color:var(--hp)">เปิดไฟล์นี้ไม่ได้ ลองใช้ไฟล์ PNG หรือ JPG</b>'; };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'board-dim') return;
  ART.__dim = +e.target.value; $('#board-dim-v').textContent = e.target.value + '%';
  saveArt();
});
buildArtCSS();

/* ---------------- dev testing (run from the browser console; see CLAUDE.md) ----------------
   Both helpers switch animations, sound and AI pauses off while they run, then restore them. */
async function withoutFX(fn) {
  const saved = { fx: { ...FX }, play: AUD.play, delay: AI_DELAY };
  for (const k of Object.keys(FX)) if (typeof FX[k] === 'function') FX[k] = () => Promise.resolve();
  AUD.play = () => {}; AI_DELAY = 0;
  try { return await fn(); }
  finally { Object.assign(FX, saved.fx); AUD.play = saved.play; AI_DELAY = saved.delay; }
}

// await simulate(3) → plays 3 all-AI games (2, 3, 4 players…) and reports how each ended plus any errors
async function simulate(games = 3, { maxPlayers = 4, timeoutMs = 30000 } = {}) {
  const errors = [], onRej = e => errors.push(String(e.reason && e.reason.stack || e.reason));
  addEventListener('unhandledrejection', onRej);
  const results = [];
  try {
    await withoutFX(async () => {
      for (let g = 0; g < games; g++) {
        $('#modal').hidden = true;
        newGame('Test', 1 + (g % (maxPlayers - 1)));
        G.players[0].isAI = true;
        G.players.forEach(p => { p.familiar = p.famChoices[0]; });
        const myG = G, t0 = performance.now();
        let timedOut = false, timer;
        await Promise.race([runGame().catch(e => errors.push(e.stack)),
          new Promise(r => { timer = setTimeout(() => { timedOut = true; G = null; r(); }, timeoutMs); })]);
        clearTimeout(timer);
        results.push({ players: myG.players.length, ended: myG.ending || (timedOut ? 'TIMEOUT' : 'unknown'),
          ms: Math.round(performance.now() - t0),
          bought: Object.fromEntries(Object.keys(DEFS).map(id => [id, myG.players.reduce((s, p) => s + [...p.deck, ...p.hand, ...p.discard, ...p.ongoing].filter(c => c.id === id).length, 0)]).filter(([, n]) => n)) });
      }
    });
  } finally { removeEventListener('unhandledrejection', onRej); $('#modal').hidden = true; }
  return { ok: !errors.length && results.every(r => r.ended !== 'TIMEOUT'), results, errors };
}

// await testCard('labrador', { hp: 10 }) → plays one card for player 1 in a fresh game, returns before/after
// wizard abilities (Iron Hide, Ember Lord…) are switched off unless keepTraits: true, so numbers read plainly
async function testCard(id, { hp = 15, oppHp = 15, players = 3, keepTraits = false, setup } = {}) {
  return withoutFX(async () => {
    $('#modal').hidden = true;
    newGame('Test', players - 1);
    G.players.forEach(p => { p.isAI = true; p.familiar = p.famChoices[0]; p.hp = oppHp;
      if (!keepTraits) p.trait = { id: 'none', name: '—', text: '' }; });
    const p = G.players[0]; p.hp = hp; G.cur = 0;
    G.turn = { power: 0, played: [], shown: [], types: {}, attacked: false };
    if (setup) await setup(p, G);
    const snap = () => ({ power: G.turn.power, me: { hp: p.hp, hand: p.hand.length, deck: p.deck.length, discard: p.discard.length, ongoing: p.ongoing.length, tokens: p.tokens.length },
      opps: opps(p).map(o => ({ hp: o.hp, hand: o.hand.length, discard: o.discard.length, bent: allCards(o).filter(c => c.id === 'bent').length, tokens: o.tokens.length })) });
    const card = make(id); p.hand.push(card);
    const before = snap(); before.me.hand -= 1; // the test card itself doesn't count
    await playCard(p, card);
    return { card: card.name, before, after: snap() };
  });
}

showSetup();
