<!doctype html>
<meta charset="utf-8">
<title>Spellbrawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen battle table — rivals across the top, the market in the middle, your hand at the bottom, battle log on the right */
:root{
  --bg:#141019; --panel:#1f1826; --panel2:#2a2032; --line:#3b2f46;
  --ink:#efe6d6; --mute:#a99bb0; --accent:#ff7a3d; --gold:#f0c35a;
  --hp:#e5485f; --def:#59c2c7; --paper:#efe3c8; --paper-ink:#2a1f1a;
  --felt1:#33203f; --felt2:#160d1c; --wood:#4a2d1c;
  --t-starter:#8a8079; --t-spell:#d4502f; --t-creature:#4f9a4a; --t-treasure:#c99a2e;
  --t-wizard:#6a5bd1; --t-location:#2f8f93; --t-legend:#a3243b; --t-wild:#c23f9a;
  --t-bent:#6b5a45; --t-familiar:#d0679b; --t-chaos:#26202b;
  --f-display:"Pirata One", "Georgia", serif;
  --f-body:"Chakra Petch", "Tahoma", "Leelawadee UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(ellipse at 50% -20%, #3a1d2e 0%, transparent 60%);}
button{font-family:inherit}
.app{display:flex;flex-direction:column;gap:12px;padding:12px 16px;min-height:100%}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;color:var(--accent);letter-spacing:.5px;line-height:1}
header.top .sub{color:var(--mute);font-size:12px}
header.top .sp{flex:1}
.btn{background:var(--accent);color:#1a0f0a;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.sect-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
/* tabletop: rivals seated top / left / right, board in the middle, your mat at the bottom */
.table{display:grid;gap:14px;min-width:0;
  grid-template-columns:minmax(210px,250px) minmax(0,1fr) minmax(210px,250px);
  grid-template-areas:"top top top" "left board right" "you you you"}
.seat-top{grid-area:top;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.seat-top .rival{width:min(100%,380px)}
.seat-left{grid-area:left;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.seat-right{grid-area:right;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
@media (max-width:1150px){
  .table{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "left" "right" "board" "you"}
  .seat-left,.seat-right{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .seat-left .rival,.seat-right .rival{width:min(100%,380px)}
}
.rival{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rival.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 0 24px #ff7a3d33}
.seatdir{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rival .ong{display:flex;gap:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.linkbtn:hover{border-color:var(--gold);color:var(--gold)}
.boardc{grid-area:board;min-width:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2));
  border:10px solid var(--wood);box-shadow:0 0 0 2px var(--gold) inset,0 10px 40px #000a}
.arena{border-top:1px dashed #f0c35a55;padding-top:12px;min-height:220px}
.arena .card.fresh{animation:deal .55s cubic-bezier(.2,1.2,.4,1)}
@keyframes deal{0%{transform:translateY(-50px) rotate(-8deg) scale(1.3);opacity:0;filter:brightness(2.4)}
  55%{transform:translateY(4px) rotate(1deg) scale(1.03);opacity:1;filter:brightness(1.4);box-shadow:0 0 0 3px var(--gold),0 0 44px var(--band)}
  100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.arena .card.fresh{animation:none}}
.arena-title{font-family:var(--f-display);font-size:22px;color:var(--gold);margin-bottom:8px}
.arena-title span{font-family:var(--f-body);font-size:13px;color:var(--ink)}
.rival .rname{display:flex;align-items:baseline;gap:8px}
.rival .rname b{font-family:var(--f-display);font-size:22px;font-weight:400}
.trait{font-size:11px;color:var(--gold)}
.hpbar{height:10px;background:#000a;border-radius:5px;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.chip.trophy{background:var(--gold);color:#2a1d05;border-color:var(--gold);font-weight:700}
.chip.skull{background:#3a1520;border-color:#6b2333}
.hit{animation:hit .6s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-4px);background:#5a1a26}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
/* market */
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.mgroup{display:flex;flex-direction:column;gap:4px}
.mgroup .cap{font-size:11px;color:var(--mute)}
.piles{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;justify-content:center}
.piles b{color:var(--ink)}
/* cards */
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{width:132px;min-height:184px;background:var(--paper);color:var(--paper-ink);border-radius:8px;display:flex;flex-direction:column;
  border:3px solid var(--band,#888);position:relative;cursor:default;user-select:none;transition:transform .12s}
.card .c-head{display:flex;align-items:center;gap:6px;background:var(--band);color:#fff;padding:4px 6px}
.card .c-cost{min-width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2a1d05;display:grid;place-items:center;font-weight:700;font-size:13px}
.card .c-cost:empty{display:none}
.card .c-name{font-family:var(--f-display);font-size:17px;line-height:1.05}
.card .c-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;color:#6d5c52;border-bottom:1px dashed #c9b894}
.card .c-text{font-size:11.5px;line-height:1.35;padding:5px 6px;flex:1}
.card .c-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;gap:4px}
.tag{font-size:9.5px;font-weight:700;padding:1px 4px;border-radius:3px;color:#fff;margin-right:2px}
.tag.act{background:var(--gold);color:#2a1d05}
.act-wrap{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.act-btn{padding:6px 8px;font-size:13px;box-shadow:0 0 14px #f0c35a66}
.tag.atk{background:var(--hp)} .tag.def{background:var(--def);color:#06282a} .tag.ong{background:#2f8f93}
.tag.uniq{background:var(--gold);color:#2a1d05}
.c-vp{font-weight:700;font-size:12px;color:#7a4e00;white-space:nowrap}
.card.small{width:112px;min-height:150px}
.card.small .c-name{font-size:15px}
.card.small .c-text{font-size:10.5px}
.card.mini{width:96px;min-height:0}
.card.mini .c-text,.card.mini .c-foot,.card.mini .c-type,.card.mini .c-art{display:none}
.card .c-art{height:72px;background:linear-gradient(135deg,var(--band),#00000055);background-size:cover;background-position:center;border-bottom:2px solid var(--band)}
.card.small .c-art{height:56px}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%}
.art-item{display:flex;flex-direction:column;gap:6px;align-items:center}
.art-item .row{display:flex;gap:4px}
.board-preview{width:100%;max-width:520px;aspect-ratio:16/9;border-radius:12px;border:6px solid var(--wood);display:grid;place-items:center;color:var(--mute);font-size:12px;
  background:radial-gradient(ellipse at 50% 40%, var(--felt1), var(--felt2))}
.card.buyable{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 0 18px #f0c35a55}
.card.buyable:hover,.card.playable:hover{transform:translateY(-4px)}
.card.playable{cursor:pointer}
.card.dim{opacity:.55}
.card.back{background:repeating-linear-gradient(45deg,#3a1d2e,#3a1d2e 8px,#2a1522 8px,#2a1522 16px);color:var(--ink);border-color:var(--t-legend);align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-size:20px;padding:10px}
.t-starter{--band:var(--t-starter)} .t-spell{--band:var(--t-spell)} .t-creature{--band:var(--t-creature)}
.t-treasure{--band:var(--t-treasure)} .t-wizard{--band:var(--t-wizard)} .t-location{--band:var(--t-location)}
.t-legend{--band:var(--t-legend)} .t-wild{--band:var(--t-wild)} .t-bent{--band:var(--t-bent)}
.t-familiar{--band:var(--t-familiar)} .t-chaos{--band:var(--t-chaos)}
/* you */
.you{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.you.active{border-color:var(--accent)}
.youbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{display:flex;flex-direction:column;align-items:center;min-width:64px}
.big .v{font-family:var(--f-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.big.hp .v{color:var(--hp)} .big.pw .v{color:var(--gold)}
.youbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.you{grid-area:you}
.zones{display:grid;grid-template-columns:auto minmax(0,1fr) 280px;gap:12px}
@media (max-width:1100px){.zones{grid-template-columns:auto minmax(0,1fr)}.zones .logbox{grid-column:1/-1}}
@media (max-width:640px){.zones{grid-template-columns:minmax(0,1fr)}}
.pilebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.logbox{background:#00000033;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;max-height:330px;min-width:0}
.count-badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#1a0f0a;font-weight:700;border-radius:12px;padding:2px 8px;font-size:12px;box-shadow:0 2px 6px #0008}
.vgroup{display:flex;flex-direction:column;gap:6px;width:100%}
.vgroup h4{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--gold)}
.vgroup .cards{gap:14px}
.zone{min-width:0}
.empty{color:var(--mute);font-size:12px;font-style:italic;padding:8px 0}
/* log */
.loglist{overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.loglist div{padding:3px 6px;border-radius:4px;background:#ffffff06;line-height:1.35}
.loglist .dmg{color:#ff9aa8} .loglist .kill{color:#fff;background:#6b2333} .loglist .turn{color:var(--accent);font-weight:700;background:transparent;border-top:1px solid var(--line);padding-top:6px}
.loglist .good{color:#9fe0a0} .loglist .sys{color:var(--gold)}
/* overlay */
.overlay{position:fixed;inset:0;background:#0b0810dd;display:grid;place-items:center;z-index:50;padding:16px;overflow-y:auto}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow-y:auto}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--accent);text-wrap:balance}
.dialog .msub{color:var(--mute);font-size:13px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.opts .opt-card .card{cursor:pointer}
.opts .opt-card .card:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--gold)}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
label.fld input,label.fld select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.rules{font-size:13px;line-height:1.6;color:var(--ink)}
.rules h3{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:20px;margin:10px 0 2px}
.rules ul{margin:4px 0;padding-left:20px}
table.score{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.score th,table.score td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.score th:first-child,table.score td:first-child{text-align:left}
table.score tr.win td{color:var(--gold);font-weight:700}
.tablewrap{overflow-x:auto}
/* ambient pulses: --ph is reset by render() so the glow keeps its phase when the board is redrawn */
.card.buyable{animation:buyglow 1.6s ease-in-out infinite var(--ph,0ms)}
@keyframes buyglow{50%{box-shadow:0 0 0 2px var(--gold),0 0 30px #f0c35aaa}}
.rival.active,.you.active{animation:activeglow 1.6s ease-in-out infinite var(--ph,0ms)}
@keyframes activeglow{50%{box-shadow:0 0 0 1px var(--accent) inset,0 0 40px #ff7a3d66}}
/* FX layer: lives outside #board so render() never wipes an effect mid-flight */
.app{position:relative;z-index:1}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fx{position:absolute;pointer-events:none;will-change:transform,opacity}
.fx.spark{left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.fx.spark.coin{width:13px;height:13px;background:radial-gradient(circle at 35% 35%,#fff6c8,#f0c35a 45%,#a8761a);box-shadow:0 0 12px #f0c35a}
.fx.orb{left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c) 45%,transparent 72%);box-shadow:0 0 26px 10px var(--c)}
.fx.float{font-family:var(--f-display);font-size:46px;line-height:1;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 14px currentColor,0 3px 0 #000,0 0 3px #000}
.fx.float.dmg{color:#ff4d5e} .fx.float.crit{font-size:70px;color:#ff2d45}
.fx.float.heal{color:#7dffa0} .fx.float.curse{color:#c79bff;font-size:28px}
.fx.ring{width:130px;height:130px;border-radius:50%;border:4px solid var(--def);box-shadow:0 0 30px var(--def),inset 0 0 30px var(--def);transform:translate(-50%,-50%)}
.fx.seatflash{border-radius:10px;mix-blend-mode:screen}
.fx.screen{width:100%;height:100%}
.fx.vig-red{background:radial-gradient(ellipse at center,transparent 30%,#c8001ebb)}
.fx.vig-blood{background:radial-gradient(ellipse at center,#0000 20%,#3a0010ee)}
.fx.vig-violet{background:radial-gradient(ellipse at center,transparent 25%,#5a10a0cc)}
.fx.flash{background:#fff}
.fx.banner{width:100%;transform:translateY(-50%);text-align:center;padding:20px 16px;
  background:linear-gradient(90deg,transparent,#000d 18%,#000d 82%,transparent);border-block:2px solid var(--bc)}
.banner .b-title{font-family:var(--f-display);font-size:clamp(40px,8vw,92px);line-height:1;color:var(--bc);
  text-shadow:0 0 28px var(--bc),0 4px 0 #000;animation:btitle .7s cubic-bezier(.2,1.4,.4,1) both}
.banner .b-sub{font-size:clamp(14px,2.4vw,20px);color:var(--ink);margin-top:8px;letter-spacing:.05em}
@keyframes btitle{from{transform:scale(2.4);opacity:0;letter-spacing:.35em;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.banner.kill{--bc:#ff3b4f} .banner.legend{--bc:#ff5470} .banner.chaos{--bc:#c27dff}
.banner.gold,.banner.win{--bc:var(--gold)} .banner.turn{--bc:var(--accent)} .banner.lose{--bc:#a99bb0}
.banner.small{padding:10px 16px} .banner.small .b-title{font-size:clamp(26px,4vw,42px)}
/* Chaos reveal: the card held big in the centre of a lightning storm */
.fx.storm{background:radial-gradient(ellipse at 50% 25%,#2a1745e0,#07040ef5 70%)}
.fx.storm-cv{left:0;top:0}
.fx.chaos-show{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;cursor:pointer;padding:16px}
.chaos-show .cs-title{font-family:var(--f-display);font-size:clamp(40px,7vw,80px);line-height:1;color:#c27dff;text-shadow:0 0 30px #c27dff,0 4px 0 #000;animation:btitle .7s cubic-bezier(.2,1.4,.4,1) both}
.chaos-show .cs-card{zoom:var(--k,2);animation:csin .8s cubic-bezier(.2,1.3,.4,1) both,csglow 1.2s ease-in-out .8s infinite}
.chaos-show .cs-card .card{box-shadow:0 0 0 2px #c27dff,0 0 40px #9b4dff}
@keyframes csin{from{transform:translateY(-60vh) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes csglow{50%{filter:drop-shadow(0 0 16px #b06cff) brightness(1.08)}}
.chaos-show .cs-hint{font-size:12px;color:var(--mute);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.chaos-show .cs-card,.chaos-show .cs-title{animation:none}}
@media (prefers-reduced-motion:reduce){.card.buyable,.rival.active,.you.active,.banner .b-title{animation:none}}
</style>

<canvas id="embers" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="top">
    <h1>Spellbrawl</h1>
    <span class="sub">เกมสร้างเด็คพ่อมดตีกัน · กติกาแบบ Cerberus/Annihilageddon</span>
    <span class="sp"></span>
    <button class="btn ghost" id="btn-speed" data-act="speed">AI: ปกติ</button>
    <button class="btn ghost" id="btn-sfx" data-act="sfx">เสียง: เปิด</button>
    <button class="btn ghost" id="btn-music" data-act="music">เพลง: เปิด</button>
    <button class="btn ghost" data-act="artedit">ภาพกระดาน/การ์ด</button>
    <button class="btn ghost" data-act="rules">กติกา</button>
    <input type="file" id="art-file" accept="image/*" hidden>
    <style id="art-css"></style>
    <button class="btn ghost" data-act="newgame">เกมใหม่</button>
  </header>
  <main class="table" id="board"></main>
</div>

<div class="overlay" id="viewer" hidden style="z-index:45">
  <div class="dialog" style="max-width:1100px">
    <div style="display:flex;align-items:center;gap:12px"><h2 id="v-title" style="flex:1"></h2><button class="btn" data-act="vclose">ปิด</button></div>
    <div class="msub" id="v-sub"></div>
    <div class="opts" id="v-body"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="dialog">
    <h2 id="m-title"></h2>
    <div class="msub" id="m-sub"></div>
    <div class="opts" id="m-opts"></div>
  </div>
</div>

<div id="fx" aria-hidden="true"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let G = null, uidc = 1, AI_DELAY = 650;

const TYPE_TH = { starter:'การ์ดเริ่มต้น', spell:'คาถา · Spell', creature:'สัตว์อสูร · Creature', treasure:'สมบัติ · Treasure',
  wizard:'พ่อมด · Wizard', location:'สถานที่ · Location', legend:'ตำนาน · Legend', wild:'เวทป่าเถื่อน · Wild', bent:'ไม้กายสิทธิ์ปวกเปียก',
  familiar:'สัตว์รับใช้ · Familiar', chaos:'โกลาหล · Chaos' };

/* ---------------- card definitions ---------------- */
const DEFS = {};
function def(id, o) { DEFS[id] = { id, cost: 0, vp: 0, ...o }; }
function make(id) { return { ...DEFS[id], uid: uidc++ }; }

// each Vomit Comet played this turn fires once per card the current player buys or gains
async function cometStrike(p, c) {
  if (p !== cur() || !G.turn.comet || !c.cost) return;
  for (let i = 0; i < G.turn.comet; i++) {
    G.curLabel = 'Vomit Comet';
    log(`Vomit Comet อ้วกพุ่งตาม ${c.name} (${c.cost} ดาเมจ)`, 'sys');
    await attack(p, { to:'choose', dmg: c.cost });
  }
}

// Cthulhu stand: held by whoever most recently came to own a Cthulhu (bought, gained free or sent one)
// and still owns one; nobody holds it otherwise
function standHolder() {
  const owners = (G && G.cthulhuOwners) || [];
  for (let i = owners.length - 1; i >= 0; i--) if (allCards(owners[i]).some(c => c.id === 'cthulhu')) return owners[i];
  return null;
}
// call whenever a card moves into a player's possession from outside it
function gainedCard(p, c) {
  if (c.id !== 'cthulhu') return;
  (G.cthulhuOwners ||= []).push(p);
  log(`${p.name} ได้ครอบครอง Cthulhu · ได้ถ้วย Cthulhu stand`, 'sys');
}

def('sugarpuss', { name:'Sugarpuss', type:'wizard', cost:6, vp:2, draws:1,
  text:'จั่ว 2 ใบ แล้วทิ้ง 1 ใบจากมือ ฟื้น HP เท่ากับราคาใบที่ทิ้ง<br>ถ้าตอนนี้คุณมี 25 HP สับเหรียญพ่อมดตาย 1 อันของคุณกลับเข้ากอง',
  play: async p => {
    await draw(p, 2);
    if (p.hand.length) {
      let c;
      if (p.isAI) {
        const byVal = p.hand.slice().sort((a, b) => aiVal(a) - aiVal(b));
        // reaching 25 HP clears a -3 VP token, so worth throwing a better card for it
        c = (p.tokens.length && byVal.find(x => p.hp + (x.cost || 0) >= 25)) || byVal[0];
      } else {
        c = await humanChoose('Sugarpuss: ทิ้ง 1 ใบจากมือ', p.hand.map(x => ({ card: x, value: x })),
          `ฟื้น HP เท่ากับราคาใบที่ทิ้ง · ตอนนี้คุณมี ${p.hp} HP${p.tokens.length ? ' · ถ้าถึง 25 HP จะลบเหรียญพ่อมดตายได้ 1 อัน' : ''}`);
      }
      p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c);
      log(`${p.name} ทิ้ง ${c.name} (ราคา ${c.cost || 0})`);
      if (c.cost) heal(p, c.cost);
    }
    if (p.hp < 25 || !p.tokens.length) return;
    // the only way to lose a Dead Wizard token; effects that already happened stay
    const tok = p.tokens.length === 1 || p.isAI
      ? (p.tokens.find(k => k.start || k.id === 'cursed') || p.tokens[0])
      : await humanChoose('Sugarpuss: เลือกเหรียญพ่อมดตายที่จะสับกลับเข้ากอง',
          p.tokens.map(k => ({ label: `☠ ${k.name}: ${k.text}`, value: k })));
    p.tokens.splice(p.tokens.indexOf(tok), 1);
    G.tokens.push(tok); shuffle(G.tokens);
    log(`${p.name} มี 25 HP · สับเหรียญ “${tok.name}” กลับเข้ากอง (+3 VP)`, 'good');
    render();
  } });

/* ---------------- helpers ---------------- */
function log(msg, cls = '') { G.log.unshift({ msg, cls }); if (G.log.length > 200) G.log.pop(); renderLog(); }
const cur = () => G.players[G.cur];
const opps = p => G.players.filter(x => x !== p);
const leftOf = p => G.players[(G.players.indexOf(p) + 1) % G.players.length];
const rightOf = p => G.players[(G.players.indexOf(p) - 1 + G.players.length) % G.players.length];
const allCards = p => [...p.deck, ...p.hand, ...p.discard, ...p.ongoing, ...(p === cur() && G.turn ? G.turn.played : [])];
const wait = () => sleep(cur().isAI ? AI_DELAY : 0);

function drawTop(p) {
  if (!p.deck.length) { if (!p.discard.length) return null; p.deck = shuffle(p.discard); p.discard = []; }
  return p.deck.pop();
}
// look at the top card of a deck and leave it there
function revealTop(p) {
  const c = drawTop(p);
  if (c) { p.deck.push(c); log(`${p.name} เปิดการ์ดบนสุด: ${c.name} (ราคา ${c.cost || 0})`); }
  return c;
}
async function draw(p, n) {
  let k = 0;
  for (; k < n; k++) { const c = drawTop(p); if (!c) break; p.hand.push(c); }
  if (k && p === G.players[0]) AUD.play('draw');
  render();
}
function heal(p, n) {
  const b = p.hp; p.hp = Math.min(25, p.hp + n);
  if (p.hp > b) { log(`${p.name} ฟื้น ${p.hp - b} HP (${p.hp})`, 'good'); AUD.play('heal'); FX.heal(p, p.hp - b); }
}
function gainBent(t) {
  if (G.bent <= 0) return;
  G.bent--; t.discard.push(make('bent')); log(`${t.name} ได้รับ Limp Wand`, 'dmg');
  AUD.play('curse'); FX.curse(t);
}
// cards marked unique:1 — each player may own at most one copy
// VP of a card for its owner; cards with vpCalc (e.g. mib) are worth a variable amount at game end
const vpOf = (c, p) => c.vpCalc ? c.vpCalc(p) : c.vp;
// what a card would be worth to p if bought now (a vpCalc card counts itself once it's owned)
const vpIfBought = (c, p) => c.vpCalc ? c.vpCalc(p) + (c.type === 'creature' ? 1 : 0) : c.vp;
// a card p just bought or gained: on top of the deck if a Grab-O is pending this turn, else to the discard
function placeGained(p, c) {
  if (p === cur() && G.turn.topdeck > 0) { G.turn.topdeck--; p.deck.push(c); log(`${c.name} ถูกวางบนสุดของเด็ค ${p.name}`, 'good'); }
  else p.discard.push(c);
}
const canOwn = (p, c) => !c.unique || !allCards(p).some(x => x.id === c.id);
function costFor(p, c) {
  let k = c.cost;
  if (p.trait.id === 'beast' && c.type === 'creature') k = Math.max(1, k - 1);
  if (p.trait.id === 'hex' && c.id === 'wild') k = 2;
  return k;
}
const aiVal = c => (c.id === 'fizzle' || c.id === 'bent') ? -2 : c.id === 'rune' ? 0 : c.cost + (c.power || 0) + (c.vp || 0);

/* ---------------- audio: every sound is synthesized with Web Audio, no files ----------------
   AUD.play(name) for SFX · background music is a procedural war-drum loop (Dm–Bb–F–C) */
const AUD = (() => {
  const KEY = 'spellbrawl-audio', LEVEL = { sfx: 1, mus: .5 };
  const st = { sfx: true, music: true };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  let ctx = null, noiseBuf = null, timer = null, nextT = 0, step = 0;
  const bus = {}, wet = {};
  const N = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .3;
    comp.connect(ctx.destination);
    // synthesized hall reverb
    const verb = ctx.createConvolver(), len = Math.floor(ctx.sampleRate * 2.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir; verb.connect(comp);
    for (const [b, on] of [['sfx', st.sfx], ['mus', st.music]]) {
      bus[b] = ctx.createGain(); bus[b].gain.value = on ? LEVEL[b] : 0; bus[b].connect(comp);
      wet[b] = ctx.createGain(); wet[b].gain.value = on ? LEVEL[b] * .5 : 0; wet[b].connect(verb);
    }
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return true;
  }
  function voice(src, { t, a = .005, d = .3, v = .2, b = 'sfx', w = .25, filter, f0, f1, q = 1 }) {
    let node = src;
    if (filter) {
      const fl = ctx.createBiquadFilter(); fl.type = filter; fl.Q.value = q;
      fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + a + d);
      node.connect(fl); node = fl;
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d);
    node.connect(g); g.connect(bus[b]);
    if (w) { const s = ctx.createGain(); s.gain.value = w; g.connect(s); s.connect(wet[b]); }
    src.start(t); src.stop(t + a + d + .05);
    return src;
  }
  function tone(type, f, o) {
    const s = ctx.createOscillator(); s.type = type; s.frequency.setValueAtTime(f, o.t);
    if (o.to) s.frequency.exponentialRampToValueAtTime(o.to, o.t + (o.a || .005) + (o.d || .3));
    if (o.detune) s.detune.value = o.detune;
    return voice(s, o);
  }
  function noise(o) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return voice(s, o); }
  function lfo(param, rate, depth, t, dur) {
    const l = ctx.createOscillator(), g = ctx.createGain(); l.frequency.value = rate; g.gain.value = depth;
    l.connect(g); g.connect(param); l.start(t); l.stop(t + dur);
  }
  function drum(t, v, b = 'sfx') {
    tone('sine', 120, { t, to: 42, d: .55, v, b, w: .35 });
    noise({ t, d: .18, v: v * .5, filter: 'lowpass', f0: 900, f1: 90, b, w: .3 });
  }
  function cymbal(t, v, b = 'sfx') { noise({ t, a: .002, d: 1.8, v, filter: 'highpass', f0: 5500, b, w: .6 }); }
  function brass(ms, t, d, v, b = 'sfx') {
    const k = v / Math.sqrt(ms.length);
    ms.forEach(m => [-9, 9].forEach(dt => tone('sawtooth', N(m), { t, a: .07, d, v: k, detune: dt, filter: 'lowpass', f0: 500, f1: 2400, q: 1.5, b, w: .5 })));
  }
  function choir(ms, t, d, v, b = 'sfx') {
    const k = v / Math.sqrt(ms.length);
    ms.forEach(m => [-14, 0, 14].forEach(dt => {
      const o = tone('sawtooth', N(m), { t, a: Math.min(.5, d * .3), d, v: k, detune: dt, filter: 'lowpass', f0: 900, f1: 700, b, w: .8 });
      lfo(o.detune, 5, 6, t, d + .6);
    }));
  }
  function impact(t, n) {
    tone('sine', 150, { t, to: 38, d: .35 + n * .06, v: Math.min(.9, .45 + n * .08), w: .2 });
    noise({ t, d: .25 + n * .04, v: .5, filter: 'lowpass', f0: 2400, f1: 120, w: .35 });
    if (n >= 4) { tone('sine', 70, { t, to: 28, d: 1.2, v: .6, w: .5 }); noise({ t: t + .02, d: 1.4, v: .25, filter: 'lowpass', f0: 600, f1: 60, w: .7 }); }
  }
  const S = {
    card: t => noise({ t, d: .14, v: .22, filter: 'bandpass', f0: 1200, f1: 4200, q: 1.2, w: .1 }),
    draw: t => noise({ t, d: .05, v: .08, filter: 'highpass', f0: 3500, w: 0 }),
    power: t => { tone('sine', N(84), { t, d: .35, v: .06, w: .4 }); tone('sine', N(91), { t: t + .05, d: .4, v: .045, w: .4 }); },
    cast: t => {
      tone('sawtooth', 160, { t, to: 1100, a: .02, d: .28, v: .09, filter: 'lowpass', f0: 800, f1: 5000, w: .3 });
      noise({ t, a: .03, d: .3, v: .18, filter: 'bandpass', f0: 600, f1: 4000, q: 2, w: .3 });
    },
    impact: (t, n = 2) => impact(t, n),
    shield: t => {
      [1, 2.76, 5.4].forEach((m, i) => tone('sine', 620 * m, { t, d: .9 - i * .2, v: .09 / (i + 1), w: .6 }));
      noise({ t, d: .08, v: .15, filter: 'highpass', f0: 5000, w: .3 });
    },
    reflect: t => { S.shield(t); tone('sawtooth', 1200, { t: t + .05, to: 140, d: .35, v: .08, filter: 'lowpass', f0: 4000, f1: 600, w: .4 }); },
    heal: t => [72, 76, 79, 84, 88].forEach((m, i) => tone('sine', N(m), { t: t + i * .055, d: .6, v: .06, w: .7 })),
    curse: t => { const o = tone('square', 420, { t, to: 110, d: .7, v: .05, filter: 'lowpass', f0: 1800, f1: 400, w: .5 }); lfo(o.frequency, 9, 35, t, .8); },
    discard: t => noise({ t, d: .12, v: .25, filter: 'lowpass', f0: 700, f1: 200, w: .1 }),
    destroy: t => {
      noise({ t, a: .04, d: .6, v: .3, filter: 'bandpass', f0: 3000, f1: 300, q: .8, w: .4 });
      tone('sawtooth', 300, { t, to: 60, d: .5, v: .06, filter: 'lowpass', f0: 1200, w: .3 });
    },
    buy: t => {
      tone('square', N(91), { t, d: .09, v: .05, w: .3 }); tone('square', N(96), { t: t + .07, d: .25, v: .05, w: .4 });
      tone('sine', N(103), { t: t + .07, d: .4, v: .04, w: .5 });
    },
    turnMe: t => { brass([57], t, .25, .07); brass([62, 69], t + .2, 1, .07); drum(t + .2, .5); },
    turnAI: t => drum(t, .3),
    kill: t => {
      impact(t, 8);
      [1, 2.42, 3.13, 4.7, 5.93].forEach((m, i) => tone('sine', 82 * m, { t: t + .02, a: .01, d: 3.2 - i * .4, v: .16 / (i + 1), w: .8 }));
      choir([50, 53, 57, 62], t + .15, 2.4, .05);
    },
    chaos: t => {
      noise({ t, a: .01, d: .15, v: .6, filter: 'highpass', f0: 2000, w: .5 });
      noise({ t: t + .05, a: .1, d: 2.6, v: .6, filter: 'lowpass', f0: 1800, f1: 70, w: .8 });
      [38, 44].forEach(m => tone('sawtooth', N(m), { t, a: .3, d: 1.8, v: .06, filter: 'lowpass', f0: 500, w: .5 }));
    },
    // near strikes crack hard and fast; far ones are mostly a late rolling rumble
    thunder: (t, near) => {
      const lag = near ? 0 : .15 + Math.random() * .35;
      noise({ t, a: .002, d: near ? .18 : .08, v: near ? .7 : .25, filter: 'highpass', f0: 1500, w: .5 });
      noise({ t: t + lag, a: .04, d: 1.6 + Math.random(), v: near ? .6 : .4, filter: 'lowpass', f0: near ? 1600 : 700, f1: 50, w: .8 });
      tone('sine', 60, { t: t + lag, to: 28, d: 1.4, v: near ? .5 : .25, w: .4 });
    },
    rain: (t, dur = 4) => {
      noise({ t, a: .4, d: dur, v: .14, filter: 'bandpass', f0: 2600, f1: 1800, q: .6, w: .3 });
      noise({ t, a: .6, d: dur, v: .1, filter: 'lowpass', f0: 380, f1: 200, w: .5 });
    },
    legendUp: t => {
      [0, .18, .3, .42].forEach((dt, i) => drum(t + dt, .5 + i * .12));
      choir([38, 45, 50, 53], t + .2, 3, .07); brass([50, 57], t + .5, 2.2, .08);
      noise({ t: t + .4, a: .8, d: 2, v: .2, filter: 'lowpass', f0: 300, f1: 2000, w: .9 });
    },
    legendWin: t => {
      drum(t, .8); [[62, 0], [69, .16], [74, .32]].forEach(([m, dt]) => brass([m], t + dt, .3, .09));
      brass([62, 66, 69, 74], t + .5, 1.8, .07); cymbal(t + .5, .25);
    },
    victory: t => {
      [[60, 0], [64, .14], [67, .28], [72, .42]].forEach(([m, dt]) => brass([m], t + dt, .25, .08));
      brass([60, 64, 67, 72, 76], t + .62, 2.6, .07); drum(t + .62, .9); cymbal(t + .62, .3);
    },
    defeat: t => { [[62, 0], [60, .35], [57, .7]].forEach(([m, dt]) => brass([m], t + dt, .45, .07)); choir([50, 53, 57], t + 1, 3, .06); drum(t + 1, .6); },
  };

  // music: low-string ostinato + choir pad, war drums join once a battle is on
  const PROG = [[50, 53, 57], [46, 50, 53], [45, 48, 53], [48, 52, 55]];
  const STEP = 60 / 88 / 2;
  function musicStep(t, s) {
    const ch = PROG[Math.floor(s / 8) % PROG.length], b = s % 8, battle = !!(G && !G.over);
    if (b === 0) choir(ch.map(m => m + 12), t, STEP * 8, .05, 'mus');
    tone('sawtooth', N(ch[0] - 12 + [0, 0, 12, 0, 7, 0, 12, 7][b]), { t, a: .01, d: STEP * .9, v: battle ? .07 : .04, filter: 'lowpass', f0: 1400, f1: 250, b: 'mus', w: .2 });
    if (battle) {
      const v = [.7, 0, 0, .35, .55, 0, .3, .4][b];
      if (v) drum(t, v, 'mus');
      if (s % 32 === 0) cymbal(t, .12, 'mus');
    }
  }
  function startMusic() {
    if (timer || !ctx) return;
    nextT = ctx.currentTime + .1;
    timer = setInterval(() => {
      if (ctx.state !== 'running') return;
      if (nextT < ctx.currentTime) nextT = ctx.currentTime + .05; // tab was throttled: don't burst-play the backlog
      while (nextT < ctx.currentTime + .3) { musicStep(nextT, step++); nextT += STEP; }
    }, 80);
  }
  function stopMusic() { clearInterval(timer); timer = null; }

  return {
    st,
    unlock() { if (!init()) return; if (ctx.state === 'suspended') ctx.resume(); if (st.music) startMusic(); },
    play(name, arg) {
      if (!ctx || !st.sfx || ctx.state !== 'running') return;
      try { S[name](ctx.currentTime + .02, arg); } catch (e) { console.warn('sfx', name, e); }
    },
    toggle(k) {
      const b = k === 'sfx' ? 'sfx' : 'mus';
      st[k] = !st[k];
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
      if (ctx) {
        bus[b].gain.setTargetAtTime(st[k] ? LEVEL[b] : 0, ctx.currentTime, .08);
        wet[b].gain.setTargetAtTime(st[k] ? LEVEL[b] * .5 : 0, ctx.currentTime, .08);
        if (b === 'mus') { if (st[k]) startMusic(); else stopMusic(); }
      }
      return st[k];
    },
  };
})();

/* ---------------- visual FX ---------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)');

// drifting embers behind the table; surge() makes them flare on big moments
const Embers = (() => {
  const cv = $('#embers'), cx = cv.getContext('2d');
  let boost = 0, last = 0;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  fit(); addEventListener('resize', fit);
  const mk = y => ({ x: Math.random() * cv.width, y: y != null ? y : cv.height + 10, r: .6 + Math.random() * 2, v: .2 + Math.random() * .6,
    sw: Math.random() * 6.28, h: 12 + Math.random() * 30, a: .3 + Math.random() * .5 });
  const ps = Array.from({ length: 46 }, () => mk(Math.random() * cv.height));
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    if (RM.matches) { if (last) { cx.clearRect(0, 0, cv.width, cv.height); last = 0; } return; }
    const dt = Math.min(3, (now - last) / 16.7 || 1); last = now;
    boost *= .97;
    cx.clearRect(0, 0, cv.width, cv.height); cx.globalCompositeOperation = 'lighter';
    for (const p of ps) {
      p.y -= p.v * (1 + boost * 4) * dt; p.sw += .02 * dt; p.x += Math.sin(p.sw) * .3 * dt;
      if (p.y < -10) Object.assign(p, mk());
      const fl = .6 + .4 * Math.sin(now / 180 + p.sw * 7), R = p.r * (1 + boost) * 4;
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, `hsla(${p.h},100%,65%,${p.a * fl})`); g.addColorStop(1, `hsla(${p.h},100%,50%,0)`);
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, R, 0, 6.283); cx.fill();
    }
  }
  requestAnimationFrame(frame);
  return { surge() { boost = 1.5; } };
})();

// one-shot effects drawn on #fx; awaited ones pace the game, slower/faster with the AI speed setting
const FX = (() => {
  const pace = () => { const p = G && cur(); return p && p.isAI ? Math.max(.25, Math.min(1.6, AI_DELAY / 650)) : 1; };
  const T = ms => Math.round(ms * pace());
  const px = v => typeof v === 'number' ? v + 'px' : v;
  function spawn(cls, x, y, text) {
    const el = document.createElement('div');
    el.className = 'fx ' + cls; el.style.left = px(x); el.style.top = px(y);
    if (text != null) el.textContent = text;
    $('#fx').appendChild(el);
    return el;
  }
  function fire(el, kf, o) {
    const done = () => el.remove();
    el.animate(kf, { fill: 'both', ...o }).onfinish = done;
    setTimeout(done, o.duration + (o.delay || 0) + 400); // backstop if the animation never finishes (hidden tab)
  }
  const clampPt = (x, y) => ({ x: Math.min(innerWidth - 40, Math.max(40, x)), y: Math.min(innerHeight - 40, Math.max(40, y)) });
  const seat = p => p && G ? document.querySelector(`[data-pi="${G.players.indexOf(p)}"]`) : null;
  function at(p) {
    const s = seat(p), el = s || $('.boardc');
    if (!el) return { x: innerWidth / 2, y: innerHeight / 2 };
    const r = el.getBoundingClientRect();
    return clampPt(r.left + r.width / 2, s ? r.top + r.height / 2 : r.top + 60);
  }
  function sparks(x, y, color, n = 14, spread = 90, size = 8, rise = 0) {
    if (RM.matches) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) {
      const el = spawn('spark', 0, 0), s = size * (.5 + Math.random());
      el.style.cssText += `;width:${s}px;height:${s}px;background:${color};box-shadow:0 0 ${s + 6}px ${color}`;
      const a = Math.random() * Math.PI * 2, d = spread * (.35 + Math.random() * .8);
      fire(el, [{ transform: `translate(${x}px,${y}px) translate(-50%,-50%)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d - rise}px) translate(-50%,-50%) scale(.15)`, opacity: 0 }],
        { duration: 450 + Math.random() * 450, easing: 'cubic-bezier(.15,.7,.3,1)' });
    }
  }
  function shake(n) {
    if (RM.matches || n <= 0) return;
    const k = [];
    for (let i = 0; i < 7; i++) { const f = n * (1 - i / 7); k.push({ transform: `translate(${(Math.random() - .5) * 2 * f}px,${(Math.random() - .5) * 2 * f}px)` }); }
    k.push({ transform: 'none' });
    $('#app').animate(k, { duration: 420, easing: 'ease-out' });
  }
  function seatFlash(p, color) {
    const el = seat(p); if (!el) return;
    const r = el.getBoundingClientRect(), f = spawn('seatflash', r.left, r.top);
    f.style.width = r.width + 'px'; f.style.height = r.height + 'px'; f.style.background = color;
    fire(f, [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 0 }], { duration: 650 });
  }
  function float(p, text, cls) {
    const { x, y } = at(p), el = spawn('float ' + cls, x + (Math.random() - .5) * 40, y - 10, text);
    fire(el, [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: 'translate(-50%,-80%) scale(1.35)', opacity: 1, offset: .15 },
      { transform: 'translate(-50%,-110%) scale(1)', opacity: 1, offset: .6 },
      { transform: 'translate(-50%,-190%) scale(.9)', opacity: 0 }], { duration: 1200, easing: 'ease-out' });
  }
  const screen = (cls, kf, ms) => fire(spawn('screen ' + cls, 0, 0), kf, { duration: ms });
  const pulse = [{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 0 }];
  function banner(title, sub, kind, ms) {
    const el = spawn('banner ' + kind, 0, '42%');
    const t = document.createElement('div'); t.className = 'b-title'; t.textContent = title; el.appendChild(t);
    if (sub) { const s = document.createElement('div'); s.className = 'b-sub'; s.textContent = sub; el.appendChild(s); }
    fire(el, [{ opacity: 0, transform: 'translateY(-50%) scaleY(.2)' }, { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .12 },
      { opacity: 1, transform: 'translateY(-50%) scaleY(1)', offset: .8 }, { opacity: 0, transform: 'translateY(-50%) scaleY(1.1)' }],
      { duration: ms, easing: 'ease-out' });
    return sleep(ms * .8);
  }

  // full-screen storm canvas: slanted rain + branching lightning strikes (each with thunder + flash); returns stop()
  function storm() {
    const cv = document.createElement('canvas');
    cv.className = 'fx storm-cv'; cv.width = innerWidth; cv.height = innerHeight;
    $('#fx').appendChild(cv);
    const g = cv.getContext('2d'), W = cv.width, H = cv.height;
    const rain = Array.from({ length: 180 }, () => ({ x: Math.random() * W * 1.2, y: Math.random() * H, l: 14 + Math.random() * 18, v: 16 + Math.random() * 12 }));
    const bolts = [];
    // midpoint displacement gives the jagged lightning shape
    function path(x0, y0, x1, y1, spread) {
      let pts = [[x0, y0], [x1, y1]];
      for (let gen = 0; gen < 6; gen++, spread /= 2) {
        const n = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          n.push([(ax + bx) / 2 + (Math.random() - .5) * spread, (ay + by) / 2 + (Math.random() - .5) * spread * .3], pts[i]);
        }
        pts = n;
      }
      return pts;
    }
    function strike(now) {
      // half the strikes land around the showcased card in the middle
      const near = Math.random() < .5;
      const x0 = Math.random() * W, x1 = near ? W / 2 + (Math.random() - .5) * Math.min(W * .5, 420) : Math.random() * W;
      const y1 = near ? H * (.3 + Math.random() * .4) : H * (.65 + Math.random() * .35);
      const main = path(x0, -10, x1, y1, Math.min(260, W * .25));
      const lines = [main];
      for (let b = 0; b < 1 + Math.floor(Math.random() * 3); b++) {
        const [sx, sy] = main[8 + Math.floor(Math.random() * (main.length - 16))];
        lines.push(path(sx, sy, sx + (Math.random() - .5) * 320, sy + 80 + Math.random() * 180, 90));
      }
      bolts.push({ lines, born: now, life: 380 });
      AUD.play('thunder', near);
      screen('flash', [{ opacity: 0 }, { opacity: near ? .45 : .28, offset: .1 }, { opacity: 0 }], 260);
      if (near) shake(7);
    }
    let next = performance.now() + 150, stopping = 0, raf;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!stopping && now >= next) { strike(now); next = now + 220 + Math.random() * 520; }
      g.clearRect(0, 0, W, H);
      g.strokeStyle = 'rgba(190,180,255,.28)'; g.lineWidth = 1.2; g.beginPath();
      for (const d of rain) {
        d.y += d.v; d.x -= d.v * .25;
        if (d.y > H) { d.y = -d.l; d.x = Math.random() * W * 1.2; }
        g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .25, d.y - d.l);
      }
      g.stroke();
      for (let i = bolts.length - 1; i >= 0; i--) {
        const b = bolts[i], age = now - b.born;
        if (age > b.life) { bolts.splice(i, 1); continue; }
        const a = (1 - age / b.life) * (age < 70 || Math.random() > .35 ? 1 : .35); // flicker
        b.lines.forEach((pts, k) => {
          for (const [w, col] of [[k ? 5 : 10, `rgba(170,110,255,${a * .35})`], [k ? 1.2 : 2.6, `rgba(255,255,255,${a})`]]) {
            g.lineWidth = w; g.strokeStyle = col; g.shadowColor = '#c9a0ff'; g.shadowBlur = 24;
            g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
          }
        });
        g.shadowBlur = 0;
      }
    }
    raf = requestAnimationFrame(frame);
    return () => {
      stopping = 1;
      cv.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => { cancelAnimationFrame(raf); cv.remove(); };
      setTimeout(() => { cancelAnimationFrame(raf); cv.remove(); }, 900);
    };
  }

  return {
    // a glowing bolt arcing from the caster's seat (or the board, for Chaos/Legends) to the target
    async bolt(from, to, color) {
      const a = at(from), b = at(to);
      if (RM.matches || Math.hypot(b.x - a.x, b.y - a.y) < 8) return;
      const dur = T(420), cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - Math.min(180, Math.hypot(b.x - a.x, b.y - a.y) * .35);
      const pt = u => ({ x: (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x, y: (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y });
      const orb = spawn('orb', 0, 0); orb.style.setProperty('--c', color);
      fire(orb, Array.from({ length: 9 }, (_, i) => { const p = pt(i / 8); return { transform: `translate(${p.x}px,${p.y}px) translate(-50%,-50%) scale(${.5 + i / 10})` }; }),
        { duration: dur, easing: 'ease-in' });
      for (let k = 1; k < 7; k++) setTimeout(() => { const p = pt(Math.pow(k / 7, 1.6)); sparks(p.x, p.y, color, 2, 16, 6); }, dur * k / 7);
      await sleep(dur);
      sparks(b.x, b.y, color, 10, 60, 9);
    },
    ring(p) {
      const { x, y } = at(p);
      [0, 120].forEach(delay => fire(spawn('ring', x, y), [{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
        { transform: 'translate(-50%,-50%) scale(1.9)', opacity: 0 }], { duration: 700, delay, easing: 'ease-out' }));
    },
    hit(t, n) {
      const { x, y } = at(t);
      seatFlash(t, 'rgba(229,72,95,.5)');
      float(t, '-' + n, n >= 4 ? 'dmg crit' : 'dmg');
      sparks(x, y, '#ff6a3d', 8 + n * 3, 50 + n * 14, 9);
      shake(t === G.players[0] ? 6 + n * 2 : n >= 3 ? 2 + n * 1.5 : 0);
    },
    heal(p, n) { const { x, y } = at(p); float(p, '+' + n, 'heal'); sparks(x, y, '#7dffa0', 10, 50, 6, 60); },
    curse(t) { const { x, y } = at(t); float(t, 'Limp Wand', 'curse'); sparks(x, y, '#b07cff', 8, 40, 6); },
    coins(r, p) {
      if (!r || RM.matches) return;
      const a = clampPt(r.left + r.width / 2, r.top + r.height / 2), b = at(p);
      sparks(a.x, a.y, '#f0c35a', 12, 70, 7);
      for (let i = 0; i < 7; i++) {
        const ox = (Math.random() - .5) * 60, oy = (Math.random() - .5) * 60;
        fire(spawn('spark coin', 0, 0), [{ transform: `translate(${a.x + ox}px,${a.y + oy}px) translate(-50%,-50%)`, opacity: 1 },
          { transform: `translate(${(a.x + b.x) / 2}px,${Math.min(a.y, b.y) - 80}px) translate(-50%,-50%) scale(1.3)`, opacity: 1 },
          { transform: `translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.4)`, opacity: 0 }],
          { duration: 700, delay: i * 45, easing: 'ease-in-out' });
      }
    },
    kill(t, tok) {
      const { x, y } = at(t);
      screen('vig-red', pulse, T(1400)); shake(18); Embers.surge();
      sparks(x, y, '#ff3b4f', 30, 200, 11); sparks(x, y, '#efe6d6', 14, 140, 6);
      return banner(`☠ ${t.name} ตาย!`, `เหรียญพ่อมดตาย: ${tok.name}`, 'kill', T(1500));
    },
    turn(p) {
      if (p.isAI) { banner(`เทิร์นของ ${p.name}`, '', 'turn small', T(800)); return null; }
      banner('เทิร์นของคุณ!', 'ร่ายเวท ซื้อการ์ด ถล่มศัตรู', 'turn', 1100);
      return sleep(450);
    },
    legend(L) {
      screen('vig-blood', pulse, T(2000)); shake(10); Embers.surge();
      return banner('ตำนานปรากฏ!', `${L.name} · ${L.group}`, 'legend', T(2000));
    },
    legendWin(p, L) {
      const { x, y } = at(p);
      sparks(innerWidth / 2, innerHeight * .42, '#f0c35a', 40, 260, 10); sparks(x, y, '#f0c35a', 20, 120, 8); shake(6); Embers.surge();
      return banner('ล้มตำนาน!', `${p.name} พิชิต ${L.name}`, 'gold', T(1600));
    },
    // Chaos: the card is held big in the middle of a lightning storm long enough to read; click skips
    async chaos(c) {
      const hold = 3600;
      const sky = spawn('screen storm', 0, 0);
      sky.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
      const stopStorm = RM.matches ? () => {} : storm();
      AUD.play('rain', hold / 1000 + 1.2);
      shake(12);
      const box = spawn('chaos-show', 0, 0);
      box.innerHTML = `<div class="cs-title">โกลาหล!</div><div class="cs-card">${cardHTML(c)}</div><div class="cs-hint">คลิกที่ใดก็ได้เพื่อไปต่อ</div>`;
      box.querySelector('.cs-card').style.setProperty('--k', Math.max(1.2, Math.min(2.4, innerHeight * .55 / 190, innerWidth * .8 / 132)).toFixed(2));
      let skip;
      const clicked = new Promise(r => { skip = r; });
      box.addEventListener('pointerdown', () => skip());
      await Promise.race([sleep(hold), clicked]);
      stopStorm();
      for (const el of [sky, box]) {
        el.style.pointerEvents = 'none';
        el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: 'forwards' }).onfinish = () => el.remove();
        setTimeout(() => el.remove(), 900);
      }
      await sleep(250);
    },
    victory(win, name) {
      banner(win ? 'ชัยชนะ!' : `${name} ชนะ`, win ? 'คุณคือจอมเวทสูงสุดแห่งสนามประลอง' : 'สนามประลองยังรอการล้างแค้น', win ? 'win' : 'lose', 3200);
      if (!win || RM.matches) return;
      Embers.surge();
      for (let i = 0; i < 70; i++) {
        const el = spawn('spark', 0, 0), s = 4 + Math.random() * 8, x = Math.random() * innerWidth;
        el.style.cssText += `;width:${s}px;height:${s}px;background:hsl(${30 + Math.random() * 30} 95% 60%);box-shadow:0 0 10px hsl(40 95% 60%)`;
        fire(el, [{ transform: `translate(${x}px,-20px)` }, { transform: `translate(${x + (Math.random() - .5) * 200}px,${innerHeight + 40}px)` }],
          { duration: 1800 + Math.random() * 1800, delay: Math.random() * 1200, easing: 'cubic-bezier(.3,0,.7,1)' });
      }
    },
  };
})();

async function pickTarget(p, list, spec) {
  if (list.length === 1) return list[0];
  if (p.isAI) {
    if (list.length > 1) list = list.filter(t => t !== p); // the AI never targets itself
    const d = typeof spec.dmg === 'number' ? spec.dmg : 0;
    const killable = list.filter(t => t.hp <= d);
    const pool = killable.length ? killable : list;
    return pool.slice().sort((a, b) => a.hp - b.hp || (b.isAI ? -1 : 1))[0];
  }
  return humanChoose(spec.label || `เลือกเป้าหมาย (${G.curLabel})`, list.map(t => ({ label: `${t === p ? 'ตัวคุณเอง' : t.name} · ${t.hp} HP`, value: t })));
}

async function attack(src, spec) {
  const pool = src && !spec.includeSelf ? opps(src) : G.players.slice(); // includeSelf: the attacker may pick themself
  let targets = [];
  switch (spec.to) {
    case 'choose': targets = [await pickTarget(src, spec.among ? pool.filter(spec.among) : pool, spec)]; break; // among: limit who can be picked
    case 'left': targets = [leftOf(src)]; break;
    case 'right': targets = [rightOf(src)]; break;
    case 'random': targets = [pool[rnd(pool.length)]]; break;
    case 'where': targets = pool.filter(spec.where); break; // every opponent matching spec.where(t)
    case 'lr': { const l = leftOf(src), r = rightOf(src); targets = l === r ? [l] : [l, r]; break; }
    case 'each': case 'all': targets = pool; break;
    case 'strongest': case 'weakest': {
      const f = spec.to === 'strongest' ? Math.max : Math.min;
      const m = f(...pool.map(x => x.hp)); const c = pool.filter(x => x.hp === m);
      targets = [src && c.length > 1 ? await pickTarget(src, c, spec) : c[0]]; break;
    }
  }
  let bonus = 0;
  if (src && src === cur()) {
    G.turn.attacked = true;
    if (src.trait.id === 'ember' && !G.turn.emberUsed && spec.dmg) { bonus = 1; G.turn.emberUsed = true; }
  }
  const color = !spec.dmg ? (spec.bent ? '#b07cff' : '#59c2c7') : spec.chaos ? '#c27dff' : src ? '#ff7a3d' : '#ff3355';
  AUD.play('cast');
  await Promise.all(targets.map(t => FX.bolt(src, t, color)));
  let kills = 0;
  for (const t of targets) {
    const d = spec.unblockable ? null : await tryDefend(t, src, spec);
    if (d && spec.onDodge) await spec.onDodge(t); // onDodge(t): target avoided or reflected the attack
    if (d === 'avoid') continue;
    // spec.dmg may be a function: damage worked out per target, after defence (e.g. revealed card's cost)
    const dmgFor = async who => typeof spec.dmg === 'function' ? await spec.dmg(who) : (spec.dmg || 0);
    if (d === 'redirect') {
      const n = await dmgFor(src);
      if (n) { log(`${t.name} สะท้อน ${n} ดาเมจกลับไปหา ${src.name}!`, 'dmg'); await FX.bolt(t, src, '#59c2c7'); await damage(src, n, t); }
      continue;
    }
    const n = await dmgFor(t);
    t.lastDmg = 0;
    if (n && await damage(t, n + bonus, src || spec.by, { tokenPick: spec.tokenPick })) { kills++; if (spec.onKill) await spec.onKill(t); }
    if (spec.onHit && t.lastDmg) await spec.onHit(t, t.lastDmg); // onHit(t, dealt): after damage lands
    for (let i = 0; i < (spec.bent || 0); i++) gainBent(t);
    if (spec.discard) await discardFromHand(t, spec.discard);
    render(); await sleep(AI_DELAY / 3);
  }
  return kills;
}

function describe(spec) {
  const a = [];
  if (spec.dmgText) a.push(spec.dmgText);
  else if (spec.dmg) a.push(`${spec.dmg} ดาเมจ`);
  if (spec.bent) a.push('ได้ Limp Wand');
  if (spec.discard) a.push(`ทิ้งการ์ด ${spec.discard} ใบ`);
  return a.join(' + ');
}

async function tryDefend(t, src, spec) {
  if (spec.chaos && t.tokens.some(k => k.id === 'cursed')) return null;
  // each defence card works once per turn (G.turn is replaced at the start of every turn)
  const used = G.turn.defUsed ||= [];
  const defs = t.hand.filter(c => c.def && !used.includes(c));
  if (!defs.length) return null;
  let choice;
  if (t.isAI) {
    choice = defs.slice().sort((a, b) => (b.redirect && src ? 1 : 0) - (a.redirect && src ? 1 : 0))[0];
  } else {
    const who = src ? src.name : (G.curLabel || 'โกลาหล');
    choice = await humanChoose(`${who} โจมตีคุณ!`, [
      ...defs.map(c => ({ card: c, value: c })), { label: 'ไม่ป้องกัน รับการโจมตี', value: null, ghost: true }],
      `${G.curLabel}: ${describe(spec)} · เลือกการ์ดป้องกันจากมือ (ใช้ได้ 1 ใบต่อการโจมตี · แต่ละใบใช้ได้ครั้งเดียวต่อเทิร์น)`);
  }
  if (!choice) return null;
  used.push(choice);
  log(`${t.name} ป้องกันด้วย ${choice.name}`, 'good');
  AUD.play(choice.redirect && src ? 'reflect' : 'shield'); FX.ring(t);
  if (choice.defDiscard) { t.hand.splice(t.hand.indexOf(choice), 1); t.discard.push(choice); }
  // defTopdeck: the card goes face up on top of the deck, so it comes back with the next draw
  if (choice.defTopdeck) { t.hand.splice(t.hand.indexOf(choice), 1); t.deck.push(choice); log(`${choice.name} หงายอยู่บนสุดของเด็ค ${t.name}`); }
  if (choice.onDefend) await choice.onDefend(t, src, choice);
  return choice.redirect && src ? 'redirect' : 'avoid';
}

async function damage(t, n, killer, opts) {
  if (t.trait.id === 'iron' && !t.ironUsed && n > 0) { n -= 1; t.ironUsed = true; }
  t.lastDmg = Math.max(0, n); // damage actually dealt, read by spec.onHit
  if (n <= 0) return false;
  t.hp -= n; t.hitFlash = true;
  log(`${t.name} รับ ${n} ดาเมจ (${Math.max(t.hp, 0)} HP)`, 'dmg');
  render();
  AUD.play('impact', n); FX.hit(t, n);
  if (t.hp < 1) { await kill(t, killer, opts); return true; }
  return false;
}

// how much the killer likes the victim getting each token (AI picks the highest)
const TOKEN_SPITE = { weak: 3, hexk: 3, cursed: 2, tax: 2, plain: 1, insight: 0, haunt: -1, second: -2, bitter: -2, veng: -3 };
// reveal n Dead Wizard tokens, the killer gives one to the victim, the rest are shuffled back
async function pickToken(t, killer, n) {
  const shown = G.tokens.splice(-n).reverse();
  log(`${killer.name} เปิดเหรียญพ่อมดตาย ${shown.length} อัน: ${shown.map(k => k.name).join(', ')}`, 'sys');
  const tok = killer.isAI
    ? shown.slice().sort((a, b) => (TOKEN_SPITE[b.id] || 0) - (TOKEN_SPITE[a.id] || 0))[0]
    : await humanChoose(`เลือกเหรียญพ่อมดตายให้ ${t.name}`, shown.map(k => ({ label: `${k.name}: ${k.text}`, value: k })),
      'อันที่ไม่ได้เลือกจะถูกสับกลับเข้ากอง');
  shown.splice(shown.indexOf(tok), 1);
  G.tokens.push(...shown); shuffle(G.tokens);
  log(`${killer.name} เลือก “${tok.name}” ให้ ${t.name}`, 'sys');
  return tok;
}
// Friendality: on the killer's next kill this turn they may take the Dead Wizard token themself and gain a Legend
async function offerFriendality(t, killer) {
  if (!(killer && killer !== t && killer === cur() && G.turn.friendality > 0)) return false;
  G.turn.friendality--;
  const L = G.legends[0];
  if (!L) { log('Friendality: ไม่มีตำนานเหลือให้รับ'); return false; }
  const yes = killer.isAI ? L.vp >= 4
    : await humanChoose(`Friendality! ไว้ชีวิต ${t.name}?`, [{ label: `ใช่ · คุณรับเหรียญพ่อมดตายแทน และได้ ${L.name}`, value: true }, { label: 'ไม่ · ให้เขารับเหรียญตามปกติ', value: false, ghost: true }],
      `${cardHTML(L, { small: true })}<br>เหรียญพ่อมดตายแต่ละอัน -3 VP ตอนจบเกม`);
  if (yes) log(`${killer.name} ใช้ Friendality! รับเหรียญพ่อมดตายแทน ${t.name}`, 'sys');
  return yes;
}
async function gainTopLegend(p) {
  const L = G.legends.shift(); if (!L) return;
  if (G.legendUp) G.legendUp = false; // like buying it: the next Legend appears at end of turn
  placeGained(p, L); gainedCard(p, L);
  log(`${p.name} ได้ตำนาน ${L.name}!`, 'sys'); AUD.play('legendWin'); render(); await FX.legendWin(p, L);
  await cometStrike(p, L);
}
async function kill(t, killer, { tokenPick = 0 } = {}) {
  const swap = await offerFriendality(t, killer);
  const tok = (!swap && tokenPick > 1 && killer && killer !== t && G.tokens.length > 1 ? await pickToken(t, killer, tokenPick) : G.tokens.pop())
    || { id:'plain', name:'หลุมศพธรรมดา', text:'ไม่มีผลเพิ่ม' };
  (swap ? killer : t).tokens.push(tok);
  t.hp = swap ? 20 : tok.respawn || 20;
  log(swap ? `☠ ${t.name} ตาย! (โดย ${killer.name}) · ${killer.name} รับเหรียญพ่อมดตาย “${tok.name}” แทน · ${t.name} ฟื้นคืนชีพที่ ${t.hp} HP`
    : `☠ ${t.name} ตาย!${killer && killer !== t ? ` (โดย ${killer.name})` : ''} ได้รับเหรียญพ่อมดตาย “${tok.name}”: ${tok.text} · ฟื้นคืนชีพที่ ${t.hp} HP`, 'kill');
  AUD.play('kill'); render(); await FX.kill(t, swap ? { name: `${tok.name} (${killer.name} รับแทน)` } : tok);
  if (killer && killer !== t) {
    if (G.trophy !== killer) { G.trophy = killer; log(`${killer.name} ได้ถ้วยรางวัลแชมป์ (จั่ว 6 ทิ้ง 1 ตอนจบเทิร์น)`, 'sys'); }
    if (killer.trait.id === 'bone') { heal(killer, 3); await draw(killer, 1); }
  }
  if (tok.now) await (swap ? tok.now(killer, null) : tok.now(t, killer));
  if (swap) await gainTopLegend(killer);
  if (G.tokens.length === 0 && !G.ending) { G.ending = 'เหรียญพ่อมดตายหมดกอง'; log('เหรียญพ่อมดตายหมดแล้ว! เกมจะจบเมื่อจบเทิร์นนี้', 'sys'); }
  render();
}

async function discardFromHand(t, n) {
  for (let i = 0; i < n && t.hand.length; i++) {
    let c;
    if (t.isAI) c = t.hand.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
    else c = await humanChoose('ทิ้งการ์ดจากมือ 1 ใบ', t.hand.map(x => ({ card: x, value: x })));
    t.hand.splice(t.hand.indexOf(c), 1); t.discard.push(c);
    log(`${t.name} ทิ้ง ${c.name}`); AUD.play('discard');
  }
}

// junk the AI is happy to destroy: Limp Wand, Fizzle, and Rune once the deck is big enough
const isJunk = p => x => x.id === 'bent' || x.id === 'fizzle' || (x.id === 'rune' && allCards(p).length > 16);
// destroy up to n cards from p's hand, one at a time; the human may stop early
async function destroyFromHand(p, n) {
  for (let k = 0; k < n && p.hand.length; k++) {
    const c = p.isAI ? p.hand.find(isJunk(p)) || null
      : await humanChoose(`ทำลายการ์ดในมือ (${k + 1}/${n})`, [...p.hand.map(x => ({ card: x, value: x })), { label: 'พอแล้ว', value: null, ghost: true }],
        'การ์ดที่ถูกทำลายจะออกจากเกมถาวร');
    if (!c) break;
    p.hand.splice(p.hand.indexOf(c), 1); G.destroyed.push(c);
    log(`${p.name} ทำลาย ${c.name}`); AUD.play('destroy'); render();
  }
}
// Ongoing cards with sacrifice(): destroy the card itself to use its effect, any time on your turn
async function sacrificeCard(p, uid) {
  const c = p.ongoing.find(x => x.uid === uid && x.sacrifice);
  if (!c) return false;
  p.ongoing.splice(p.ongoing.indexOf(c), 1); G.destroyed.push(c);
  G.curLabel = c.name; log(`${p.name} ทำลาย ${c.name} เพื่อใช้ผล`, 'sys'); AUD.play('destroy'); render();
  await c.sacrifice(p, c);
  render();
  return true;
}
async function destroyOwn(p, { discardOnly = false } = {}) {
  const pool = discardOnly ? [...p.discard] : [...p.hand, ...p.discard];
  if (!pool.length) return null;
  let c;
  if (p.isAI) c = pool.find(x => x.id === 'bent') || pool.find(x => x.id === 'fizzle') || (allCards(p).length > 16 ? pool.find(x => x.id === 'rune') : null) || null;
  else c = await humanChoose(`ทำลายการ์ด 1 ใบ (${discardOnly ? 'จากกองทิ้ง' : 'จากมือหรือกองทิ้ง'})`, [...pool.map(x => ({ card: x, value: x })), { label: 'ไม่ทำลาย', value: null, ghost: true }],
    'การ์ดที่ถูกทำลายจะออกจากเกมถาวร · ทำลาย Fizzle / Limp Wand ช่วยให้เด็คดีขึ้น');
  if (!c) return null;
  const arr = p.hand.includes(c) ? p.hand : p.discard;
  arr.splice(arr.indexOf(c), 1); G.destroyed.push(c);
  log(`${p.name} ทำลาย ${c.name}`); AUD.play('destroy');
  render();
  return c;
}

async function destroyOngoing(t) {
  if (!t.ongoing.length) return;
  let c;
  if (t.isAI) c = t.ongoing.slice().sort((a, b) => a.cost - b.cost)[0];
  else c = await humanChoose('แผ่นดินไหว! ทำลายการ์ดต่อเนื่อง 1 ใบ', t.ongoing.map(x => ({ card: x, value: x })));
  t.ongoing.splice(t.ongoing.indexOf(c), 1); G.destroyed.push(c);
  log(`${t.name} เสีย ${c.name}`, 'dmg'); AUD.play('destroy');
}

async function gainFromLineup(p, max) {
  const opts = G.lineup.map((c, i) => ({ c, i })).filter(o => o.c && o.c.cost <= max && canOwn(p, o.c));
  if (!opts.length) { log('ไม่มีการ์ดใน Line-Up ที่รับได้'); return; }
  let pick;
  if (p.isAI) pick = opts.sort((a, b) => b.c.cost + b.c.vp - a.c.cost - a.c.vp)[0];
  else pick = await humanChoose(`รับการ์ดราคาไม่เกิน ${max} ฟรี`, opts.map(o => ({ card: o.c, value: o })));
  G.lineup[pick.i] = null; placeGained(p, pick.c); gainedCard(p, pick.c);
  await cometStrike(p, pick.c);
  log(`${p.name} รับ ${pick.c.name} ฟรี`, 'good');
}

/* ✲ เปิดใช้: text before ✲ resolves on play; the ✲ part (card.activate) can be used once, whenever the
   player chooses later that turn, if card.canActivate(p) allows it. Unused abilities lapse at end of turn. */
const canUse = (p, c) => !c.canActivate || c.canActivate(p);
async function activateCard(p, uid) {
  const c = (G.turn.ready || []).find(x => x.uid === uid);
  if (!c || !canUse(p, c)) return false;
  G.turn.ready.splice(G.turn.ready.indexOf(c), 1);
  G.curLabel = c.name;
  log(`${p.name} ✲ เปิดใช้ ${c.name}`, 'sys'); AUD.play('power');
  render();
  await c.activate(p, c);
  render();
  return true;
}
async function playCard(p, card, { fromOther = null } = {}) {
  if (!fromOther) p.hand.splice(p.hand.indexOf(card), 1);
  G.turn.types[card.type] = (G.turn.types[card.type] || 0) + 1;
  G.curLabel = card.name;
  G.turn.shown.push(card);
  log(`${p.name} ใช้ ${card.name}`);
  AUD.play('card');
  if (card.power) { P(p, card.power); AUD.play('power'); }
  if (card.ongoing && !fromOther) p.ongoing.push(card); else if (!fromOther) G.turn.played.push(card);
  render();
  if (card.play) await card.play(p, card);
  if (card.activate) (G.turn.ready ||= []).push(card); // ✲ ability: usable once, any time later this turn
  if (fromOther) fromOther.discard.push(card);
  render();
}

async function buy(p, src, i) {
  let card;
  if (src === 'lineup') card = G.lineup[i];
  else if (src === 'wild') card = G.wild > 0 ? make('wild') : null;
  else if (src === 'legend') card = G.legendUp ? G.legends[0] : null;
  else if (src === 'familiar') card = p.familiar;
  if (!card) return false;
  if (!canOwn(p, card)) { if (!p.isAI) log(`มี ${card.name} ได้คนละ 1 ใบเท่านั้น`); return false; }
  const k = costFor(p, card);
  if (k > G.turn.power) return false;
  const slot = document.querySelector(src === 'lineup' ? `[data-src="lineup"][data-i="${i}"]` : `[data-src="${src}"]`);
  const from = slot && slot.getBoundingClientRect();
  G.turn.power -= k;
  if (src === 'lineup') G.lineup[i] = null;
  if (src === 'wild') G.wild--;
  if (src === 'legend') { G.legends.shift(); G.legendUp = false; }
  if (src === 'familiar') p.familiar = null;
  placeGained(p, card);
  log(`${p.name} ซื้อ ${card.name} (${k})`, src === 'legend' ? 'sys' : '');
  if (src === 'legend') { log(`${p.name} ล้มตำนาน ${card.name} ได้!`, 'sys'); AUD.play('legendWin'); render(); await FX.legendWin(p, card); }
  else { AUD.play('buy'); FX.coins(from, p); }
  if (card.type === 'spell' && p.trait.id === 'mind' && !G.turn.mindUsed) { G.turn.mindUsed = true; await draw(p, 1); }
  gainedCard(p, card);
  await cometStrike(p, card);
  render();
  return true;
}

/* ---------------- turn flow ---------------- */
async function refillLineup() {
  for (let i = 0; i < 5; i++) {
    while (!G.lineup[i]) {
      if (!G.main.length) { G.ending = 'การ์ดในกองหลักไม่พอเติม Line-Up'; return; }
      const c = G.main.pop();
      if (c.type === 'chaos') {
        G.curLabel = c.name;
        log(`โกลาหล! ${c.name}: ${c.text.replace(/<[^>]+>/g, '')}`, 'sys');
        G.chaosShown = c; render(); AUD.play('chaos'); await FX.chaos(c);
        await c.chaos();
        G.destroyed.push(c); G.chaosShown = null;
      } else G.lineup[i] = c;
    }
  }
}

async function startTurn(p) {
  G.turn = { power: 0, played: [], shown: [], types: {}, attacked: false };
  p.ironUsed = false;
  log(`เทิร์นของ ${p.name}`, 'turn');
  render();
  await refillLineup(); if (G.ending) return;
  AUD.play(p.isAI ? 'turnAI' : 'turnMe'); await FX.turn(p);
  for (const c of p.ongoing.slice()) if (c.onStart) { G.curLabel = c.name; await c.onStart(p); }
  for (const k of p.tokens) if (k.start) await k.start(p);
  if (standHolder() === p) {
    G.curLabel = 'Cthulhu stand';
    log(`Cthulhu stand ของ ${p.name} ตื่นขึ้น!`, 'sys');
    for (let i = 0; i < 2; i++) {
      const os = opps(p), t = os[rnd(os.length)];
      AUD.play('cast'); await FX.bolt(p, t, '#3fd0a0');
      await damage(t, 1, p);
    }
  }
  if (p.trait.id === 'coin' && p.hand.some(c => c.type === 'treasure')) { P(p, 1); log(`${p.name} (Coin Witch) +1 พลัง`); }
  render();
}

async function endTurn(p) {
  p.lastPlayed = G.turn.shown.slice();
  p.discard.push(...p.hand, ...G.turn.played); p.hand = []; G.turn.played = [];
  if (p.trait.id === 'monk' && !G.turn.attacked) heal(p, 2);
  G.turn.power = 0;
  if (G.trophy === p) {
    await draw(p, 6);
    let c;
    if (p.isAI) c = p.hand.slice().sort((a, b) => aiVal(a) - aiVal(b))[0];
    else c = await humanChoose('ถ้วยรางวัลแชมป์: ทิ้งการ์ด 1 ใบ', p.hand.map(x => ({ card: x, value: x })), 'คุณจั่ว 6 ใบ ทิ้ง 1 เพื่อให้เหลือ 5');
    if (c) { p.hand.splice(p.hand.indexOf(c), 1); p.discard.push(c); }
  } else await draw(p, 5);
  if (!G.legendUp && !G.ending) {
    if (!G.legends.length) G.ending = 'ล้มตำนานครบทุกตนแล้ว';
    else {
      G.legendUp = true;
      const L = G.legends[0];
      G.curLabel = L.name + ' (Group Attack)';
      log(`ตำนาน ${L.name} ปรากฏ! Group Attack: ${L.group}`, 'sys');
      render(); AUD.play('legendUp'); await FX.legend(L);
      if (L.gattack) await L.gattack();
    }
  }
  render();
}

async function aiTurn(p) {
  await wait();
  for (const c of p.ongoing.slice()) if (c.sacrifice && c.aiSacrifice && c.aiSacrifice(p)) { await sacrificeCard(p, c.uid); await wait(); }
  const pri = c => c.playFirst ? -1 : c.playLate ? 3 : c.draws ? 0 : c.atk ? 2 : 1;
  do {
    while (p.hand.length) {
      const c = p.hand.slice().sort((a, b) => pri(a) - pri(b))[0];
      await playCard(p, c); await wait();
    }
    for (const c of (G.turn.ready || []).slice()) if (canUse(p, c)) { await activateCard(p, c.uid); await wait(); }
  } while (p.hand.length);
  while (true) {
    const opts = [];
    G.lineup.forEach((c, i) => { if (c && canOwn(p, c) && costFor(p, c) <= G.turn.power) opts.push({ src:'lineup', i, s: vpIfBought(c, p) * 3 + c.cost * 2 + (c.atk ? 2 : 0) + (c.def ? 1 : 0) }); });
    if (G.legendUp && G.legends[0] && G.legends[0].cost <= G.turn.power) opts.push({ src:'legend', s: 1000 });
    if (p.familiar && costFor(p, p.familiar) <= G.turn.power) opts.push({ src:'familiar', s: p.familiar.cost * 2 + p.familiar.vp * 3 + 3 });
    if (G.wild > 0 && costFor(p, DEFS.wild) <= G.turn.power) opts.push({ src:'wild', s: 5 });
    if (!opts.length) break;
    // save up for a Legend when close
    const L = G.legendUp && G.legends[0];
    opts.sort((a, b) => b.s - a.s);
    if (!(await buy(p, opts[0].src, opts[0].i))) break;
    await wait();
    if (L && L !== G.legends[0]) break;
  }
}

function humanTurn() {
  return new Promise(res => { G.endTurnResolve = res; render(); });
}

async function runGame() {
  const myGame = G;
  while (G === myGame) {
    const p = cur();
    await startTurn(p);
    if (G !== myGame) return;
    if (!G.ending) { if (p.isAI) await aiTurn(p); else await humanTurn(p); }
    if (G !== myGame) return;
    await endTurn(p);
    if (G.ending) return finish();
    G.cur = (G.cur + 1) % G.players.length;
  }
}

function finish() {
  G.over = true;
  const rows = G.players.map(p => {
    const cards = allCards(p);
    const vp = cards.reduce((s, c) => s + Math.max(0, vpOf(c, p)), 0);
    const bents = cards.filter(c => c.id === 'bent').length;
    const legends = cards.filter(c => c.type === 'legend').length;
    const total = vp - bents - p.tokens.length * 3;
    return { p, vp, bents, legends, tokens: p.tokens.length, total };
  }).sort((a, b) => b.total - a.total || b.legends - a.legends || a.tokens - b.tokens);
  log(`เกมจบ: ${G.ending}`, 'sys');
  render();
  const win = rows[0].p === G.players[0];
  AUD.play(win ? 'victory' : 'defeat'); FX.victory(win, rows[0].p.name);
  const m = $('#modal'); m.hidden = false;
  $('#m-title').textContent = `${rows[0].p.name} ชนะ!`;
  $('#m-sub').innerHTML = `เกมจบเพราะ${G.ending}`;
  $('#m-opts').innerHTML = `<div class="tablewrap" style="width:100%"><table class="score"><tr><th>พ่อมด</th><th>VP การ์ด</th><th>Limp Wand</th><th>เหรียญตาย (×3)</th><th>ตำนาน</th><th>รวม</th></tr>
    ${rows.map((r, i) => `<tr class="${i === 0 ? 'win' : ''}"><td>${r.p.name}</td><td>${r.vp}</td><td>-${r.bents}</td><td>-${r.tokens * 3}</td><td>${r.legends}</td><td>${r.total}</td></tr>`).join('')}</table></div>
    <button class="btn" id="again">เล่นอีกครั้ง</button>`;
  $('#m-opts').onclick = e => { if (e.target.id === 'again') { m.hidden = true; showSetup(); } };
}

/* ---------------- setup ---------------- */
function newGame(name, nAI) {
  uidc = 1;
  const traits = shuffle(TRAITS.slice()), fams = shuffle(FAMILIARS.slice());
  const aiNames = shuffle(['Morla the Moist', 'Quibb Tallhat', 'Snaggle Fenwick', 'Dame Gristle']);
  const players = [];
  for (let i = 0; i <= nAI; i++) {
    const deck = [];
    for (let k = 0; k < 6; k++) deck.push(make('rune'));
    deck.push(make('wand'));
    for (let k = 0; k < 3; k++) deck.push(make('fizzle'));
    players.push({ name: i === 0 ? name : aiNames[i - 1], isAI: i > 0, hp: 20, deck: shuffle(deck), hand: [], discard: [], ongoing: [],
      tokens: [], trait: traits[i], famChoices: [make(fams[i * 2]), make(fams[i * 2 + 1])], familiar: null });
  }
  const main = [];
  for (const [id, n] of Object.entries(MAIN)) for (let k = 0; k < n; k++) main.push(make(id));
  shuffle(main);
  const nLeg = { 2:5, 3:6, 4:7, 5:8 }[players.length];
  const tokPool = [];
  for (let k = 0; k < players.length * 4; k++) tokPool.push({ ...TOKENS[rnd(TOKENS.length)] });
  G = { players, cur: 0, main, lineup: [null, null, null, null, null], wild: 16, bent: 16, destroyed: [], log: [],
    legends: [make('grimbald'), ...shuffle(LEGENDS.slice()).slice(0, nLeg).map(make)], legendUp: true,
    tokens: shuffle(tokPool), trophy: null, turn: { power: 0, played: [], shown: [], types: {} }, ending: null, busy: false, curLabel: '' };
  // initial line-up has no Chaos
  const chaos = [];
  while (G.lineup.includes(null)) {
    const c = G.main.pop();
    if (c.type === 'chaos') chaos.push(c); else G.lineup[G.lineup.indexOf(null)] = c;
  }
  G.main.push(...chaos); shuffle(G.main);
  players.forEach(p => { for (let k = 0; k < 5; k++) p.hand.push(p.deck.pop()); });
  G.cur = rnd(players.length);
}

async function startGame(name, nAI) {
  newGame(name, nAI);
  const me = G.players[0];
  for (const p of G.players) {
    if (p.isAI) p.familiar = p.famChoices[rnd(2)];
  }
  render();
  me.familiar = await humanChoose('เลือกสัตว์รับใช้ของคุณ', me.famChoices.map(c => ({ card: c, value: c })),
    `ความสามารถพ่อมดของคุณ: <b>${me.trait.name}</b> — ${me.trait.text}<br>สัตว์รับใช้วางข้างตัวคุณ มีแค่คุณที่ซื้อได้`);
  log(`เริ่มเกม! ${G.players[G.cur].name} เล่นก่อน`, 'sys');
  runGame();
}

let modalStack = null;
function humanChoose(title, options, sub = '') {
  return new Promise(res => {
    const m = $('#modal'); m.hidden = false;
    $('#m-title').textContent = title; $('#m-sub').innerHTML = sub;
    const box = $('#m-opts');
    box.innerHTML = options.map((o, i) => o.card
      ? `<div class="opt-card" data-i="${i}">${cardHTML(o.card, { small: true })}</div>`
      : `<button class="btn ${o.ghost ? 'ghost' : ''}" data-i="${i}">${o.label}</button>`).join('');
    box.onclick = e => {
      const el = e.target.closest('[data-i]'); if (!el) return;
      m.hidden = true; box.onclick = null; res(options[+el.dataset.i].value);

function cardHTML(c, o = {}) {
  const cls = ['card', 't-' + c.type];
  if (o.buy) cls.push('buyable'); if (o.play) cls.push('playable'); if (o.dim) cls.push('dim');
  if (o.small) cls.push('small'); if (o.mini) cls.push('mini'); if (o.cls) cls.push(o.cls);
  const tags = [];
  if (c.atk) tags.push('<span class="tag atk">โจมตี</span>');
  if (c.def) tags.push('<span class="tag def">ป้องกัน</span>');
  if (c.ongoing) tags.push('<span class="tag ong">ต่อเนื่อง</span>');
  if (c.activate) tags.push('<span class="tag act">✲</span>');
  if (c.unique) tags.push('<span class="tag uniq" title="ผู้เล่นแต่ละคนมีการ์ดนี้ได้ 1 ใบ">1 ใบ/คน</span>');
  const cost = o.cost != null ? o.cost : (c.cost || '');
  const vp = c.vpCalc ? '<span class="c-vp" title="VP เปลี่ยนตามเงื่อนไขตอนจบเกม">★? VP</span>'
    : c.vp ? `<span class="c-vp">${c.vp > 0 ? '★' + c.vp : c.vp} VP</span>` : '';
  const extra = c.type === 'legend' && c.group && c.group !== '—' ? `<br><i>เมื่อปรากฏ: ${c.group}</i>` : '';
  return `<div class="${cls.join(' ')}" ${o.attrs || ''} ${o.attrs ? 'tabindex="0"' : ''} title="${c.name}">
    <div class="c-head"><span class="c-cost">${cost}</span><span class="c-name">${c.name}</span></div>
    <div class="c-art art-${c.id}"></div>
    <div class="c-type">${TYPE_TH[c.type]}</div>
    <div class="c-text">${c.text || ''}${extra}</div>
    <div class="c-foot"><span>${tags.join('')}</span>${vp}</div></div>`;
}

const hpPct = p => Math.max(0, Math.min(100, p.hp / 25 * 100));
function chipsFor(p) {
  const a = [];
  if (G.trophy === p) a.push('<span class="chip trophy">ถ้วยแชมป์</span>');
  if (standHolder() === p) a.push('<span class="chip trophy" title="ต้นเทิร์น: ศัตรูแบบสุ่มรับ 1 ดาเมจ 2 ครั้ง (ป้องกันไม่ได้)">Cthulhu stand</span>');
  if (p.tokens.length) a.push(`<span class="chip skull" title="${p.tokens.map(t => t.name + ': ' + t.text).join('\n')}">☠ ×${p.tokens.length}</span>`);
  const leg = allCards(p).filter(c => c.type === 'legend').length;
  if (leg) a.push(`<span class="chip">ตำนาน ×${leg}</span>`);
  return a.join('');
}
